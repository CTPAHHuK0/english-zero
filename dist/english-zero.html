<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Английский с нуля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Английский с самого нуля: буквы, звуки, чтение, фразы и истории. По 5–15 минут в день.">
<meta name="theme-color" content="#16203A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app (max 560px). The course is drawn as a transit route:
   each unit is a station, each kind of unit is its own colored line. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E7EBF2;
  --ink: #16203A;
  --ink-2: #5A6480;
  --line: #D6DCE7;
  --accent: #FFC21A;
  --accent-ink: #241A00;
  --accent-edge: #D69A00;
  --accent-soft: #FFF2C6;
  --read: #E25F17;
  --talk: #2266D3;
  --gram: #0E9466;
  --story: #B4317F;
  --dial: #6A3FD0;
  --sel: #2266D3;
  --sel-soft: #E3ECFB;
  --good: #11804A;
  --good-bg: #DCF3E6;
  --bad: #C42F2F;
  --bad-bg: #FAE1E1;
  --shadow: 0 1px 2px rgba(22, 32, 58, .06), 0 4px 14px rgba(22, 32, 58, .06);
  --deep: #16203A;
  --deep-ink: #F4F6FB;
  --deep-ink-2: #AEB8D0;

  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-ui: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-en: 'Andika', 'Golos Text', system-ui, sans-serif;
  --f-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1220; --surface: #151D30; --surface-2: #1E2840; --ink: #ECF0F8; --ink-2: #9AA6C0; --line: #2A3652;
    --accent: #FFC93D; --accent-ink: #241A00; --accent-edge: #B98500; --accent-soft: #3A3112;
    --read: #FF8447; --talk: #5C9BFF; --gram: #2FC48B; --story: #E764B2; --dial: #A485FF;
    --sel: #5C9BFF; --sel-soft: #1C2D52;
    --good: #45D48B; --good-bg: #10301F; --bad: #FF7676; --bad-bg: #3B1A20;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    --deep: #24305A; --deep-ink: #F4F6FB; --deep-ink-2: #B4BED6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1220; --surface: #151D30; --surface-2: #1E2840; --ink: #ECF0F8; --ink-2: #9AA6C0; --line: #2A3652;
  --accent: #FFC93D; --accent-ink: #241A00; --accent-edge: #B98500; --accent-soft: #3A3112;
  --read: #FF8447; --talk: #5C9BFF; --gram: #2FC48B; --story: #E764B2; --dial: #A485FF;
  --sel: #5C9BFF; --sel-soft: #1C2D52;
  --good: #45D48B; --good-bg: #10301F; --bad: #FF7676; --bad-bg: #3B1A20;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  --deep: #24305A; --deep-ink: #F4F6FB; --deep-ink-2: #B4BED6;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
[hidden] { display: none !important; }
.boot { padding: 40px 16px; text-align: center; color: var(--ink-2); }

#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
#main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  outline: none;
}
#app.focus #tabbar { display: none; }
#app.focus #main { padding-block: 0; }

/* ---------- Tab bar ---------- */
#tabbar {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tab {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px 9px;
  border: 0;
  background: none;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 500;
}
.tab .ico { width: 24px; height: 24px; }
.tab.on { color: var(--ink); }
.tab.on .tab-ico { background: var(--accent-soft); border-radius: 999px; }
.tab-ico { display: grid; place-items: center; width: 52px; height: 30px; }
.tab-badge {
  position: absolute;
  top: 4px;
  left: calc(50% + 8px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--bad);
  color: #fff;
  font: 700 11px/18px var(--f-ui);
}

.ico { width: 22px; height: 22px; flex: none; }

/* ---------- Type ---------- */
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h1 { font: 700 24px/1.2 var(--f-display); letter-spacing: -.01em; }
.h2 { font: 700 18px/1.25 var(--f-display); }
.h3 { font: 600 17px/1.3 var(--f-ui); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.en { font-family: var(--f-en); }
.small { font-size: 14px; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 20px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: 16px;
  box-shadow: 0 3px 0 var(--line);
  transition: transform .08s, box-shadow .08s;
  text-decoration: none;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent-edge);
  color: var(--accent-ink);
  box-shadow: 0 3px 0 var(--accent-edge);
  font-weight: 700;
}
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-edge); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 70%, #000); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 70%, #000); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--bad); }
.icon-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--ink-2);
}
.icon-btn:active { background: var(--surface-2); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border-radius: var(--r-l);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; border: 1.5px solid var(--line); }

/* ---------- HUD (home top) ---------- */
.hud { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.hud-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 40px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
  font: 700 15px/1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.hud-pill .ico { width: 20px; height: 20px; }
.hud-pill.fire { color: var(--read); }
.hud-pill.fire span { color: var(--ink); }
.hud-pill.ice { color: var(--talk); }
.hud-pill.ice span { color: var(--ink); }
.hud-pill.dim { color: var(--ink-2); }
.ring-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); text-align: right; line-height: 1.2; }
.ring-wrap b { color: var(--ink); font: 700 14px var(--f-display); font-variant-numeric: tabular-nums; }
.ring { width: 44px; height: 44px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring.full .fg { stroke: var(--good); }

.home-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
.next-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  padding: 18px;
  border-radius: var(--r-l);
  background: var(--deep);
  color: var(--deep-ink);
  box-shadow: var(--shadow);
}
.next-card .label { color: var(--deep-ink-2); }
.next-card .h2 { color: var(--deep-ink); }
.next-card .sub { font-size: 14px; color: var(--deep-ink-2); }
.next-card .btn { grid-row: 1 / span 3; grid-column: 2; }
.review-card { display: flex; align-items: center; gap: 12px; }
.review-card .num {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--sel-soft);
  color: var(--talk);
  font: 700 18px var(--f-display);
  flex: none;
}
.plan-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); padding: 0 4px; }
.plan-line b { color: var(--ink); font-weight: 600; }
.plan-line .ico { width: 18px; height: 18px; margin-top: 1px; color: var(--ink-2); }

/* ---------- Route (course map) ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 4px 10px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 6px; border-radius: 3px; background: var(--lc); }
.zone-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 22px 4px 10px;
}
.zone-title .zone-n { font: 700 13px var(--f-display); color: var(--ink-2); letter-spacing: .04em; }
.zone-title .h2 { font-size: 17px; }

.route { position: relative; }
.station {
  position: relative;
  display: block;
  width: 100%;
  padding: 0 0 12px 54px;
  border: 0;
  background: none;
  text-align: left;
}
.station::before {
  content: "";
  position: absolute;
  left: 21px;
  top: 0;
  bottom: 0;
  width: 8px;
  background: var(--lc);
  opacity: .9;
}
.station.first::before { top: 22px; }
.station.last::before { bottom: auto; height: 22px; }
.station.locked::before { opacity: .25; }
.st-mark {
  position: absolute;
  left: 11px;
  top: 12px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 6px solid var(--lc);
  background: var(--surface);
  display: grid;
  place-items: center;
  color: #fff;
  z-index: 1;
}
.station.done .st-mark { background: var(--lc); border-color: var(--lc); }
.station.done .st-mark .ico { width: 14px; height: 14px; stroke-width: 3.5; }
.station.current .st-mark { box-shadow: 0 0 0 5px var(--accent); animation: halo 2.4s ease-in-out infinite; }
.station.locked .st-mark { border-color: var(--line); background: var(--surface-2); }
@keyframes halo { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 45%, transparent); } }
.st-body {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r-m);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--ink);
}
.station.current .st-body { outline: 2.5px solid var(--accent); }
.station.locked .st-body { box-shadow: none; background: transparent; border: 1.5px dashed var(--line); color: var(--ink-2); }
.st-glyph {
  display: grid;
  place-items: center;
  min-width: 52px;
  height: 52px;
  padding: 0 8px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--lc) 14%, var(--surface));
  color: var(--lc);
  font: 700 17px/1 var(--f-en);
  white-space: nowrap;
}
.station.locked .st-glyph { background: var(--surface-2); color: var(--ink-2); }
.st-num { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; }
.st-title { font-weight: 700; font-size: 16px; line-height: 1.25; }
.st-sub { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.st-prog { font: 700 13px var(--f-display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.st-prog .ico { width: 18px; height: 18px; }

/* ---------- Sheet / modal ---------- */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(8, 12, 24, .5);
  animation: fade .18s ease-out;
}
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 88%;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  animation: rise .22s ease-out;
}
.sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: -8px auto 14px; }
@keyframes rise { from { transform: translateY(40px); } }
@keyframes fade { from { opacity: 0; } }
.sheet-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.lesson-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
.lesson-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  text-align: left;
}
.lesson-row .dot {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--line);
  font: 700 13px var(--f-display);
  color: var(--ink-2);
  flex: none;
}
.lesson-row.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.lesson-row.done .dot .ico { width: 16px; height: 16px; stroke-width: 3; }
.lesson-row.next { border-color: var(--accent-edge); background: var(--accent-soft); }
.lesson-row.next .dot { border-color: var(--accent-edge); color: var(--accent-ink); background: var(--accent); }
.lesson-row:disabled { opacity: .5; }
.lesson-row .lr-sub { font-size: 13px; color: var(--ink-2); }
.tip-list { display: flex; flex-direction: column; gap: 10px; }
.tip { padding: 14px; border-radius: var(--r-m); background: var(--surface); border-left: 5px solid var(--lc, var(--accent)); }
.tip h4 { margin: 0 0 4px; font-size: 15px; }
.tip p { font-size: 15px; color: var(--ink); }
.tip .chips { margin-top: 8px; }

/* ---------- Lesson shell ---------- */
.lesson {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.lesson-top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px;
  background: var(--bg);
}
.progress { flex: 1; height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--accent); transition: width .35s ease; }
.combo { font: 700 13px var(--f-display); color: var(--read); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.lesson-body { flex: 1; padding: 14px 0 24px; display: flex; flex-direction: column; }
.lesson-foot {
  position: sticky;
  bottom: 0;
  z-index: 5;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  border-top: 1.5px solid var(--line);
}
.lesson-foot.good { background: var(--good-bg); border-color: transparent; }
.lesson-foot.bad { background: var(--bad-bg); border-color: transparent; }
.feedback { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; animation: rise .18s ease-out; }
.feedback .fb-ico {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex: none; color: #fff;
}
.lesson-foot.good .fb-ico { background: var(--good); }
.lesson-foot.bad .fb-ico { background: var(--bad); }
.lesson-foot.neutral .fb-ico { background: var(--ink-2); }
.fb-title { font: 700 18px/1.2 var(--f-display); }
.lesson-foot.good .fb-title { color: var(--good); }
.lesson-foot.bad .fb-title { color: var(--bad); }
.fb-body { font-size: 15px; margin-top: 4px; }
.fb-body .en { font-size: 19px; font-weight: 700; }
.fb-replay { margin-left: auto; }

.ex { display: flex; flex-direction: column; gap: 18px; flex: 1; }
.ex-title { font: 700 19px/1.3 var(--f-display); margin-bottom: 14px; text-wrap: balance; }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0; text-align: center; }
.bigword { font: 700 44px/1.15 var(--f-en); letter-spacing: .01em; word-break: break-word; }
.bigword.md { font-size: 30px; }
.bigword.sm { font-size: 24px; line-height: 1.3; }
.bigletter { font: 700 104px/1 var(--f-en); letter-spacing: .04em; }
.bigletter small { font-size: 64px; opacity: .55; margin-left: 10px; }
.ru-prompt { font-size: 20px; font-weight: 600; }
.pic { font-family: var(--f-emoji); font-size: 76px; line-height: 1; }
.pic.txt { font: 700 52px/1 var(--f-display); color: var(--ink); }
.audio-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.au {
  display: grid;
  place-items: center;
  width: 92px;
  height: 92px;
  border-radius: 28px;
  border: 0;
  background: var(--talk);
  color: #fff;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--talk) 65%, #000);
}
.au .ico { width: 44px; height: 44px; }
.au:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--talk) 65%, #000); }
.au.sm { width: 52px; height: 52px; border-radius: 16px; }
.au.sm .ico { width: 26px; height: 26px; }
.au.slow { width: 52px; height: 52px; border-radius: 16px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line); font-size: 24px; font-family: var(--f-emoji); }
.au.xs { width: 40px; height: 40px; border-radius: 12px; }
.au.xs .ico { width: 22px; height: 22px; }
.au.playing { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.15); transform: scale(1.04); } }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opts.list { grid-template-columns: 1fr; }
.opt {
  min-height: 64px;
  padding: 12px;
  border: 2px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  box-shadow: 0 3px 0 var(--line);
  color: var(--ink);
  font-size: 17px;
  font-weight: 500;
  line-height: 1.3;
  transition: transform .08s, border-color .12s, background .12s;
}
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt.pic-opt { min-height: 108px; font-family: var(--f-emoji); font-size: 54px; line-height: 1; }
.opt.pic-opt.txt { font: 700 34px var(--f-display); }
.opt.word-opt { font: 700 26px/1.2 var(--f-en); min-height: 74px; }
.opt.letter-opt { font: 700 44px/1 var(--f-en); min-height: 92px; }
.opt.ru-opt { text-align: left; padding: 14px 16px; }
.opt.sound-opt { font: 700 34px/1 var(--f-ui); min-height: 84px; }
.opts.list .opt.word-opt { font-size: 22px; text-align: left; padding: 14px 16px; }
.opt.sel { border-color: var(--sel); background: var(--sel-soft); box-shadow: 0 3px 0 var(--sel); }
.opt.ok { border-color: var(--good); background: var(--good-bg); box-shadow: 0 3px 0 var(--good); animation: pop .3s ease-out; }

.opt.dim { opacity: .45; }

@keyframes pop { 50% { transform: scale(1.04); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Tiles (build word / sentence) */
.answer-row {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 8px;
  min-height: 112px;
  padding: 10px 2px;
  background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line));

}
.answer-row.letters { justify-content: center; min-height: 72px; background-size: 100% 2px; background-position: 0 66px; background-image: linear-gradient(var(--line), var(--line)); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.tile {
  min-height: 46px;
  padding: 8px 14px;
  border: 2px solid var(--line);

}

.tile.used { visibility: hidden; }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.answer-row.ok .tile { border-color: var(--good); color: var(--good); }
.answer-row.bad .tile { border-color: var(--bad); color: var(--bad); }

.gap-sent { font: 700 26px/1.5 var(--f-en); text-align: center; }
.gap-sent .blank { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--ink-2); color: var(--sel); }

.gap-sent .blank.filled-bad { color: var(--bad); border-color: var(--bad); }
.ru-hint { text-align: center; color: var(--ink-2); font-size: 16px; }

/* Intro card */
.intro { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.intro .kind { color: var(--ink-2); }
.intro-en { font: 700 46px/1.15 var(--f-en); word-break: break-word; }
.intro-en.md { font-size: 32px; }
.intro-en.sm { font-size: 26px; line-height: 1.3; }
.intro-en button { all: unset; cursor: pointer; }
.intro-ru { font-size: 20px; font-weight: 600; color: var(--ink-2); }
.intro-hint { text-align: left; align-self: stretch; padding: 14px; border-radius: var(--r-m); background: var(--surface); font-size: 15px; }
.intro-hint b { font-weight: 700; }
.twin-warn { text-align: left; align-self: stretch; padding: 12px 14px; border-radius: var(--r-m); background: var(--accent-soft); color: var(--ink); font-size: 15px; border: 1.5px solid var(--accent-edge); }
.twin-warn .cmp { display: inline-flex; gap: 6px; align-items: baseline; font-weight: 700; }
.blend span { transition: color .15s, background .15s; border-radius: 6px; padding: 0 1px; }
.blend span.on { color: var(--read); background: color-mix(in srgb, var(--read) 15%, transparent); }
.key-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r-m); background: var(--surface); box-shadow: var(--shadow); }
.key-row .pic { font-size: 44px; }
.key-row .en { font-size: 26px; font-weight: 700; }
.key-row .en b { color: var(--read); }
.pair-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-self: stretch; }
.pair-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border-radius: var(--r-m); background: var(--surface); border: 2px solid var(--line); }
.pair-card .pic { font-size: 54px; }
.pair-card .en { font: 700 30px var(--f-en); }
.pair-card .ru { font-size: 14px; color: var(--ink-2); }

/* Match */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.mitem {
  min-height: 62px;
  padding: 8px 10px;
  border: 2px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  box-shadow: 0 3px 0 var(--line);
  font: 700 21px/1.2 var(--f-en);
}
.mitem.pic-m { font-family: var(--f-emoji); font-size: 36px; font-weight: 400; }
.mitem.ru-m { font: 500 15px/1.25 var(--f-ui); }
.mitem.sel { border-color: var(--sel); background: var(--sel-soft); }
.mitem.done { border-color: var(--good); background: var(--good-bg); opacity: .55; box-shadow: none; }
.mitem.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }

/* Speak */
.mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mic {
  display: grid;
  place-items: center;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  border: 0;
  background: var(--read);
  color: #fff;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--read) 65%, #000);
}
.mic .ico { width: 44px; height: 44px; }
.mic.listening { animation: pulse 1s ease-in-out infinite; background: var(--bad); }
.heard { min-height: 24px; font-size: 16px; color: var(--ink-2); text-align: center; }

/* Story */
.story-lines { display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 92%; align-self: flex-start; padding: 12px 14px; border-radius: 18px 18px 18px 6px; background: var(--surface); box-shadow: var(--shadow); animation: rise .25s ease-out; }
.bubble.right { align-self: flex-end; border-radius: 18px 18px 6px 18px; background: var(--sel-soft); }
.bubble.narr { align-self: stretch; max-width: none; background: transparent; box-shadow: none; padding: 4px 2px; border-left: 4px solid var(--story); border-radius: 0; padding-left: 12px; }
.bubble .who { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--story); margin-bottom: 2px; }
.bubble .line-en { font: 600 21px/1.4 var(--f-en); }
.bubble .line-en .w { cursor: pointer; border-bottom: 1.5px dotted color-mix(in srgb, var(--ink-2) 60%, transparent); }
.bubble .line-en .w:active, .bubble .line-en .w.on { background: var(--accent-soft); }
.bubble .line-ru { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.bubble .line-tools { display: flex; gap: 6px; margin-top: 8px; }
.story-cover { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 18px; border-radius: var(--r-l); background: var(--deep); color: var(--deep-ink); }
.story-cover .label { color: var(--deep-ink-2); }
.gloss-pop {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(92vw, 500px);
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--deep);
  color: var(--deep-ink);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  animation: rise .15s ease-out;
}
.gloss-pop .en { font-size: 20px; font-weight: 700; }

/* Finish */
.finish { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 24px; text-align: center; }
.finish .big-xp { font: 700 64px/1 var(--f-display); color: var(--accent-edge); font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .finish .big-xp { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .finish .big-xp { color: var(--accent); } }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-self: stretch; }
.stat { padding: 12px 6px; border-radius: var(--r-m); background: var(--surface); box-shadow: var(--shadow); }
.stat b { display: block; font: 700 22px var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-2); }
.new-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

/* Dictionary */
.search {
  width: 100%;
  height: 48px;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  font-size: 16px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 36px;
  padding: 6px 14px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.en { font-family: var(--f-en); font-size: 16px; font-weight: 700; }
.dict-list { display: flex; flex-direction: column; }
.dict-row {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 10px 4px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
}
.dict-row .pic { font-size: 30px; text-align: center; }
.dict-row .pic.txt { font-size: 15px; }
.dict-row .en { font-size: 19px; font-weight: 700; line-height: 1.2; }
.dict-row .ru { font-size: 14px; color: var(--ink-2); line-height: 1.25; }
.strength { display: flex; gap: 3px; }
.strength i { width: 6px; height: 18px; border-radius: 3px; background: var(--surface-2); }
.strength i.on { background: var(--gram); }
.strength.weak i.on { background: var(--read); }
.empty { padding: 28px 12px; text-align: center; color: var(--ink-2); }

/* Profile */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-grid .stat { text-align: left; padding: 14px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font: 500 11px var(--f-ui); }
.chart .bar { fill: var(--accent); }
.chart .bar.today { fill: var(--read); }
.chart .goal { stroke: var(--ink-2); stroke-dasharray: 4 4; stroke-width: 1; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: var(--r-m); background: var(--surface); text-align: center; }
.badge .medal {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 4px solid var(--line);
  font: 700 14px/1 var(--f-display);
  color: var(--ink-2);
}
.badge.got .medal { border-color: var(--accent-edge); background: var(--accent); color: var(--accent-ink); }
.badge .bt { font-size: 12px; font-weight: 600; line-height: 1.2; }
.badge:not(.got) .bt { color: var(--ink-2); }
.section-title { margin: 26px 2px 10px; }
.settings { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow); }
.set-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .grow b { display: block; font-weight: 600; }
.set-row .grow span { font-size: 13px; color: var(--ink-2); }
.set-row select, .set-row input[type="text"] { max-width: 52%; min-height: 40px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); }
.set-row input[type="range"] { width: 120px; accent-color: var(--talk); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--surface-2); border: 1.5px solid var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--good); border-color: var(--good); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--sel); outline-offset: 2px; }
textarea.backup { width: 100%; min-height: 110px; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); font: 12px/1.4 ui-monospace, Consolas, monospace; }
.notice { padding: 12px 14px; border-radius: var(--r-m); background: var(--accent-soft); border: 1.5px solid var(--accent-edge); font-size: 14px; }

/* Science page */
.sci { display: flex; flex-direction: column; gap: 12px; }
.sci-item { padding: 16px; border-radius: var(--r-m); background: var(--surface); box-shadow: var(--shadow); }
.sci-item h3 { font-size: 16px; margin-bottom: 6px; }
.sci-item p { font-size: 15px; }
.sci-item .src { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.back-row { display: flex; align-items: center; gap: 4px; margin: 0 0 8px -10px; }

/* Onboarding */
.onb { display: flex; flex-direction: column; gap: 18px; min-height: 100%; padding-block: 18px; }
.onb-hero { display: flex; flex-direction: column; gap: 14px; padding-top: 24px; }
.onb-glyphs { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; font-family: var(--f-en); font-weight: 700; }
.onb-glyphs .g1 { font-size: 96px; line-height: .9; color: var(--read); }
.onb-glyphs .g2 { font-size: 30px; color: var(--ink-2); }
.onb-glyphs .g3 { font-size: 54px; line-height: 1; color: var(--talk); }
.onb-title { font: 700 32px/1.1 var(--f-display); }
.onb-lead { font-size: 18px; color: var(--ink-2); }
.onb-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.choice-list { display: flex; flex-direction: column; gap: 10px; }

.choice span { font-size: 14px; color: var(--ink-2); }

.choice.on { border-color: var(--sel); background: var(--sel-soft); box-shadow: 0 3px 0 var(--sel); }
.how { display: flex; flex-direction: column; gap: 14px; }
.how-item { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }

.how-item b { display: block; margin-bottom: 2px; }

.plan-preview { padding: 16px; border-radius: var(--r-m); background: var(--deep); color: var(--deep-ink); font-size: 17px; }

.dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.on { width: 22px; background: var(--ink); }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));

  max-width: min(90vw, 480px);

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }

@media (min-width: 600px) {

}

}

/* ---------- Mute mode, explanations, dialogues, AI chat, transfer ---------- */
.mute-chip { border: 0; border-radius: 999px; padding: 5px 10px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.fb-why { margin-top: 6px; font-size: 14px; line-height: 1.4; color: var(--ink); }
.fb-why .en, .fb-why b { font-size: inherit; font-weight: 700; }
.bubble.masked .line-en { filter: blur(7px); user-select: none; }
.bubble.masked .line-tools .btn { display: none; }
.story-cover.dial { box-shadow: inset 6px 0 0 var(--dial); }

.opt.reply-opt { font-size: 18px; text-align: left; padding: 12px 14px; }
.ai-chat { padding-bottom: 8px; }
.ai-note { align-self: stretch; padding: 10px 12px; border-radius: 12px; font-size: 14px; background: var(--surface-2); color: var(--ink-2); }
.ai-note.fix { background: var(--accent-soft); color: var(--ink); border: 1.5px solid var(--accent-edge); }
.ai-note.err { background: var(--bad-bg); color: var(--bad); }
.ai-note.typing { font-style: italic; }
.ai-chips { margin-bottom: 4px; }
.ai-chips .chip { font-size: 15px; text-align: left; }
#ai-input { flex: 1; min-width: 0; }
.ai-card { width: 100%; border: 0; text-align: left; font: inherit; color: inherit; }
.transfer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qr-frame { padding: 10px; border-radius: 12px; background: #ffffff; }
.qr-img { display: block; width: min(76vw, 340px); max-width: 100%; height: auto; image-rendering: pixelated; }
.qr-video { width: 100%; max-width: 420px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: #000000; }

  // Recorded clip for a text: the chosen voice first, then the other recorded voice
  function findClip(text, opt) {
    if (opt.clip) for (const id of ['shared', 'shared-more']) { const u = clipUrl(id, opt.clip); if (u) return { url: u }; }
    const key = A.U.audioKey(text);

  function relevantLoading(opt) {

  let cur = null;      // { audio, fin }

      a.onerror = fin;

    if (/natural|neural|online/i.test(v.name)) s += 6;

          u.lang = v ? v.lang : 'en-US';

          const fin = () => { if (!done) { done = true; clearTimeout(t); resolve(); } };
          u.onend = fin;
          u.onerror = fin;
          const t = setTimeout(fin, 1800 + text.length * 160 / rate);

  S.speakSeq = function (list, opt) {
    if (S.muted()) return Promise.resolve();
    const my = ++seq;
    stopSound();
    return playSeq(list, opt || {}, my);
  };
  async function playSeq(list, opt, my) {
    for (let i = 0; i < list.length; i++) {

      if (i < list.length - 1) await new Promise(r => setTimeout(r, 220));

        const pending = relevantLoading(opt);
        if (pending.length) await Promise.race([Promise.all(pending), new Promise(r => setTimeout(r, 2500))]);

  let lastVaried = '';
  S.speakVaried = function (text, opt) {
    opt = Object.assign({}, opt, { rateMul: 0.9 + Math.random() * 0.15 });
    if (S.voiceMode() !== 'tts' && packs.shared) {
      const key = A.U.audioKey(text);
      const pool = A.DATA.voices.pairs.filter(v => v !== lastVaried && packs.shared.clips['pair|' + v + '|' + key]);
      if (pool.length) {
        lastVaried = pool[Math.floor(Math.random() * pool.length)];
        return S.speak(text, Object.assign(opt, { clip: 'pair|' + lastVaried + '|' + key }));
      }
    }
    const good = voices.filter(v => score(v) >= 10);
    const list = (good.length > 1 ? good : voices).filter(v => v.voiceURI !== lastVaried);
    const v = list.length ? list[Math.floor(Math.random() * list.length)] : null;

  S.playRecording = function (url) {
    const my = ++seq;

  };

  S.canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) &&
    settings().mic && !S.recBlocked && Date.now() > pausedUntil && !S.muted();

    return new Promise(resolve => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        let rec;
        try { rec = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(t => t.stop()); resolve({ error: 'recorder' }); return; }

        recorder = rec;
        const t = setTimeout(() => { try { rec.stop(); } catch (e) { /* ignore */ } }, maxMs || 6000);
        rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          clearTimeout(t);
          stream.getTracks().forEach(tr => tr.stop());
          recorder = null;
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });

    });
  };
  S.stopRecording = () => { if (recorder && recorder.state === 'recording') try { recorder.stop(); } catch (e) { /* ignore */ } };

  let active = null;
  S.listen = function () {
    return new Promise(resolve => {
      let r;
      try { r = new Rec(); } catch (e) { resolve({ error: 'unsupported', alts: [] }); return; }
      r.lang = 'en-US';
      r.interimResults = false;
      r.maxAlternatives = 5;
      r.continuous = false;
      let done = false;
      const fin = x => {
        if (done) return;
        done = true;
        clearTimeout(t);
        active = null;
        try { r.abort(); } catch (e) { /* ignore */ }
        resolve(x);
      };
      r.onresult = e => {
        const alts = [];
        const res = e.results[0];
        for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
        fin({ alts });
      };
      r.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') S.micBlocked = true;
        fin({ error: e.error, alts: [] });
      };
      r.onend = () => setTimeout(() => fin({ alts: [] }), 300);
      const t = setTimeout(() => fin({ error: 'timeout', alts: [] }), 8000);
      active = r;
      try { r.start(); } catch (e) { fin({ error: 'start', alts: [] }); }
    });
  };
  S.stopListening = () => { if (active) try { active.stop(); } catch (e) { /* ignore */ } };

  S.bestMatch = function (target, alts) {
    const tn = A.U.normLoose(target);
    let best = { score: 0, text: alts[0] || '' };
    alts.forEach(a => {
      const sc = A.U.sim(A.U.normLoose(a), tn);
      if (sc > best.score) best = { score: sc, text: a };
    });

  };
})(window.A);

<script>
'use strict';
// Compact helpers for writing course content.
//   W('cat|кот|🐱')                 word
//   P('Thank you!|Спасибо!|🙏')      phrase (learned as a whole chunk)
//   S('She [is] a doctor.|Она врач.', 'am,are')   sentence; [..] marks the gap, then wrong options
//   MP('ship|корабль|🚢', 'sheep|овца|🐑', 'note')  minimal pair for listening
//   LT('s', 'a')                      letters / letter combinations from letters.js
//   N('abc')                          letter names (alphabet)
//   REF('w:cat')                      reuse an item introduced earlier
window.A = window.A || {};
A.DATA = { letters: {}, units: [], stories: {}, gloss: {}, zones: {} };

(function (D) {
  const slug = s => s.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9 ]/g, '').trim().replace(/\s+/g, '_');
  const split = s => s.split('|').map(x => x.trim());

  D.W = (s, x) => {
    const [en, ru, pic] = split(s);
    return Object.assign({ id: 'w:' + en.toLowerCase(), kind: 'word', en, ru, pic: pic || '' }, x);
  };
  D.P = (s, x) => {
    const [en, ru, pic] = split(s);
    return Object.assign({ id: 'p:' + slug(en), kind: 'phrase', en, ru, pic: pic || '' }, x);
  };
  D.S = (s, alts, x) => {
    const [raw, ru, pic] = split(s);
    const m = raw.match(/\[([^\]]+)\]/);
    const en = raw.replace(/[[\]]/g, '');
    return Object.assign({
      id: 's:' + slug(en), kind: 'sent', en, ru, pic: pic || '',
      gap: m ? m[1] : null, gapAt: m ? raw.indexOf('[') : -1,
      alts: alts ? alts.split(',').map(a => a.trim()) : []
    }, x);
  };
  D.MP = (a, b, note) => {
    const pa = split(a), pb = split(b);
    return {
      id: 'mp:' + pa[0] + '-' + pb[0], kind: 'pair',
      a: { en: pa[0], ru: pa[1], pic: pa[2] || '' },
      b: { en: pb[0], ru: pb[1], pic: pb[2] || '' },
      en: pa[0] + ' / ' + pb[0], ru: pa[1] + ' / ' + pb[1], note: note || ''
    };
  };
  D.LT = (...ids) => ids.map(id => ({ ref: 'L_' + id }));
  D.N = chars => chars.split('').map(c => ({ ref: 'L_' + c, asName: true }));
  D.REF = (...ids) => ids.map(id => ({ refId: id }));
  D.unit = u => D.units.push(u);
})(A.DATA);

<script>

// Grammar patterns: one rule, many sentences. Each time a pattern is practised it produces a new
// sentence (subject × phrase), so the learner trains the rule rather than memorising one sentence.
// Also: short explanations for wrong answers (D.why).
(function (D) {
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  // person: 1s I, 2s you, 3s he/she/it, 1p we, 3p they; gender for Russian past tense: m, f, p (plural), x (я/ты — «был(а)»)
  const S = {
    I: { en: 'I', ru: 'я', p: '1s', g: 'x' },
    you: { en: 'you', ru: 'ты', p: '2s', g: 'x' },
    he: { en: 'he', ru: 'он', p: '3s', g: 'm' },
    she: { en: 'she', ru: 'она', p: '3s', g: 'f' },
    we: { en: 'we', ru: 'мы', p: '1p', g: 'p' },
    they: { en: 'they', ru: 'они', p: '3p', g: 'p' },
    anna: { en: 'Anna', ru: 'Анна', p: '3s', g: 'f' },
    ben: { en: 'Ben', ru: 'Бен', p: '3s', g: 'm' },
    mom: { en: 'my mom', ru: 'моя мама', p: '3s', g: 'f' }

  PAT('be', {
    title: 'am · is · are', ru: 'глагол «быть» в настоящем времени',
    rule: '<b>I am</b> · <b>he / she / it is</b> · <b>you / we / they are</b>. В русском глагол пропускают («Я дома»), в английском — никогда: I <b>am</b> at home.',
    build: () => {

  PAT('q', {
    title: 'Do you…? Does she…?', ru: 'вопросы в Present Simple',
    rule: 'Вопрос начинается с <b>Do</b> (I, you, we, they) или <b>Does</b> (he, she, it). После does у глагола уже нет -s: <b>Does</b> she <b>like</b>…?',
    build: () => {
      const verbs = [
        ['like coffee', { '2s': 'любишь', '3s': 'любит', '3p': 'любят' }, 'кофе'],
        ['speak English', { '2s': 'говоришь', '3s': 'говорит', '3p': 'говорят' }, 'по-английски'],

      const places = [['at home', 'дома'], ['at work', 'на работе'], ['in the park', 'в парке'], ['in Boston', 'в Бостоне']];
      const out = [];
      [S.I, S.you, S.he, S.she, S.we, S.they, S.anna, S.ben].forEach(s => places.forEach(([en, ru]) => {

    title: 'worked, played', ru: 'прошедшее время правильных глаголов',
    rule: 'К глаголу добавляют <b>-ed</b>: work → <b>worked</b>. Форма одна для всех: I worked, she worked.',
    build: () => {
      const verbs = [
        ['worked', 'work', 'late', ['работал', 'работала', 'работали'], 'допоздна'],
        ['watched', 'watch', 'a movie', ['смотрел', 'смотрела', 'смотрели'], 'фильм'],
        ['cooked', 'cook', 'dinner', ['готовил', 'готовила', 'готовили'], 'ужин'],
        ['called', 'call', 'mom', ['звонил', 'звонила', 'звонили'], 'маме']
      ];
      const out = [];
      [S.I, S.you, S.he, S.she, S.we, S.they, S.anna, S.ben].forEach(s => verbs.forEach(([ed, b, rest, ru, ruRest]) => {
        out.push(sent(`${enSubj(s, true)} [${ed}] ${rest} yesterday.`, `Вчера ${s.ru} ${past(ru, s)} ${ruRest}.`, [b, b + 's']));
      }));

'use strict';
// Builds the course: resolves item references, assigns each item to the unit where it first
// appears, and splits units into lessons.
(function (A) {
  const D = A.DATA;
  const C = A.Course = { items: {}, list: [], units: [], unitIndex: {}, lessonByKey: {} };

  C.LINES = {
    read: { name: 'Чтение', color: 'var(--read)' },
    talk: { name: 'Разговор', color: 'var(--talk)' },
    gram: { name: 'Грамматика', color: 'var(--gram)' },
    story: { name: 'Истории', color: 'var(--story)' },
    dial: { name: 'Диалоги', color: 'var(--dial)' }
  };
  const isStoryLine = line => line === 'story' || line === 'dial';

  function nameItem(letter) {
    return {
      id: 'N_' + letter.ch, kind: 'name', ch: letter.ch, uc: letter.uc, say: letter.say,
      en: letter.uc, ru: 'буква ' + letter.uc, letterId: letter.id
    };
  }

  function resolve(raw) {
    if (raw.ref) {
      const L = D.letters[raw.ref];
      if (!L) throw new Error('Unknown letter ' + raw.ref);
      return raw.asName ? nameItem(L) : L;
    }
    if (raw.refId) {
      const it = C.items[raw.refId];
      if (!it) throw new Error('Reference to an item not introduced yet: ' + raw.refId);
      return it;
    }
    return raw;
  }

  function chunk(arr, n) {
    const out = [];
    for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    // avoid a lonely last lesson with one item
    if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(out.pop()[0]);
    return out;
  }

  C.build = function () {
    const seen = new Set();
    D.units.forEach((u, ui) => {
      u.index = ui;
      C.unitIndex[u.id] = ui;
      // Content files describe lessons in u.lessons (explicit groups) or u.items (auto-split)
      const authored = u.authored || (u.authored = Array.isArray(u.lessons) ? u.lessons : (u.items ? chunk(u.items, u.size || 4) : []));
      u.lessons = [];
      if (isStoryLine(u.line)) {
        u.lessons.push({ key: u.id + ':0', unit: u, idx: 0, title: D.stories[u.story].title, story: u.story, newIds: [], refIds: [] });
      } else {
        authored.forEach((def, li) => {
          const g = Array.isArray(def) ? { items: def } : def;
          const newIds = [], refIds = [];
          g.items.forEach(r => {
            const it = resolve(r);
            if (!C.items[it.id]) C.items[it.id] = it;

        });
        if (u.lessons.length > 1 && !u.noReview) {
          const all = [].concat(...u.lessons.map(l => l.newIds));
          u.lessons.push({ key: u.id + ':r', unit: u, idx: u.lessons.length, title: 'Закрепление', review: true, newIds: [], refIds: all });
        }
      }
      u.lessons.forEach(l => { C.lessonByKey[l.key] = l; });
      C.units.push(u);
    });
    C.list = Object.values(C.items);

    // Lexicon for tap-to-translate in stories
    C.lexicon = {};
    C.list.forEach(it => { if (it.kind === 'word') C.lexicon[it.en.toLowerCase()] = it.ru; });
    Object.keys(D.gloss).forEach(k => { if (!C.lexicon[k]) C.lexicon[k] = D.gloss[k]; });
  };

  C.gloss = function (word) {
    const w = A.U.norm(word);
    if (!w) return '';
    if (C.lexicon[w]) return C.lexicon[w];
    const stems = [w.replace(/'s$/, ''), w.replace(/s$/, ''), w.replace(/es$/, ''), w.replace(/ies$/, 'y'),
      w.replace(/ed$/, ''), w.replace(/d$/, ''), w.replace(/ied$/, 'y'), w.replace(/ing$/, ''), w.replace(/ing$/, 'e'), w.replace(/er$/, '')];
    for (const s of stems) if (s && C.lexicon[s]) return C.lexicon[s];
    return '';
  };

  const S = () => A.Store.state;
  C.lessonDone = key => !!S().lessons[key];
  C.unitDoneCount = u => u.lessons.filter(l => C.lessonDone(l.key)).length;
  C.unitComplete = u => u.lessons.every(l => C.lessonDone(l.key));
  // A unit stays open once any of its lessons is done (course updates may add lessons to earlier units)
  C.unitUnlocked = u => S().settings.openAll || u.index === 0 || C.unitComplete(C.units[u.index - 1]) || C.unitDoneCount(u) > 0;

'use strict';
// XP, daily goal, streak with freezes, achievements.
(function (A) {

  const P = A.Progress = {};

  // or if the missed days can be covered by freezes.
  P.streakInfo = function () {
    const s = st().stats;
    if (!s.last) return { n: 0, today: false, atRisk: false };
    const today = U.dayKey();
    const gap = U.daysBetween(s.last, today);

      events.streakUp = s.streak;
      if (s.streak % 7 === 0 && s.freezes < 2) { s.freezes += 1; events.newFreeze = true; }
    }
    s.best = Math.max(s.best, s.streak);

    if (before < goal && s.days[today] >= goal) events.goalDone = true;

    while (keys.length > 120) delete s.days[keys.shift()];
    return events;
  };

  const countKinds = kinds => Object.keys(st().items).filter(id => {
    const it = A.Course.items[id];
    return it && kinds.includes(it.kind);
  }).length;
  P.learnedWords = () => countKinds(['word', 'phrase', 'sent']);
  P.learnedLetters = () => Object.keys(st().items).filter(id => /^L_[a-z]$/.test(id)).length;

  P.BADGES = [
    { id: 'first', mark: '1', t: 'Первый шаг', d: 'Пройден первый урок', test: s => Object.keys(s.lessons).length >= 1 },
    { id: 'goal', mark: 'XP', t: 'Цель дня', d: 'Выполнена дневная цель', test: s => Object.values(s.stats.days).some(x => x >= s.settings.goal) },
    { id: 'perfect', mark: '100%', t: 'Без ошибок', d: 'Урок без единой ошибки', test: s => s.stats.perfect >= 1 },
    { id: 'letters', mark: 'Aa', t: 'Все буквы', d: 'Изучены все 26 букв', test: () => P.learnedLetters() >= 26 },
    { id: 'abc', mark: 'A–Z', t: 'Алфавит', d: 'Пройдена станция «Алфавит»', test: () => A.Course.unitComplete(A.Course.units[A.Course.unitIndex.u10]) },
    { id: 'story', mark: 'Ст', t: 'Читатель', d: 'Прочитана первая история', test: s => s.stats.stories >= 1 },
    { id: 'w50', mark: '50', t: '50 слов и фраз', d: 'В словаре 50 слов и фраз', test: () => P.learnedWords() >= 50 },
    { id: 'w100', mark: '100', t: '100 слов и фраз', d: 'В словаре 100 слов и фраз', test: () => P.learnedWords() >= 100 },
    { id: 'w250', mark: '250', t: '250 слов и фраз', d: 'В словаре 250 слов и фраз', test: () => P.learnedWords() >= 250 },
    { id: 's3', mark: '3', t: '3 дня подряд', d: 'Серия из 3 дней', test: s => s.stats.best >= 3 },
    { id: 's7', mark: '7', t: 'Неделя', d: 'Серия из 7 дней', test: s => s.stats.best >= 7 },
    { id: 's30', mark: '30', t: 'Месяц', d: 'Серия из 30 дней', test: s => s.stats.best >= 30 },
    { id: 'r10', mark: '×10', t: 'Повторение', d: '10 сессий повторения', test: s => s.stats.reviews >= 10 },
    { id: 'voice', mark: 'Mic', t: 'Голос', d: '10 раз сказали фразу вслух', test: s => s.stats.spoken >= 10 },
    { id: 'dialog', mark: '⇄', t: 'Собеседник', d: 'Пройден первый диалог', test: s => (s.stats.dialogs || 0) >= 1 },
    { id: 'ai', mark: 'AI', t: 'Разговорчивый', d: '20 сообщений в разговоре с ИИ', test: s => (s.stats.aiMessages || 0) >= 20 },
    { id: 'past', mark: 'was', t: 'Прошлое', d: 'Пройдена зона «Рассказываю о прошлом»', test: () => A.Course.units.filter(u => u.zone === 4).every(A.Course.unitComplete) },
    { id: 'finish', mark: 'NY', t: 'Нью-Йорк', d: 'Пройден весь маршрут', test: () => A.Course.units.every(A.Course.unitComplete) }
  ];

  // Returns badges earned just now
  P.checkBadges = function () {
    const s = st();
    const fresh = [];
    P.BADGES.forEach(b => {
      if (!s.badges[b.id] && b.test(s)) { s.badges[b.id] = U.dayKey(); fresh.push(b); }
    });
    return fresh;
  };

  P.dueIds = function () {
    const today = U.dayKey();
    return Object.keys(st().items).filter(id => A.Course.items[id] && A.SRS.isDue(st().items[id], today));
  };
})(window.A);

</script>
<script>
'use strict';
// Exercise builders. Each builder returns an object:
//   { title, view(api) -> Node, check() -> {ok, why?}, autoplay?, sayAfter?, fb?, auto? }
// api.ready(bool) enables the Check button; api.done(result) finishes exercises without it.
// `why` explains a wrong answer (elaborated feedback), not just the right one.
(function (A) {
  const U = A.U, h = U.h;
  const C = A.Course, Sp = A.Speech;
  const X = A.Ex = {};

  // Words that sound the same must never be offered as alternatives in listening tasks
  const HOMO = [['see', 'sea'], ['be', 'bee'], ['to', 'two', 'too'], ['here', 'hear'], ['no', 'know'], ['right', 'write'],
    ['for', 'four'], ['one', 'won'], ['son', 'sun'], ['eight', 'ate'], ['meat', 'meet'], ['by', 'bye', 'buy'], ['i', 'eye'],
    ['tea', 'tee'], ['there', 'their'], ['our', 'hour'], ['red', 'read'], ['wait', 'weight'], ['mail', 'male'], ['road', 'rode'],
    ['nose', 'knows'], ['rose', 'rows'], ['cell', 'sell'], ['ant', 'aunt'], ['cent', 'sent'], ['sum', 'some'], ['night', 'knight'], ['plane', 'plain'],
    ['made', 'maid'], ['sale', 'sail'], ['week', 'weak'], ['new', 'knew'], ['dear', 'deer']];
  const homoOf = {};
  HOMO.forEach(g => g.forEach(w => { homoOf[w] = g; }));
  const isHomo = (a, b) => { const g = homoOf[String(a).toLowerCase()]; return !!g && g.includes(String(b).toLowerCase()); };

  // Letters that share a sound (avoid offering them as "wrong" answers to each other)
  const SOUND = { c: 'k', k: 'k', ck: 'k', q: 'k', ee: 'i:', ea: 'i:', ai: 'ei', ay: 'ei', a_e: 'ei', oa: 'ou', ow: 'ou', o_e: 'ou', igh: 'ai', y_end: 'ai', i_e: 'ai', ou: 'au', ow2: 'au', x: 'ks' };
  const soundOf = L => SOUND[L.id.slice(2)] || L.id;

  const LETTER_CONF = { b: 'dpq', d: 'bpq', p: 'qbd', q: 'pgd', n: 'umh', u: 'nvy', m: 'nw', w: 'mv', i: 'ljt', l: 'ijt', j: 'ig', g: 'qj', h: 'nk', v: 'uwy', y: 'vj', e: 'ca', a: 'eo', o: 'ac', c: 'eo', r: 'nt', t: 'lf', f: 'tl', s: 'zc', z: 'sx', x: 'zk', k: 'xh' };
  const NAME_CONF = { A: 'ERHI', B: 'VDPE', C: 'SZKE', D: 'BTEG', E: 'IAYG', F: 'SVHX', G: 'JZDE', H: 'AKEX', I: 'EYAR', J: 'GAKY', K: 'QCAJ', L: 'MNEF', M: 'NLE', N: 'MLE', O: 'UAQ', P: 'BTDE', Q: 'KUCW', R: 'AEIO', S: 'FXCZ', T: 'DPEB', U: 'YWQO', V: 'BZWE', W: 'VYUD', X: 'SKZE', Y: 'WIUE', Z: 'CGSE' };
  const GRAPHEMES = ['igh', 'sh', 'ch', 'th', 'ck', 'ng', 'ee', 'ea', 'oo', 'ai', 'ay', 'oa', 'ow', 'ou', 'ar', 'or', 'er', 'ir', 'ur', 'qu'];
  // Exercise types that need sound or a microphone (skipped in "can't listen now" mode)
  const AUDIO_TYPES = new Set(['listen_pick_pic', 'listen_pick_word', 'listen_pick_meaning', 'listen_build', 'minimal', 'name_listen', 'spell_listen', 'letter_listen', 'speak', 'shadow']);

  X.nameSay = ch => ch.toUpperCase() + '.';

  // ---------- small view helpers ----------
  function play(btn, text, opt) {
    btn.classList.add('playing');
    const f = opt && opt.varied ? Sp.speakVaried : Sp.speak;
    f(text, opt).then(() => btn.classList.remove('playing'));
  }
  function auBtn(text, opt) {
    opt = opt || {};
    const b = h('button', { class: 'au' + (opt.cls ? ' ' + opt.cls : ''), type: 'button', 'aria-label': 'Прослушать', html: U.icon('speaker') });
    b.onclick = () => play(b, typeof text === 'function' ? text() : text, opt);
    return b;
  }
  function slowBtn(text, opt) {
    const b = h('button', { class: 'au slow', type: 'button', 'aria-label': 'Медленно', title: 'Медленно' }, '🐢');
    b.onclick = () => play(b, typeof text === 'function' ? text() : text, Object.assign({}, opt, { slow: true }));
    return b;
  }
  function audioRow(text, opt) { return h('div', { class: 'audio-row' }, auBtn(text, opt), slowBtn(text, opt)); }
  X.auBtn = auBtn;
  X.slowBtn = slowBtn;
  X.audioRow = audioRow;
  function picNode(pic) { return h('div', { class: 'pic' + (U.isTextPic(pic) ? ' txt' : '') }, pic); }
  X.picNode = picNode;
  const sizeCls = t => t.length > 22 ? ' sm' : t.length > 9 ? ' md' : '';
  function wordNode(t) { return h('div', { class: 'bigword en' + sizeCls(t) }, t); }
  const fbOf = it => ({ en: it.en, ru: it.ru });
  const family = k => (k === 'phrase' || k === 'sent') ? ['phrase', 'sent'] : [k];
  const esc = U.escape;

  const tokenize = U.tokenize;

  // ---------- explanations for wrong answers ----------
  let graphHints = null;
  function graphHint(g) {
    if (!graphHints) {
      graphHints = {};
      Object.values(A.DATA.letters).forEach(L => {
        if (L.id === 'L_y_end' || L.id === 'L_ow2' || L.id === 'L_er') return;
        const text = L.hint.replace(/<[^>]+>/g, '');
        graphHints[L.ch] = text.split(/(?<=[.!])\s/)[0];
      });
    }
    return graphHints[g] || '';
  }
  // Where two spellings differ, and what the right letters sound like
  function diffHint(right, picked) {
    const a = right.toLowerCase(), b = picked.toLowerCase();
    let i = 0;
    while (i < a.length && i < b.length && a[i] === b[i]) i++;
    let j = 0;
    while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
    const pa = a.slice(i, a.length - j), pb = b.slice(i, b.length - j);
    if (!pa && !pb) return '';
    const hint = graphHint(pa);
    return 'Разница: <b class="en">' + esc(pa || '—') + '</b> вместо <span class="en">' + esc(pb || '—') + '</span>.' + (hint ? ' «' + esc(pa) + '»: ' + esc(hint) : '');
  }
  function wordWhy(right, picked) {
    const it = C.items['w:' + picked.toLowerCase()];
    const meaning = it ? '«' + esc(picked) + '» — ' + esc(it.ru) + '. ' : 'Слова «' + esc(picked) + '» нет. ';
    return meaning + diffHint(right, picked);
  }
  const itemWhy = x => '«<span class="en">' + esc(x.en) + '</span>» — ' + esc(x.ru) + '.';
  const ruWhy = x => '«' + esc(x.ru) + '» по-английски — «<span class="en">' + esc(x.en) + '</span>».';
  function whyWord(w) {
    const W = A.DATA.why || {};
    return W[String(w).toLowerCase()] || '';
  }
  // Why the chosen word does not fit the gap, and why the right one does
  function gapWhy(picked, right) {
    const p = picked.toLowerCase(), r = right.toLowerCase();
    let a = whyWord(p), b = whyWord(r);
    const related = p.slice(0, 3) === r.slice(0, 3);
    if (!a && related) {
      if (/ing$/.test(p)) a = '<b>' + esc(p) + '</b> — форма «прямо сейчас» (I am ' + esc(p) + '). Здесь она не подходит.';
      else if (p.indexOf('more ') === 0) a = 'С короткими словами more не нужен: говорят <b>' + esc(r) + '</b>.';
      else if (/er$/.test(r) && !/er$/.test(p)) a = '<b>' + esc(p) + '</b> — без сравнения. Сравнивая, говорят <b>' + esc(r) + '</b> than.';
      else if (/ed$/.test(p) && !/ed$/.test(r)) a = '<b>' + esc(p) + '</b> — прошедшее время. Здесь нужна другая форма.';
      else if (/s$/.test(p) && !/s$/.test(r)) a = '<b>' + esc(p) + '</b> — форма с -s: только с he, she, it и одним человеком.';
      else if (/s$/.test(r) && !/s$/.test(p)) a = '<b>' + esc(p) + '</b> — без -s: так говорят с I, you, we, they.';
      else if (/ed$/.test(r)) a = '<b>' + esc(p) + '</b> — настоящее время, а речь о прошлом (yesterday): нужно -ed.';
    }
    if (!b && related) {
      if (/s$/.test(r) && !/s$/.test(p)) b = 'С he, she, it и одним человеком глагол получает <b>-s</b>: ' + esc(r) + '.';
      else if (/ed$/.test(r)) b = 'О прошлом: <b>' + esc(r) + '</b>.';
      else if (/s$/.test(p)) b = 'С I, you, we, they — без -s: <b>' + esc(r) + '</b>.';
    }
    if (!a && !b) return '';
    return (a ? 'Вы выбрали «<span class="en">' + esc(picked) + '</span>»: ' + a.replace(/^<b>[^<]+<\/b> — /, '') + ' ' : '') + (b ? 'Здесь нужно: ' + b : '');
  }
  X.gapWhy = gapWhy;

  // ---------- distractors ----------
  // Candidates for wrong options: items the learner has already met first, then this lesson's items, then the rest
  function pool(item, ctx, test) {
    const out = [], seen = new Set([item.id]);
    const push = it => { if (it && !seen.has(it.id) && test(it)) { seen.add(it.id); out.push(it); } };
    if (ctx.learned) U.shuffle(Array.from(ctx.learned)).forEach(id => push(C.items[id]));
    U.shuffle(ctx.knownIds).forEach(id => push(C.items[id]));
    const maxU = ctx.unitIndex == null ? 999 : ctx.unitIndex + 1;
    const rest = U.shuffle(C.list);
    rest.forEach(it => { const ui = C.unitIndex[it.unit]; if (ui != null && ui <= maxU) push(it); });
    rest.forEach(push);
    return out;
  }
  // Two items with the same translation (home / house — «дом») must not both be offered: either answer would be right
  function meanings(ru) {
    return String(ru || '').toLowerCase().replace(/ё/g, 'е').split(/[,;/]/)
      .map(p => p.replace(/[^а-яa-z ]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  }
  function sameMeaning(a, b) {
    const A1 = meanings(a.ru), B1 = meanings(b.ru);
    return A1.some(x => B1.some(y => x === y ||
      (!x.includes(' ') && y.split(' ')[0] === x) || (!y.includes(' ') && x.split(' ')[0] === y)));
  }
  function distract(item, ctx, n, test, key) {
    const used = new Set([key(item)]);
    const res = [];
    for (const it of pool(item, ctx, test)) {
      const k = key(it);
      if (!k || used.has(k)) continue;
      if (item.en && it.en && isHomo(item.en, it.en)) continue;
      if (item.ru && it.ru && sameMeaning(item, it)) continue;
      if (res.some(r => r.ru && it.ru && sameMeaning(r, it))) continue;
      used.add(k);
      res.push(it);
      if (res.length >= n) break;
    }
    return res;
  }

  function syllables(w) { return (w.replace(/e$/, '').match(/[aeiouy]+/g) || []).length || 1; }
  function similar(w, ctx) {
    const c = new Map();
    const add = (s, sc) => {
      if (s && s !== w && !isHomo(w, s) && /^[a-z]+$/.test(s) && (!c.has(s) || c.get(s) > sc)) c.set(s, sc);
    };
    C.list.forEach(it => {
      if (it.kind !== 'word') return;
      const e = it.en.toLowerCase();
      if (!/^[a-z]+$/.test(e) || Math.abs(e.length - w.length) > 1) return;
      const d = U.lev(e, w);
      if (d >= 1 && d <= 2) add(e, d + (ctx.known.has(it.id) ? 0 : 0.3));
    });
    if (syllables(w) === 1) {
      for (let i = 0; i < w.length; i++) {
        if (!'aeiou'.includes(w[i]) || (i === w.length - 1 && w[i] === 'e') || 'aeiou'.includes(w[i + 1] || '') || 'aeiou'.includes(w[i - 1] || '')) continue;
        for (const v of 'aeiou') if (v !== w[i]) add(w.slice(0, i) + v + w.slice(i + 1), 1.4);
      }
    }
    [['th', 's'], ['th', 't'], ['th', 'f'], ['w', 'v'], ['v', 'w'], ['ee', 'i'], ['ea', 'i'], ['sh', 's'], ['ch', 'sh'], ['sh', 'ch'], ['ng', 'n']].forEach(([f, t]) => {
      const i = w.indexOf(f);
      if (i >= 0) add(w.slice(0, i) + t + w.slice(i + f.length), 1.1);
    });
    const m = w.match(/^([^aeiou]+)i([^aeiou]+)$/);
    if (m) add(m[1] + 'ee' + m[2], 1.1);
    return [...c.entries()].sort((a, b) => a[1] - b[1]).slice(0, 7).map(e => e[0]);
  }
  function spellingOptions(it, ctx, n) {
    const w = it.en;
    let opts;
    if (it.unit === 'u22' || !/^[a-z]+$/i.test(w) || w.length < 2) {
      opts = distract(it, ctx, n, x => x.kind === 'word' && !x.pic && /^[a-z]+$/i.test(x.en), x => x.en.toLowerCase()).map(x => x.en);
    } else {
      opts = U.sample(similar(w.toLowerCase(), ctx), n);
      if (opts.length < n) {
        opts = opts.concat(distract(it, ctx, n - opts.length,
          x => x.kind === 'word' && /^[a-z]+$/i.test(x.en) && !opts.includes(x.en.toLowerCase()), x => x.en.toLowerCase()).map(x => x.en.toLowerCase()));
      }
      if (/^[A-Z]/.test(w)) opts = opts.map(o => o[0].toUpperCase() + o.slice(1));
    }
    return opts.filter(o => o !== w);
  }
  function extraWords(it, ctx, toks, n) {
    const have = new Set(toks.map(t => t.toLowerCase()));
    const out = [];
    const src = pool(it, ctx, x => x.kind === 'phrase' || x.kind === 'sent');
    for (const x of src) {
      for (const t of tokenize(x.en)) {
        const l = t.toLowerCase();
        if (have.has(l) || out.some(o => o.toLowerCase() === l)) continue;
        out.push(t);
        if (out.length >= n) return out;
      }
    }
    return out;
  }

  // ---------- generic exercise shapes ----------
  function muteBtn(api) {
    return h('button', {
      class: 'btn ghost sm', type: 'button',
      onclick: () => { Sp.mute(15); api.done({ skip: true, msg: 'Хорошо: 15 минут без звука. Задания на слух пока пропускаем.' }); }
    }, 'Не могу слушать сейчас');
  }

  function choice(o) {
    let sel = -1, btns = [];
    return {
      title: o.title, autoplay: o.autoplay, autoplayOpt: o.autoplayOpt, fb: o.fb, sayAfter: o.sayAfter,
      // the right option and option texts (used by the automated course check)
      answer: o.correct, labels: o.options.map(op => op.text || (typeof op.label === 'string' ? op.label : '')),
      view(api) {
        btns = o.options.map((op, i) => h('button', {
          class: 'opt ' + op.cls, type: 'button',
          onclick: () => {
            sel = i;
            btns.forEach((b, j) => b.classList.toggle('sel', j === i));
            if (op.say) Sp.speak(op.say); else U.sfx('tap');
            if (o.onSelect) o.onSelect(i);
            api.ready(true);
          }
        }, op.label));
        return h('div', { class: 'ex' }, o.prompt, h('div', { class: 'opts' + (o.list ? ' list' : '') }, btns), o.listen ? muteBtn(api) : null);
      },
      check() {
        const ok = sel === o.correct;
        btns.forEach((b, j) => {
          b.disabled = true;
          b.classList.remove('sel');
          b.classList.add(j === o.correct ? 'ok' : j === sel ? 'bad' : 'dim');
        });
        if (o.onCheck) o.onCheck(ok);
        return { ok, why: ok ? '' : (o.options[sel] && o.options[sel].why) || '' };
      }
    };
  }

  function tiles(o) {
    const items = U.shuffle(o.tokens.concat(o.extra)).map(t => ({ t, used: false }));
    let answer = [], ansRow, poolRow, api;
    const cls = 'tile ' + (o.letters ? 'letter en' : 'en');
    function redraw() {
      ansRow.replaceChildren(...answer.map(p => h('button', {
        class: cls, type: 'button',
        onclick: () => { p.used = false; answer = answer.filter(x => x !== p); redraw(); }
      }, p.t)));
      poolRow.replaceChildren(...items.map(p => h('button', {
        class: cls + (p.used ? ' used' : ''), type: 'button', disabled: p.used, 'aria-hidden': p.used ? 'true' : null,
        onclick: () => {
          if (p.used) return;
          p.used = true;
          answer.push(p);
          if (!o.letters) Sp.speak(p.t, { rateMul: 1.05 }); else U.sfx('tap');
          redraw();
        }
      }, p.t)));
      api.ready(answer.length > 0);
    }
    return {
      title: o.title, autoplay: o.autoplay, fb: o.fb, sayAfter: o.sayAfter, answer: o.target, tokens: o.tokens,
      view(a) {
        api = a;
        ansRow = h('div', { class: 'answer-row' + (o.letters ? ' letters' : '') });
        poolRow = h('div', { class: 'tiles' });
        const n = h('div', { class: 'ex' }, o.prompt, ansRow, poolRow, o.listen ? muteBtn(api) : null);
        redraw();
        return n;
      },
      check() {
        const got = answer.map(p => p.t).join(o.letters ? '' : ' ');
        const ok = U.normLoose(got) === U.normLoose(o.target);
        ansRow.classList.add(ok ? 'ok' : 'bad');
        U.$$('button', ansRow).concat(U.$$('button', poolRow)).forEach(b => { b.disabled = true; });
        let why = '';
        if (!ok) {
          why = 'Ваш ответ: «<span class="en">' + esc(got) + '</span>».';
          if (o.letters) why += ' ' + diffHint(o.target, got);
          else if (o.gap) {
            const wrong = answer.map(p => p.t).find(t => o.alts && o.alts.some(a => a.toLowerCase() === t.toLowerCase()));
            if (wrong) why += ' ' + gapWhy(wrong, o.gap);
          }
        }
        return { ok, why };
      }
    };
  }

  // ---------- builders ----------
  const B = {};

  B.listen_pick_pic = (it, ctx) => {
    if (!it.pic) return null;
    const ds = distract(it, ctx, 3, x => x.kind === it.kind && !!x.pic, x => x.pic);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Послушайте и выберите картинку', prompt: h('div', { class: 'prompt' }, audioRow(it.en)), autoplay: it.en, listen: true,
      options: all.map(x => ({ cls: 'pic-opt' + (U.isTextPic(x.pic) ? ' txt' : ''), label: x.pic, why: 'Это «<span class="en">' + esc(x.en) + '</span>» — ' + esc(x.ru) + '.' })),
      correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.read_pick_pic = (it, ctx) => {
    if (!it.pic) return null;
    const ds = distract(it, ctx, 3, x => x.kind === it.kind && !!x.pic, x => x.pic);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Прочитайте и выберите картинку', prompt: h('div', { class: 'prompt' }, wordNode(it.en)), sayAfter: it.en,
      options: all.map(x => ({ cls: 'pic-opt' + (U.isTextPic(x.pic) ? ' txt' : ''), label: x.pic, why: 'Эта картинка — «<span class="en">' + esc(x.en) + '</span>» (' + esc(x.ru) + '). ' + diffHint(it.en, x.en) })),
      correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.listen_pick_word = (it, ctx) => {
    const cands = spellingOptions(it, ctx, 3);
    if (cands.length < 2) return null;
    const all = U.shuffle([it.en, ...cands]);
    return choice({
      title: 'Какое слово вы услышали?', prompt: h('div', { class: 'prompt' }, audioRow(it.en)), autoplay: it.en, listen: true,
      options: all.map(w => ({ cls: 'word-opt en', label: w, why: wordWhy(it.en, w) })), correct: all.indexOf(it.en), fb: fbOf(it)
    });
  };

  B.pic_pick_word = (it, ctx) => {
    if (!it.pic) return null;
    const ds = distract(it, ctx, 3, x => x.kind === it.kind && !/\s/.test(x.en), x => x.en.toLowerCase());
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Как это по-английски?', prompt: h('div', { class: 'prompt' }, picNode(it.pic), h('div', { class: 'ru-prompt' }, it.ru)), sayAfter: it.en,
      options: all.map(x => ({ cls: 'word-opt en', label: x.en, why: itemWhy(x) })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.read_pick_meaning = (it, ctx) => {
    if (!['word', 'phrase', 'sent'].includes(it.kind)) return null;
    const ds = distract(it, ctx, 3, x => family(it.kind).includes(x.kind), x => x.ru);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Что это значит?', list: true,
      prompt: h('div', { class: 'prompt' }, wordNode(it.en), auBtn(it.en, { cls: 'xs' })),
      sayAfter: it.en, options: all.map(x => ({ cls: 'ru-opt', label: x.ru, why: ruWhy(x) })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.listen_pick_meaning = (it, ctx) => {
    const ds = distract(it, ctx, 3, x => family(it.kind).includes(x.kind), x => x.ru);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Послушайте. Что это значит?', list: true, prompt: h('div', { class: 'prompt' }, audioRow(it.en)), autoplay: it.en, listen: true,
      options: all.map(x => ({ cls: 'ru-opt', label: x.ru, why: ruWhy(x) })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.ru_pick_en = (it, ctx) => {
    const ds = distract(it, ctx, 3, x => family(it.kind).includes(x.kind), x => x.en.toLowerCase());
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    const long = it.en.length > 9;
    return choice({
      title: 'Как сказать по-английски?', list: long,
      prompt: h('div', { class: 'prompt' }, it.pic ? picNode(it.pic) : null, h('div', { class: 'ru-prompt' }, it.ru)), sayAfter: it.en,
      options: all.map(x => ({ cls: 'word-opt en', label: x.en, why: itemWhy(x) })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.spell = (it) => {
    const w = it.en.toLowerCase();
    if (!/^[a-z]{2,8}$/.test(w)) return null;
    const letters = w.split('');
    const extra = U.sample('abcdefghijklmnoprstuvwyz'.split('').filter(c => !letters.includes(c)), w.length <= 3 ? 2 : 3);
    return tiles({
      title: 'Соберите слово из букв', letters: true, tokens: letters, extra, target: w, autoplay: w, fb: fbOf(it),
      prompt: h('div', { class: 'prompt' }, it.pic ? picNode(it.pic) : null, h('div', { class: 'ru-prompt' }, it.ru), audioRow(w))
    });
  };

  B.build = (it, ctx) => {
    const toks = tokenize(it.en);
    if (toks.length < 2) return null;
    const extra = it.gap && it.alts.length && !/\s/.test(it.alts[0]) && !toks.some(t => t.toLowerCase() === it.alts[0].toLowerCase())
      ? [it.alts[0]].concat(extraWords(it, ctx, toks, 1)) : extraWords(it, ctx, toks, toks.length > 5 ? 1 : 2);
    return tiles({
      title: 'Переведите на английский', tokens: toks, extra, target: toks.join(' '), gap: it.gap, alts: it.alts,
      sayAfter: it.en, fb: fbOf(it),
      prompt: h('div', { class: 'prompt' }, h('div', { class: 'ru-prompt' }, it.ru))
    });
  };

  B.listen_build = (it, ctx) => {
    const toks = tokenize(it.en);
    if (toks.length < 2) return null;
    return tiles({
      title: 'Соберите то, что услышали', tokens: toks, extra: extraWords(it, ctx, toks, toks.length > 5 ? 1 : 2), target: toks.join(' '),
      gap: it.gap, alts: it.alts, autoplay: it.en, fb: fbOf(it), listen: true, prompt: h('div', { class: 'prompt' }, audioRow(it.en))
    });
  };

  B.gap = (it) => {
    if (!it.gap) return null;
    const before = it.en.slice(0, it.gapAt), after = it.en.slice(it.gapAt + it.gap.length);
    const blank = h('span', { class: 'blank' }, ' ');
    const opts = U.shuffle([it.gap].concat(it.alts));
    return choice({
      title: 'Вставьте пропущенное слово', sayAfter: it.en, fb: fbOf(it),
      prompt: h('div', { class: 'prompt' }, h('div', { class: 'gap-sent en' }, before, blank, after), h('div', { class: 'ru-hint' }, it.ru)),
      options: opts.map(o => ({ cls: 'word-opt en', label: o, why: gapWhy(o, it.gap) })), correct: opts.indexOf(it.gap),
      onSelect: i => { blank.textContent = opts[i]; },
      onCheck: ok => { blank.textContent = it.gap; blank.classList.add(ok ? 'filled-ok' : 'filled-bad'); }
    });
  };

  B.minimal = (it) => {
    const target = Math.random() < 0.5 ? it.a : it.b;
    const opts = [it.a, it.b];
    const ex = choice({
      title: 'Какое слово прозвучало?', listen: true,
      prompt: h('div', { class: 'prompt' }, audioRow(target.en, { varied: true }), h('p', { class: 'muted small' }, 'Голоса меняются — так слух учится лучше.')),
      options: opts.map(o => ({ cls: 'word-opt en', label: [h('span', { class: 'pic', style: 'display:block;font-size:40px;margin-bottom:4px' }, o.pic), o.en], text: o.en, why: '«<span class="en">' + esc(o.en) + '</span>» — ' + esc(o.ru) + ', а прозвучало «<span class="en">' + esc(target.en) + '</span>».' })),
      correct: opts.indexOf(target), fb: { en: target.en, ru: target.ru, note: it.note }
    });
    ex.autoplay = target.en;
    ex.autoplayOpt = { varied: true };
    ex.afterWrong = () => Sp.speakSeq([it.a.en, it.b.en], { slow: true });
    return ex;
  };

  B.speak = (it, ctx) => {
    if (!Sp.canListen() || ctx.noSpeak) return null;
    const thr = /\s/.test(it.en.trim()) ? 0.72 : 0.6;
    let tries = 0;
    return {
      title: 'Скажите вслух', auto: true, autoplay: it.en,
      view(a) {
        let finished = false;
        const api = { done: r => { if (finished) return; finished = true; mic.disabled = true; skip.disabled = true; a.done(r); } };
        const heard = h('div', { class: 'heard' }, 'Нажмите на микрофон и скажите фразу');
        const mic = h('button', { class: 'mic', type: 'button', 'aria-label': 'Говорить', html: U.icon('mic') });
        mic.onclick = async () => {
          if (finished) return;
          if (mic.classList.contains('listening')) { Sp.stopListening(); return; }
          Sp.stop();
          mic.classList.add('listening');
          heard.textContent = 'Слушаю…';
          const r = await Sp.listen();
          mic.classList.remove('listening');
          if (Sp.micBlocked) {
            heard.textContent = 'Нет доступа к микрофону. Упражнения на произношение отключены — включить можно в профиле.';
            ctx.noSpeak = true;
            setTimeout(() => api.done({ skip: true }), 1800);
            return;
          }
          if (r.error && r.error !== 'no-speech' && r.error !== 'timeout' && r.error !== 'aborted') {
            heard.textContent = r.error === 'network' ? 'Для распознавания речи нужен интернет.' : 'Не получилось включить микрофон. Попробуйте ещё раз.';
            return;
          }
          tries++;
          const best = Sp.bestMatch(it.en, r.alts || []);
          if (best.score >= thr) {
            heard.textContent = '«' + best.text + '»';
            api.done({ ok: true, spoken: true });
          } else if (tries >= 3) {
            api.done({ skip: true, msg: 'Ничего страшного: распознавание речи не идеально. Главное — вы говорили вслух.' });
          } else {
            heard.textContent = r.alts && r.alts[0] ? 'Я услышал: «' + r.alts[0] + '». Попробуйте ещё раз!' : 'Ничего не услышал. Говорите чуть громче.';
          }
        };
        const skip = h('button', {
          class: 'btn ghost sm', type: 'button',
          onclick: () => { Sp.stopListening(); Sp.pauseMic(15); api.done({ skip: true, msg: 'Хорошо, 15 минут без микрофона.' }); }
        }, 'Не могу говорить сейчас');
        return h('div', { class: 'ex' },
          h('div', { class: 'prompt' }, wordNode(it.en), h('div', { class: 'ru-hint' }, it.ru), audioRow(it.en)),
          h('div', { class: 'mic-wrap' }, mic, heard), skip);
      }
    };
  };

  // Shadowing: record yourself, then hear the model and your own voice one after another
  B.shadow = (it, ctx) => {
    if (!Sp.canRecord() || ctx.noRecord) return null;
    const seconds = Math.min(8, 2.5 + it.en.split(/\s+/).length * 0.6);
    return {
      title: 'Послушайте и повторите', auto: true, autoplay: it.en,
      view(a) {
        let finished = false, url = null;
        const done = r => { if (finished) return; finished = true; a.done(r); };
        const status = h('div', { class: 'heard' }, 'Послушайте образец, потом нажмите на микрофон и повторите.');
        const mic = h('button', { class: 'mic', type: 'button', 'aria-label': 'Записать', html: U.icon('mic') });
        const compare = h('button', { class: 'btn sm', type: 'button', hidden: true }, 'Сравнить ещё раз');
        const verdict = h('div', { class: 'row', hidden: true, style: 'justify-content:center;flex-wrap:wrap' },
          h('button', { class: 'btn good sm', type: 'button', onclick: () => done({ ok: true, spoken: true }) }, 'Похоже'),
          h('button', { class: 'btn sm', type: 'button', onclick: () => { verdict.hidden = true; status.textContent = 'Попробуйте ещё раз: нажмите на микрофон.'; } }, 'Ещё раз'),
          h('button', { class: 'btn ghost sm', type: 'button', onclick: () => done({ skip: true, msg: 'Повторим это позже.' }) }, 'Дальше'));
        const playBoth = async () => {
          status.textContent = 'Образец…';
          await Sp.speak(it.en);
          if (finished || !url) return;
          await new Promise(r => setTimeout(r, 350));
          status.textContent = 'Вы…';
          await Sp.playRecording(url);
          if (!finished) status.textContent = 'Похоже на образец? Обратите внимание на звуки и ударение.';
        };
        compare.onclick = playBoth;
        mic.onclick = async () => {
          if (finished) return;
          if (mic.classList.contains('listening')) { Sp.stopRecording(); return; }
          Sp.stop();
