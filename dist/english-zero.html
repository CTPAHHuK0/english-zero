<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Английский с нуля</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Английский с самого нуля: буквы, звуки, чтение, фразы и истории. По 5–15 минут в день.">
<meta name="theme-color" content="#16203A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app (max 560px). The course is drawn as a transit route:
   each unit is a station, each kind of unit is its own colored line. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E7EBF2;
  --ink: #16203A;
  --ink-2: #5A6480;
  --line: #D6DCE7;
  --accent: #FFC21A;
  --accent-ink: #241A00;
  --accent-edge: #D69A00;
  --accent-soft: #FFF2C6;
  --read: #E25F17;
  --talk: #2266D3;
  --gram: #0E9466;
  --story: #B4317F;
  --sel: #2266D3;
  --sel-soft: #E3ECFB;
  --good: #11804A;
  --good-bg: #DCF3E6;
  --bad: #C42F2F;
  --bad-bg: #FAE1E1;
  --shadow: 0 1px 2px rgba(22, 32, 58, .06), 0 4px 14px rgba(22, 32, 58, .06);
  --deep: #16203A;
  --deep-ink: #F4F6FB;
  --deep-ink-2: #AEB8D0;

  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-ui: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-en: 'Andika', 'Golos Text', system-ui, sans-serif;
  --f-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;

  --r-s: 10px;
  --r-m: 16px;
  --r-l: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1220; --surface: #151D30; --surface-2: #1E2840; --ink: #ECF0F8; --ink-2: #9AA6C0; --line: #2A3652;
    --accent: #FFC93D; --accent-ink: #241A00; --accent-edge: #B98500; --accent-soft: #3A3112;
    --read: #FF8447; --talk: #5C9BFF; --gram: #2FC48B; --story: #E764B2;
    --sel: #5C9BFF; --sel-soft: #1C2D52;
    --good: #45D48B; --good-bg: #10301F; --bad: #FF7676; --bad-bg: #3B1A20;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    --deep: #24305A; --deep-ink: #F4F6FB; --deep-ink-2: #B4BED6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1220; --surface: #151D30; --surface-2: #1E2840; --ink: #ECF0F8; --ink-2: #9AA6C0; --line: #2A3652;
  --accent: #FFC93D; --accent-ink: #241A00; --accent-edge: #B98500; --accent-soft: #3A3112;
  --read: #FF8447; --talk: #5C9BFF; --gram: #2FC48B; --story: #E764B2;
  --sel: #5C9BFF; --sel-soft: #1C2D52;
  --good: #45D48B; --good-bg: #10301F; --bad: #FF7676; --bad-bg: #3B1A20;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  --deep: #24305A; --deep-ink: #F4F6FB; --deep-ink-2: #B4BED6;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; }
[hidden] { display: none !important; }
.boot { padding: 40px 16px; text-align: center; color: var(--ink-2); }

#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
#main {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  outline: none;
}
#app.focus #tabbar { display: none; }
#app.focus #main { padding-block: 0; }

/* ---------- Tab bar ---------- */
#tabbar {
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tab {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px 9px;
  border: 0;
  background: none;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 500;
}
.tab .ico { width: 24px; height: 24px; }
.tab.on { color: var(--ink); }
.tab.on .tab-ico { background: var(--accent-soft); border-radius: 999px; }
.tab-ico { display: grid; place-items: center; width: 52px; height: 30px; }
.tab-badge {
  position: absolute;
  top: 4px;
  left: calc(50% + 8px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--bad);
  color: #fff;
  font: 700 11px/18px var(--f-ui);
}

.ico { width: 22px; height: 22px; flex: none; }

/* ---------- Type ---------- */
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h1 { font: 700 24px/1.2 var(--f-display); letter-spacing: -.01em; }
.h2 { font: 700 18px/1.25 var(--f-display); }
.h3 { font: 600 17px/1.3 var(--f-ui); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.en { font-family: var(--f-en); }
.small { font-size: 14px; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 20px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: 16px;
  box-shadow: 0 3px 0 var(--line);
  transition: transform .08s, box-shadow .08s;
  text-decoration: none;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent-edge);
  color: var(--accent-ink);
  box-shadow: 0 3px 0 var(--accent-edge);
  font-weight: 700;
}
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-edge); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--good) 70%, #000); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 70%, #000); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--bad); }
.icon-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--ink-2);
}
.icon-btn:active { background: var(--surface-2); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border-radius: var(--r-l);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card.flat { box-shadow: none; border: 1.5px solid var(--line); }

/* ---------- HUD (home top) ---------- */
.hud { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.hud-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 40px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
  font: 700 15px/1 var(--f-display);
  font-variant-numeric: tabular-nums;
}
.hud-pill .ico { width: 20px; height: 20px; }
.hud-pill.fire { color: var(--read); }
.hud-pill.fire span { color: var(--ink); }
.hud-pill.ice { color: var(--talk); }
.hud-pill.ice span { color: var(--ink); }
.hud-pill.dim { color: var(--ink-2); }
.ring-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); text-align: right; line-height: 1.2; }
.ring-wrap b { color: var(--ink); font: 700 14px var(--f-display); font-variant-numeric: tabular-nums; }
.ring { width: 44px; height: 44px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring.full .fg { stroke: var(--good); }

.home-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
.next-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  padding: 18px;
  border-radius: var(--r-l);
  background: var(--deep);
  color: var(--deep-ink);
  box-shadow: var(--shadow);
}
.next-card .label { color: var(--deep-ink-2); }
.next-card .h2 { color: var(--deep-ink); }
.next-card .sub { font-size: 14px; color: var(--deep-ink-2); }
.next-card .btn { grid-row: 1 / span 3; grid-column: 2; }
.review-card { display: flex; align-items: center; gap: 12px; }
.review-card .num {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--sel-soft);
  color: var(--talk);
  font: 700 18px var(--f-display);
  flex: none;
}
.plan-line { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); padding: 0 4px; }
.plan-line b { color: var(--ink); font-weight: 600; }
.plan-line .ico { width: 18px; height: 18px; margin-top: 1px; color: var(--ink-2); }

/* ---------- Route (course map) ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 4px 10px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 6px; border-radius: 3px; background: var(--lc); }
.zone-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 22px 4px 10px;
}
.zone-title .zone-n { font: 700 13px var(--f-display); color: var(--ink-2); letter-spacing: .04em; }
.zone-title .h2 { font-size: 17px; }

.route { position: relative; }
.station {
  position: relative;
  display: block;
  width: 100%;
  padding: 0 0 12px 54px;
  border: 0;
  background: none;
  text-align: left;
}
.station::before {
  content: "";
  position: absolute;
  left: 21px;
  top: 0;
  bottom: 0;
  width: 8px;
  background: var(--lc);
  opacity: .9;
}
.station.first::before { top: 22px; }
.station.last::before { bottom: auto; height: 22px; }
.station.locked::before { opacity: .25; }
.st-mark {
  position: absolute;
  left: 11px;
  top: 12px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 6px solid var(--lc);
  background: var(--surface);
  display: grid;
  place-items: center;
  color: #fff;
  z-index: 1;
}
.station.done .st-mark { background: var(--lc); border-color: var(--lc); }
.station.done .st-mark .ico { width: 14px; height: 14px; stroke-width: 3.5; }
.station.current .st-mark { box-shadow: 0 0 0 5px var(--accent); animation: halo 2.4s ease-in-out infinite; }
.station.locked .st-mark { border-color: var(--line); background: var(--surface-2); }
@keyframes halo { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 45%, transparent); } }
.st-body {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r-m);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--ink);
}
.station.current .st-body { outline: 2.5px solid var(--accent); }
.station.locked .st-body { box-shadow: none; background: transparent; border: 1.5px dashed var(--line); color: var(--ink-2); }
.st-glyph {
  display: grid;
  place-items: center;
  min-width: 52px;
  height: 52px;
  padding: 0 8px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--lc) 14%, var(--surface));
  color: var(--lc);
  font: 700 17px/1 var(--f-en);
  white-space: nowrap;
}
.station.locked .st-glyph { background: var(--surface-2); color: var(--ink-2); }
.st-num { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; }
.st-title { font-weight: 700; font-size: 16px; line-height: 1.25; }
.st-sub { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.st-prog { font: 700 13px var(--f-display); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.st-prog .ico { width: 18px; height: 18px; }

/* ---------- Sheet / modal ---------- */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(8, 12, 24, .5);
  animation: fade .18s ease-out;
}
.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 88%;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  animation: rise .22s ease-out;
}
.sheet-grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: -8px auto 14px; }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.sheet-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.lesson-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 18px; }
.lesson-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  text-align: left;
}
.lesson-row .dot {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--line);
  font: 700 13px var(--f-display);
  color: var(--ink-2);
  flex: none;
}
.lesson-row.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.lesson-row.done .dot .ico { width: 16px; height: 16px; stroke-width: 3; }
.lesson-row.next { border-color: var(--accent-edge); background: var(--accent-soft); }
.lesson-row.next .dot { border-color: var(--accent-edge); color: var(--accent-ink); background: var(--accent); }
.lesson-row:disabled { opacity: .5; }
.lesson-row .lr-sub { font-size: 13px; color: var(--ink-2); }
.tip-list { display: flex; flex-direction: column; gap: 10px; }
.tip { padding: 14px; border-radius: var(--r-m); background: var(--surface); border-left: 5px solid var(--lc, var(--accent)); }
.tip h4 { margin: 0 0 4px; font-size: 15px; }
.tip p { font-size: 15px; color: var(--ink); }
.tip .chips { margin-top: 8px; }

/* ---------- Lesson shell ---------- */
.lesson {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.lesson-top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px;
  background: var(--bg);
}
.progress { flex: 1; height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; border-radius: 7px; background: var(--accent); transition: width .35s ease; }
.combo { font: 700 13px var(--f-display); color: var(--read); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.lesson-body { flex: 1; padding: 14px 0 24px; display: flex; flex-direction: column; }
.lesson-foot {
  position: sticky;
  bottom: 0;
  z-index: 5;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  border-top: 1.5px solid var(--line);
}
.lesson-foot.good { background: var(--good-bg); border-color: transparent; }
.lesson-foot.bad { background: var(--bad-bg); border-color: transparent; }
.feedback { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; animation: rise .18s ease-out; }
.feedback .fb-ico {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex: none; color: #fff;
}
.lesson-foot.good .fb-ico { background: var(--good); }
.lesson-foot.bad .fb-ico { background: var(--bad); }
.lesson-foot.neutral .fb-ico { background: var(--ink-2); }
.fb-title { font: 700 18px/1.2 var(--f-display); }
.lesson-foot.good .fb-title { color: var(--good); }
.lesson-foot.bad .fb-title { color: var(--bad); }
.fb-body { font-size: 15px; margin-top: 4px; }
.fb-body .en { font-size: 19px; font-weight: 700; }
.fb-replay { margin-left: auto; }

.ex { display: flex; flex-direction: column; gap: 18px; flex: 1; }
.ex-title { font: 700 19px/1.3 var(--f-display); margin-bottom: 14px; text-wrap: balance; }
.prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 6px 0; text-align: center; }
.bigword { font: 700 44px/1.15 var(--f-en); letter-spacing: .01em; word-break: break-word; }
.bigword.md { font-size: 30px; }
.bigword.sm { font-size: 24px; line-height: 1.3; }
.bigletter { font: 700 104px/1 var(--f-en); letter-spacing: .04em; }
.bigletter small { font-size: 64px; opacity: .55; margin-left: 10px; }
.ru-prompt { font-size: 20px; font-weight: 600; }
.pic { font-family: var(--f-emoji); font-size: 76px; line-height: 1; }
.pic.txt { font: 700 52px/1 var(--f-display); color: var(--ink); }
.audio-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.au {
  display: grid;
  place-items: center;
  width: 92px;
  height: 92px;
  border-radius: 28px;
  border: 0;
  background: var(--talk);
  color: #fff;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--talk) 65%, #000);
}
.au .ico { width: 44px; height: 44px; }
.au:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--talk) 65%, #000); }
.au.sm { width: 52px; height: 52px; border-radius: 16px; }
.au.sm .ico { width: 26px; height: 26px; }
.au.slow { width: 52px; height: 52px; border-radius: 16px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 3px 0 var(--line); font-size: 24px; font-family: var(--f-emoji); }
.au.xs { width: 40px; height: 40px; border-radius: 12px; }
.au.xs .ico { width: 22px; height: 22px; }
.au.playing { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.15); transform: scale(1.04); } }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opts.list { grid-template-columns: 1fr; }
.opt {
  min-height: 64px;
  padding: 12px;
  border: 2px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  box-shadow: 0 3px 0 var(--line);
  color: var(--ink);
  font-size: 17px;
  font-weight: 500;
  line-height: 1.3;
  transition: transform .08s, border-color .12s, background .12s;
}
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }

  S.speakSeq = function (list, opt) {

    stopSound();
    return playSeq(list, opt || {}, my);
  };

      await speakOne(list[i], opt, my);
      if (i < list.length - 1) await new Promise(r => setTimeout(r, 220));
    }
  }

  async function speakOne(text, opt, my) {

      if (url) return playUrl(url, rate);

      }

    const good = voices.filter(v => score(v) >= 10);
    const list = (good.length > 1 ? good : voices).filter(v => v.voiceURI !== lastVaried);

  let active = null;
  S.listen = function () {
    return new Promise(resolve => {

      try { r = new Rec(); } catch (e) { resolve({ error: 'unsupported', alts: [] }); return; }
      r.lang = 'en-US';
      r.interimResults = false;
      r.maxAlternatives = 5;
      r.continuous = false;
      let done = false;
      const fin = x => {
        if (done) return;
        done = true;
        clearTimeout(t);
        active = null;
        try { r.abort(); } catch (e) { /* ignore */ }
        resolve(x);
      };
      r.onresult = e => {
        const alts = [];
        const res = e.results[0];
        for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
        fin({ alts });
      };
      r.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') S.micBlocked = true;
        fin({ error: e.error, alts: [] });
      };
      r.onend = () => setTimeout(() => fin({ alts: [] }), 300);
      const t = setTimeout(() => fin({ error: 'timeout', alts: [] }), 8000);
      active = r;
      try { r.start(); } catch (e) { fin({ error: 'start', alts: [] }); }
    });
  };
  S.stopListening = () => { if (active) try { active.stop(); } catch (e) { /* ignore */ } };

  S.bestMatch = function (target, alts) {
    const tn = A.U.normLoose(target);
    let best = { score: 0, text: alts[0] || '' };
    alts.forEach(a => {
      const sc = A.U.sim(A.U.normLoose(a), tn);
      if (sc > best.score) best = { score: sc, text: a };
    });
    return best;
  };

//   W('cat|кот|🐱')                 word
//   P('Thank you!|Спасибо!|🙏')      phrase (learned as a whole chunk)
//   S('She [is] a doctor.|Она врач.', 'am,are')   sentence; [..] marks the gap, then wrong options
//   MP('ship|корабль|🚢', 'sheep|овца|🐑', 'note')  minimal pair for listening
//   LT('s', 'a')                      letters / letter combinations from letters.js
//   N('abc')                          letter names (alphabet)
//   REF('w:cat')                      reuse an item introduced earlier
window.A = window.A || {};
A.DATA = { letters: {}, units: [], stories: {}, gloss: {}, zones: {} };

(function (D) {
  const slug = s => s.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9 ]/g, '').trim().replace(/\s+/g, '_');
  const split = s => s.split('|').map(x => x.trim());

  D.P = (s, x) => {

      id: 's:' + slug(en), kind: 'sent', en, ru, pic: pic || '',
      gap: m ? m[1] : null, gapAt: m ? raw.indexOf('[') : -1,

    return {
      id: 'mp:' + pa[0] + '-' + pb[0], kind: 'pair',
      a: { en: pa[0], ru: pa[1], pic: pa[2] || '' },
      b: { en: pb[0], ru: pb[1], pic: pb[2] || '' },

<script>
'use strict';
// Builds the course: resolves item references, assigns each item to the unit where it first
// appears, and splits units into lessons.
(function (A) {
  const D = A.DATA;
  const C = A.Course = { items: {}, list: [], units: [], unitIndex: {}, lessonByKey: {} };

  C.LINES = {
    read: { name: 'Чтение', color: 'var(--read)' },
    talk: { name: 'Разговор', color: 'var(--talk)' },
    gram: { name: 'Грамматика', color: 'var(--gram)' },
    story: { name: 'Истории', color: 'var(--story)' }
  };

  function nameItem(letter) {
    return {
      id: 'N_' + letter.ch, kind: 'name', ch: letter.ch, uc: letter.uc, say: letter.say,
      en: letter.uc, ru: 'буква ' + letter.uc, letterId: letter.id
    };
  }

  function resolve(raw) {
    if (raw.ref) {
      const L = D.letters[raw.ref];
      if (!L) throw new Error('Unknown letter ' + raw.ref);
      return raw.asName ? nameItem(L) : L;
    }
    if (raw.refId) {
      const it = C.items[raw.refId];
      if (!it) throw new Error('Reference to an item not introduced yet: ' + raw.refId);
      return it;
    }
    return raw;
  }

  function chunk(arr, n) {
    const out = [];
    for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    // avoid a lonely last lesson with one item
    if (out.length > 1 && out[out.length - 1].length === 1) out[out.length - 2].push(out.pop()[0]);
    return out;
  }

  C.build = function () {
    const seen = new Set();
    D.units.forEach((u, ui) => {
      u.index = ui;
      C.unitIndex[u.id] = ui;
      // Content files describe lessons in u.lessons (explicit groups) or u.items (auto-split)
      const authored = u.authored || (u.authored = Array.isArray(u.lessons) ? u.lessons : (u.items ? chunk(u.items, u.size || 4) : []));
      u.lessons = [];
      if (u.line === 'story') {
        u.lessons.push({ key: u.id + ':0', unit: u, idx: 0, title: D.stories[u.story].title, story: u.story, newIds: [], refIds: [] });
      } else {
        authored.forEach((def, li) => {
          const g = Array.isArray(def) ? { items: def } : def;
          const newIds = [], refIds = [];
          g.items.forEach(r => {
            const it = resolve(r);
            if (!C.items[it.id]) C.items[it.id] = it;
            if (seen.has(it.id)) { refIds.push(it.id); return; }
            seen.add(it.id);
            newIds.push(it.id);
            it.unit = u.id;
            if (it.kind === 'word' && u.line === 'read') it.read = true;
          });
          u.lessons.push({ key: u.id + ':' + li, unit: u, idx: li, title: g.title || ('Урок ' + (li + 1)), newIds, refIds, mode: g.mode || null });
        });
        if (u.lessons.length > 1 && !u.noReview) {
          const all = [].concat(...u.lessons.map(l => l.newIds));
          u.lessons.push({ key: u.id + ':r', unit: u, idx: u.lessons.length, title: 'Закрепление', review: true, newIds: [], refIds: all });
        }
      }
      u.lessons.forEach(l => { C.lessonByKey[l.key] = l; });
      C.units.push(u);
    });
    C.list = Object.values(C.items);

    // Lexicon for tap-to-translate in stories
    C.lexicon = {};
    C.list.forEach(it => { if (it.kind === 'word') C.lexicon[it.en.toLowerCase()] = it.ru; });
    Object.keys(D.gloss).forEach(k => { if (!C.lexicon[k]) C.lexicon[k] = D.gloss[k]; });
  };

  C.gloss = function (word) {
    const w = A.U.norm(word);
    if (!w) return '';
    if (C.lexicon[w]) return C.lexicon[w];
    const stems = [w.replace(/'s$/, ''), w.replace(/s$/, ''), w.replace(/es$/, ''), w.replace(/ies$/, 'y')];
    for (const s of stems) if (s && C.lexicon[s]) return C.lexicon[s];
    return '';
  };

  const S = () => A.Store.state;
  C.lessonDone = key => !!S().lessons[key];
  C.unitDoneCount = u => u.lessons.filter(l => C.lessonDone(l.key)).length;
  C.unitComplete = u => u.lessons.every(l => C.lessonDone(l.key));
  C.unitUnlocked = u => S().settings.openAll || u.index === 0 || C.unitComplete(C.units[u.index - 1]);
  C.lessonUnlocked = l => {
    if (!C.unitUnlocked(l.unit)) return false;
    if (S().settings.openAll) return true;
    return l.idx === 0 || C.lessonDone(l.unit.lessons[l.idx - 1].key);
  };
  C.nextLesson = function () {
    for (const u of C.units) {
      if (!C.unitUnlocked(u)) break;
      const l = u.lessons.find(x => !C.lessonDone(x.key));
      if (l) return l;
    }
    return null;
  };
})(window.A);

</script>
<script>
'use strict';
// XP, daily goal, streak with freezes, achievements.
(function (A) {
  const U = A.U;
  const P = A.Progress = {};
  const st = () => A.Store.state;

  P.todayXP = () => st().stats.days[U.dayKey()] || 0;

  // Streak shown to the learner: still alive if the last active day was today or yesterday,
  // or if the missed days can be covered by freezes.
  P.streakInfo = function () {
    const s = st().stats;
    if (!s.last) return { n: 0, today: false, atRisk: false };
    const today = U.dayKey();
    const gap = U.daysBetween(s.last, today);
    if (gap <= 0) return { n: s.streak, today: true, atRisk: false };
    if (gap === 1) return { n: s.streak, today: false, atRisk: true };
    if (gap - 1 <= s.freezes) return { n: s.streak, today: false, atRisk: true, frozen: gap - 1 };
    return { n: 0, today: false, atRisk: false, lost: s.streak };
  };

  // Call after every finished lesson / review / story
  P.addXP = function (xp, seconds) {
    const s = st().stats;
    const today = U.dayKey();
    const before = P.todayXP();
    s.days[today] = before + xp;
    s.xp += xp;
    s.seconds += Math.round(seconds || 0);
    const events = {};
    if (s.last !== today) {
      const gap = s.last ? U.daysBetween(s.last, today) : 0;
      if (s.last && gap === 1) s.streak += 1;
      else if (s.last && gap > 1 && gap - 1 <= s.freezes) { s.freezes -= gap - 1; s.streak += 1; events.usedFreeze = gap - 1; }
      else s.streak = 1;
      s.last = today;
      events.streakUp = s.streak;
      if (s.streak % 7 === 0 && s.freezes < 2) { s.freezes += 1; events.newFreeze = true; }
    }
    s.best = Math.max(s.best, s.streak);
    const goal = st().settings.goal;
    if (before < goal && s.days[today] >= goal) events.goalDone = true;
    // keep the day log small
    const keys = Object.keys(s.days).sort();
    while (keys.length > 120) delete s.days[keys.shift()];
    return events;
  };

  const countKinds = kinds => Object.keys(st().items).filter(id => {
    const it = A.Course.items[id];
    return it && kinds.includes(it.kind);
  }).length;
  P.learnedWords = () => countKinds(['word', 'phrase', 'sent']);
  P.learnedLetters = () => Object.keys(st().items).filter(id => /^L_[a-z]$/.test(id)).length;

  P.BADGES = [
    { id: 'first', mark: '1', t: 'Первый шаг', d: 'Пройден первый урок', test: s => Object.keys(s.lessons).length >= 1 },
    { id: 'goal', mark: 'XP', t: 'Цель дня', d: 'Выполнена дневная цель', test: s => Object.values(s.stats.days).some(x => x >= s.settings.goal) },
    { id: 'perfect', mark: '100%', t: 'Без ошибок', d: 'Урок без единой ошибки', test: s => s.stats.perfect >= 1 },
    { id: 'letters', mark: 'Aa', t: 'Все буквы', d: 'Изучены все 26 букв', test: () => P.learnedLetters() >= 26 },
    { id: 'abc', mark: 'A–Z', t: 'Алфавит', d: 'Пройдена станция «Алфавит»', test: () => A.Course.unitComplete(A.Course.units[A.Course.unitIndex.u10]) },
    { id: 'story', mark: 'Ст', t: 'Читатель', d: 'Прочитана первая история', test: s => s.stats.stories >= 1 },
    { id: 'w50', mark: '50', t: '50 слов и фраз', d: 'В словаре 50 слов и фраз', test: () => P.learnedWords() >= 50 },
    { id: 'w100', mark: '100', t: '100 слов и фраз', d: 'В словаре 100 слов и фраз', test: () => P.learnedWords() >= 100 },
    { id: 'w250', mark: '250', t: '250 слов и фраз', d: 'В словаре 250 слов и фраз', test: () => P.learnedWords() >= 250 },
    { id: 's3', mark: '3', t: '3 дня подряд', d: 'Серия из 3 дней', test: s => s.stats.best >= 3 },
    { id: 's7', mark: '7', t: 'Неделя', d: 'Серия из 7 дней', test: s => s.stats.best >= 7 },
    { id: 's30', mark: '30', t: 'Месяц', d: 'Серия из 30 дней', test: s => s.stats.best >= 30 },
    { id: 'r10', mark: '×10', t: 'Повторение', d: '10 сессий повторения', test: s => s.stats.reviews >= 10 },
    { id: 'voice', mark: 'Mic', t: 'Голос', d: '10 раз сказали фразу вслух', test: s => s.stats.spoken >= 10 },
    { id: 'finish', mark: 'NY', t: 'Нью-Йорк', d: 'Пройден весь маршрут', test: () => A.Course.units.every(A.Course.unitComplete) }
  ];

  // Returns badges earned just now
  P.checkBadges = function () {
    const s = st();
    const fresh = [];
    P.BADGES.forEach(b => {
      if (!s.badges[b.id] && b.test(s)) { s.badges[b.id] = U.dayKey(); fresh.push(b); }
    });
    return fresh;
  };

  P.dueIds = function () {
    const today = U.dayKey();
    return Object.keys(st().items).filter(id => A.Course.items[id] && A.SRS.isDue(st().items[id], today));
  };
})(window.A);

</script>
<script>
'use strict';
// Exercise builders. Each builder returns an object:
//   { title, view(api) -> Node, check() -> {ok}, autoplay?, sayAfter?, fb?, auto? }
// api.ready(bool) enables the Check button; api.done(result) finishes exercises without it.
(function (A) {
  const U = A.U, h = U.h;
  const C = A.Course, Sp = A.Speech;
  const X = A.Ex = {};

  // Words that sound the same must never be offered as alternatives in listening tasks
  const HOMO = [['see', 'sea'], ['be', 'bee'], ['to', 'two', 'too'], ['here', 'hear'], ['no', 'know'], ['right', 'write'],
    ['for', 'four'], ['one', 'won'], ['son', 'sun'], ['eight', 'ate'], ['meat', 'meet'], ['by', 'bye', 'buy'], ['i', 'eye'],
    ['tea', 'tee'], ['there', 'their'], ['our', 'hour'], ['red', 'read'], ['wait', 'weight'], ['mail', 'male'], ['road', 'rode'],
    ['nose', 'knows'], ['rose', 'rows'], ['cell', 'sell'], ['ant', 'aunt'], ['cent', 'sent'], ['sum', 'some'], ['night', 'knight'], ['plane', 'plain']];
  const homoOf = {};
  HOMO.forEach(g => g.forEach(w => { homoOf[w] = g; }));
  const isHomo = (a, b) => { const g = homoOf[String(a).toLowerCase()]; return !!g && g.includes(String(b).toLowerCase()); };

  // Letters that share a sound (avoid offering them as "wrong" answers to each other)
  const SOUND = { c: 'k', k: 'k', ck: 'k', q: 'k', ee: 'i:', ea: 'i:', ai: 'ei', ay: 'ei', a_e: 'ei', oa: 'ou', ow: 'ou', o_e: 'ou', igh: 'ai', y_end: 'ai', i_e: 'ai', ou: 'au', ow2: 'au', x: 'ks' };
  const soundOf = L => SOUND[L.id.slice(2)] || L.id;

  const LETTER_CONF = { b: 'dpq', d: 'bpq', p: 'qbd', q: 'pgd', n: 'umh', u: 'nvy', m: 'nw', w: 'mv', i: 'ljt', l: 'ijt', j: 'ig', g: 'qj', h: 'nk', v: 'uwy', y: 'vj', e: 'ca', a: 'eo', o: 'ac', c: 'eo', r: 'nt', t: 'lf', f: 'tl', s: 'zc', z: 'sx', x: 'zk', k: 'xh' };
  const NAME_CONF = { A: 'ERHI', B: 'VDPE', C: 'SZKE', D: 'BTEG', E: 'IAYG', F: 'SVHX', G: 'JZDE', H: 'AKEX', I: 'EYAR', J: 'GAKY', K: 'QCAJ', L: 'MNEF', M: 'NLE', N: 'MLE', O: 'UAQ', P: 'BTDE', Q: 'KUCW', R: 'AEIO', S: 'FXCZ', T: 'DPEB', U: 'YWQO', V: 'BZWE', W: 'VYUD', X: 'SKZE', Y: 'WIUE', Z: 'CGSE' };
  const GRAPHEMES = ['igh', 'sh', 'ch', 'th', 'ck', 'ng', 'ee', 'ea', 'oo', 'ai', 'ay', 'oa', 'ow', 'ou', 'ar', 'or', 'er', 'ir', 'ur', 'qu'];

  X.nameSay = ch => ch.toUpperCase() + '.';

  // ---------- small view helpers ----------
  function play(btn, text, opt) {
    btn.classList.add('playing');
    const f = opt && opt.varied ? Sp.speakVaried : Sp.speak;
    f(text, opt).then(() => btn.classList.remove('playing'));
  }
  function auBtn(text, opt) {
    opt = opt || {};
    const b = h('button', { class: 'au' + (opt.cls ? ' ' + opt.cls : ''), type: 'button', 'aria-label': 'Прослушать', html: U.icon('speaker') });
    b.onclick = () => play(b, typeof text === 'function' ? text() : text, opt);
    return b;
  }
  function slowBtn(text, opt) {
    const b = h('button', { class: 'au slow', type: 'button', 'aria-label': 'Медленно', title: 'Медленно' }, '🐢');
    b.onclick = () => play(b, typeof text === 'function' ? text() : text, Object.assign({}, opt, { slow: true }));
    return b;
  }
  function audioRow(text, opt) { return h('div', { class: 'audio-row' }, auBtn(text, opt), slowBtn(text, opt)); }
  X.auBtn = auBtn;
  X.slowBtn = slowBtn;
  function picNode(pic) { return h('div', { class: 'pic' + (U.isTextPic(pic) ? ' txt' : '') }, pic); }
  X.picNode = picNode;
  const sizeCls = t => t.length > 22 ? ' sm' : t.length > 9 ? ' md' : '';
  function wordNode(t) { return h('div', { class: 'bigword en' + sizeCls(t) }, t); }
  const fbOf = it => ({ en: it.en, ru: it.ru });
  const family = k => (k === 'phrase' || k === 'sent') ? ['phrase', 'sent'] : [k];

  const tokenize = U.tokenize;

  // ---------- distractors ----------
  function pool(item, ctx, test) {
    const out = [], seen = new Set([item.id]);
    const push = it => { if (it && !seen.has(it.id) && test(it)) { seen.add(it.id); out.push(it); } };
    U.shuffle(ctx.knownIds).forEach(id => push(C.items[id]));
    const maxU = ctx.unitIndex == null ? 999 : ctx.unitIndex + 1;
    const rest = U.shuffle(C.list);
    rest.forEach(it => { const ui = C.unitIndex[it.unit]; if (ui != null && ui <= maxU) push(it); });
    rest.forEach(push);
    return out;
  }
  function distract(item, ctx, n, test, key) {
    const used = new Set([key(item)]);
    const res = [];
    for (const it of pool(item, ctx, test)) {
      const k = key(it);
      if (!k || used.has(k)) continue;
      if (item.en && it.en && isHomo(item.en, it.en)) continue;
      used.add(k);
      res.push(it);
      if (res.length >= n) break;
    }
    return res;
  }

  function syllables(w) { return (w.replace(/e$/, '').match(/[aeiouy]+/g) || []).length || 1; }
  function similar(w, ctx) {
    const c = new Map();
    const add = (s, sc) => {
      if (s && s !== w && !isHomo(w, s) && /^[a-z]+$/.test(s) && (!c.has(s) || c.get(s) > sc)) c.set(s, sc);
    };
    C.list.forEach(it => {
      if (it.kind !== 'word') return;
      const e = it.en.toLowerCase();
      if (!/^[a-z]+$/.test(e) || Math.abs(e.length - w.length) > 1) return;
      const d = U.lev(e, w);
      if (d >= 1 && d <= 2) add(e, d + (ctx.known.has(it.id) ? 0 : 0.3));
    });
    if (syllables(w) === 1) {
      for (let i = 0; i < w.length; i++) {
        if (!'aeiou'.includes(w[i]) || (i === w.length - 1 && w[i] === 'e') || 'aeiou'.includes(w[i + 1] || '') || 'aeiou'.includes(w[i - 1] || '')) continue;
        for (const v of 'aeiou') if (v !== w[i]) add(w.slice(0, i) + v + w.slice(i + 1), 1.4);
      }
    }
    [['th', 's'], ['th', 't'], ['th', 'f'], ['w', 'v'], ['v', 'w'], ['ee', 'i'], ['ea', 'i'], ['sh', 's'], ['ch', 'sh'], ['sh', 'ch'], ['ng', 'n']].forEach(([f, t]) => {
      const i = w.indexOf(f);
      if (i >= 0) add(w.slice(0, i) + t + w.slice(i + f.length), 1.1);
    });
    const m = w.match(/^([^aeiou]+)i([^aeiou]+)$/);
    if (m) add(m[1] + 'ee' + m[2], 1.1);
    return [...c.entries()].sort((a, b) => a[1] - b[1]).slice(0, 7).map(e => e[0]);
  }
  function spellingOptions(it, ctx, n) {
    const w = it.en;
    let opts;
    if (it.unit === 'u22' || !/^[a-z]+$/i.test(w) || w.length < 2) {
      opts = distract(it, ctx, n, x => x.kind === 'word' && !x.pic && /^[a-z]+$/i.test(x.en), x => x.en.toLowerCase()).map(x => x.en);
    } else {
      opts = U.sample(similar(w.toLowerCase(), ctx), n);
      if (opts.length < n) {
        opts = opts.concat(distract(it, ctx, n - opts.length,
          x => x.kind === 'word' && /^[a-z]+$/i.test(x.en) && !opts.includes(x.en.toLowerCase()), x => x.en.toLowerCase()).map(x => x.en.toLowerCase()));
      }
      if (/^[A-Z]/.test(w)) opts = opts.map(o => o[0].toUpperCase() + o.slice(1));
    }
    return opts.filter(o => o !== w);
  }
  function extraWords(it, ctx, toks, n) {
    const have = new Set(toks.map(t => t.toLowerCase()));
    const out = [];
    const src = pool(it, ctx, x => x.kind === 'phrase' || x.kind === 'sent');
    for (const x of src) {
      for (const t of tokenize(x.en)) {
        const l = t.toLowerCase();
        if (have.has(l) || out.some(o => o.toLowerCase() === l)) continue;
        out.push(t);
        if (out.length >= n) return out;
      }
    }
    return out;
  }

  // ---------- generic exercise shapes ----------
  function choice(o) {
    let sel = -1, btns = [];
    return {
      title: o.title, autoplay: o.autoplay, autoplayOpt: o.autoplayOpt, fb: o.fb, sayAfter: o.sayAfter,
      view(api) {
        btns = o.options.map((op, i) => h('button', {
          class: 'opt ' + op.cls, type: 'button',
          onclick: () => {
            sel = i;
            btns.forEach((b, j) => b.classList.toggle('sel', j === i));
            if (op.say) Sp.speak(op.say); else U.sfx('tap');
            if (o.onSelect) o.onSelect(i);
            api.ready(true);
          }
        }, op.label));
        return h('div', { class: 'ex' }, o.prompt, h('div', { class: 'opts' + (o.list ? ' list' : '') }, btns));
      },
      check() {
        const ok = sel === o.correct;
        btns.forEach((b, j) => {
          b.disabled = true;
          b.classList.remove('sel');
          b.classList.add(j === o.correct ? 'ok' : j === sel ? 'bad' : 'dim');
        });
        if (o.onCheck) o.onCheck(ok);
        return { ok };
      }
    };
  }

  function tiles(o) {
    const items = U.shuffle(o.tokens.concat(o.extra)).map(t => ({ t, used: false }));
    let answer = [], ansRow, poolRow, api;
    const cls = 'tile ' + (o.letters ? 'letter en' : 'en');
    function redraw() {
      ansRow.replaceChildren(...answer.map(p => h('button', {
        class: cls, type: 'button',
        onclick: () => { p.used = false; answer = answer.filter(x => x !== p); redraw(); }
      }, p.t)));
      poolRow.replaceChildren(...items.map(p => h('button', {
        class: cls + (p.used ? ' used' : ''), type: 'button', disabled: p.used, 'aria-hidden': p.used ? 'true' : null,
        onclick: () => {
          if (p.used) return;
          p.used = true;
          answer.push(p);
          if (!o.letters) Sp.speak(p.t, { rateMul: 1.05 }); else U.sfx('tap');
          redraw();
        }
      }, p.t)));
      api.ready(answer.length > 0);
    }
    return {
      title: o.title, autoplay: o.autoplay, fb: o.fb, sayAfter: o.sayAfter,
      view(a) {
        api = a;
        ansRow = h('div', { class: 'answer-row' + (o.letters ? ' letters' : '') });
        poolRow = h('div', { class: 'tiles' });
        const n = h('div', { class: 'ex' }, o.prompt, ansRow, poolRow);
        redraw();
        return n;
      },
      check() {
        const got = answer.map(p => p.t).join(o.letters ? '' : ' ');
        const ok = U.normLoose(got) === U.normLoose(o.target);
        ansRow.classList.add(ok ? 'ok' : 'bad');
        U.$$('button', ansRow).concat(U.$$('button', poolRow)).forEach(b => { b.disabled = true; });
        return { ok };
      }
    };
  }

  // ---------- builders ----------
  const B = {};

  B.listen_pick_pic = (it, ctx) => {
    if (!it.pic) return null;
    const ds = distract(it, ctx, 3, x => x.kind === it.kind && !!x.pic, x => x.pic);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Послушайте и выберите картинку', prompt: h('div', { class: 'prompt' }, audioRow(it.en)), autoplay: it.en,
      options: all.map(x => ({ cls: 'pic-opt' + (U.isTextPic(x.pic) ? ' txt' : ''), label: x.pic })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.read_pick_pic = (it, ctx) => {
    if (!it.pic) return null;
    const ds = distract(it, ctx, 3, x => x.kind === it.kind && !!x.pic, x => x.pic);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Прочитайте и выберите картинку', prompt: h('div', { class: 'prompt' }, wordNode(it.en)), sayAfter: it.en,
      options: all.map(x => ({ cls: 'pic-opt' + (U.isTextPic(x.pic) ? ' txt' : ''), label: x.pic })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.listen_pick_word = (it, ctx) => {
    const cands = spellingOptions(it, ctx, 3);
    if (cands.length < 2) return null;
    const all = U.shuffle([it.en, ...cands]);
    return choice({
      title: 'Какое слово вы услышали?', prompt: h('div', { class: 'prompt' }, audioRow(it.en)), autoplay: it.en,
      options: all.map(w => ({ cls: 'word-opt en', label: w })), correct: all.indexOf(it.en), fb: fbOf(it)
    });
  };

  B.pic_pick_word = (it, ctx) => {
    if (!it.pic) return null;
    const ds = distract(it, ctx, 3, x => x.kind === it.kind && !/\s/.test(x.en), x => x.en.toLowerCase());
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Как это по-английски?', prompt: h('div', { class: 'prompt' }, picNode(it.pic), h('div', { class: 'ru-prompt' }, it.ru)), sayAfter: it.en,
      options: all.map(x => ({ cls: 'word-opt en', label: x.en })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.read_pick_meaning = (it, ctx) => {
    if (!family(it.kind).some(k => ['word', 'phrase', 'sent'].includes(k))) return null;
    const ds = distract(it, ctx, 3, x => family(it.kind).includes(x.kind), x => x.ru);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Что это значит?', list: true,
      prompt: h('div', { class: 'prompt' }, wordNode(it.en), auBtn(it.en, { cls: 'xs' })),
      sayAfter: it.en, options: all.map(x => ({ cls: 'ru-opt', label: x.ru })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.listen_pick_meaning = (it, ctx) => {
    const ds = distract(it, ctx, 3, x => family(it.kind).includes(x.kind), x => x.ru);
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    return choice({
      title: 'Послушайте. Что это значит?', list: true, prompt: h('div', { class: 'prompt' }, audioRow(it.en)), autoplay: it.en,
      options: all.map(x => ({ cls: 'ru-opt', label: x.ru })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.ru_pick_en = (it, ctx) => {
    const ds = distract(it, ctx, 3, x => family(it.kind).includes(x.kind), x => x.en.toLowerCase());
    if (ds.length < 2) return null;
    const all = U.shuffle([it, ...ds]);
    const long = it.en.length > 9;
    return choice({
      title: 'Как сказать по-английски?', list: long,
      prompt: h('div', { class: 'prompt' }, it.pic ? picNode(it.pic) : null, h('div', { class: 'ru-prompt' }, it.ru)), sayAfter: it.en,
      options: all.map(x => ({ cls: 'word-opt en', label: x.en })), correct: all.indexOf(it), fb: fbOf(it)
    });
  };

  B.spell = (it) => {
    const w = it.en.toLowerCase();
    if (!/^[a-z]{2,8}$/.test(w)) return null;
    const letters = w.split('');
    const extra = U.sample('abcdefghijklmnoprstuvwyz'.split('').filter(c => !letters.includes(c)), w.length <= 3 ? 2 : 3);
    return tiles({
      title: 'Соберите слово из букв', letters: true, tokens: letters, extra, target: w, autoplay: w, fb: fbOf(it),
      prompt: h('div', { class: 'prompt' }, it.pic ? picNode(it.pic) : null, h('div', { class: 'ru-prompt' }, it.ru), audioRow(w))
    });
  };

  B.build = (it, ctx) => {
    const toks = tokenize(it.en);
    if (toks.length < 2) return null;
    return tiles({
      title: 'Переведите на английский', tokens: toks, extra: extraWords(it, ctx, toks, toks.length > 5 ? 1 : 2), target: toks.join(' '),
      sayAfter: it.en, fb: fbOf(it),
      prompt: h('div', { class: 'prompt' }, h('div', { class: 'ru-prompt' }, it.ru))
    });
  };

  B.listen_build = (it, ctx) => {
    const toks = tokenize(it.en);
    if (toks.length < 2) return null;
    return tiles({
      title: 'Соберите то, что услышали', tokens: toks, extra: extraWords(it, ctx, toks, toks.length > 5 ? 1 : 2), target: toks.join(' '),
      autoplay: it.en, fb: fbOf(it), prompt: h('div', { class: 'prompt' }, audioRow(it.en))
    });
  };

  B.gap = (it) => {
    if (!it.gap) return null;
    const before = it.en.slice(0, it.gapAt), after = it.en.slice(it.gapAt + it.gap.length);
    const blank = h('span', { class: 'blank' }, ' ');
    const opts = U.shuffle([it.gap].concat(it.alts));
    return choice({
      title: 'Вставьте пропущенное слово', sayAfter: it.en, fb: fbOf(it),
      prompt: h('div', { class: 'prompt' }, h('div', { class: 'gap-sent en' }, before, blank, after), h('div', { class: 'ru-hint' }, it.ru)),
      options: opts.map(o => ({ cls: 'word-opt en', label: o })), correct: opts.indexOf(it.gap),
      onSelect: i => { blank.textContent = opts[i]; },
      onCheck: ok => { blank.textContent = it.gap; blank.classList.add(ok ? 'filled-ok' : 'filled-bad'); }
    });
  };

  B.minimal = (it) => {
    const target = Math.random() < 0.5 ? it.a : it.b;
    const opts = [it.a, it.b];
    const ex = choice({
      title: 'Какое слово прозвучало?',
      prompt: h('div', { class: 'prompt' }, audioRow(target.en, { varied: true }), h('p', { class: 'muted small' }, 'Голоса меняются — так слух учится лучше.')),
      options: opts.map(o => ({ cls: 'word-opt en', label: [h('span', { class: 'pic', style: 'display:block;font-size:40px;margin-bottom:4px' }, o.pic), o.en] })),
      correct: opts.indexOf(target), fb: { en: target.en, ru: target.ru, note: it.note }
    });
    ex.autoplay = target.en;
    ex.autoplayOpt = { varied: true };
    ex.afterWrong = () => Sp.speak(it.a.en, { slow: true }).then(() => Sp.speak(it.b.en, { slow: true }));
    return ex;
  };

  B.speak = (it, ctx) => {
    if (!Sp.canListen() || ctx.noSpeak) return null;
    const thr = /\s/.test(it.en.trim()) ? 0.72 : 0.6;
    let tries = 0;
    return {
      title: 'Скажите вслух', auto: true, autoplay: it.en,
      view(a) {
        let finished = false;
        const api = { done: r => { if (finished) return; finished = true; mic.disabled = true; skip.disabled = true; a.done(r); } };
        const heard = h('div', { class: 'heard' }, 'Нажмите на микрофон и скажите фразу');
        const mic = h('button', { class: 'mic', type: 'button', 'aria-label': 'Говорить', html: U.icon('mic') });
        mic.onclick = async () => {
          if (finished) return;
          if (mic.classList.contains('listening')) { Sp.stopListening(); return; }
          Sp.stop();
          mic.classList.add('listening');
          heard.textContent = 'Слушаю…';
          const r = await Sp.listen();
          mic.classList.remove('listening');
          if (Sp.micBlocked) {
            heard.textContent = 'Нет доступа к микрофону. Упражнения на произношение отключены — включить можно в профиле.';
            ctx.noSpeak = true;
            setTimeout(() => api.done({ skip: true }), 1800);
            return;
          }
          if (r.error && r.error !== 'no-speech' && r.error !== 'timeout' && r.error !== 'aborted') {
            heard.textContent = r.error === 'network' ? 'Для распознавания речи нужен интернет.' : 'Не получилось включить микрофон. Попробуйте ещё раз.';
            return;
          }
          tries++;
          const best = Sp.bestMatch(it.en, r.alts || []);
          if (best.score >= thr) {
            heard.textContent = '«' + best.text + '»';
            api.done({ ok: true, spoken: true });
          } else if (tries >= 3) {
            api.done({ skip: true, msg: 'Ничего страшного: распознавание речи не идеально. Главное — вы говорили вслух.' });
          } else {
            heard.textContent = r.alts && r.alts[0] ? 'Я услышал: «' + r.alts[0] + '». Попробуйте ещё раз!' : 'Ничего не услышал. Говорите чуть громче.';
          }
        };
        const skip = h('button', {
          class: 'btn ghost sm', type: 'button',
          onclick: () => { Sp.stopListening(); Sp.pauseMic(15); api.done({ skip: true, msg: 'Хорошо, 15 минут без микрофона.' }); }
        }, 'Не могу говорить сейчас');
        return h('div', { class: 'ex' },
          h('div', { class: 'prompt' }, wordNode(it.en), h('div', { class: 'ru-hint' }, it.ru), audioRow(it.en)),
          h('div', { class: 'mic-wrap' }, mic, heard), skip);
      }
    };
  };

  // ----- letters -----
  function altWord(L, ctx) {
    if (!L.re || Math.random() < 0.5) return null;
    const re = new RegExp(L.re);
    const ws = ctx.knownIds.map(id => C.items[id]).filter(x => x && x.kind === 'word' && x.read && re.test(x.en.toLowerCase()));
    return ws.length ? U.pick(ws) : null;
  }

  B.letter_pic = (L, ctx) => {
    const ds = distract(L, ctx, 3, x => x.kind === 'letter' && x.single === L.single && soundOf(x) !== soundOf(L), x => x.pic);
    if (ds.length < 2) return null;
    const all = U.shuffle([L, ...ds]);
    const title = L.pos === 'start' ? (L.single ? 'Какое слово начинается с этой буквы?' : 'Какое слово начинается с этих букв?') : 'В каком слове есть этот звук?';
    return choice({
      title, prompt: h('div', { class: 'prompt' }, h('div', { class: 'bigletter en', style: L.ch.length > 3 ? 'font-size:56px' : '' }, L.ch),
        h('p', { class: 'muted small' }, 'Нажимайте на картинки, чтобы услышать слово')),
      options: all.map(x => ({ cls: 'pic-opt', label: x.pic, say: x.key })), correct: all.indexOf(L), fb: { en: L.key, ru: L.keyRu }, sayAfter: L.key
    });
  };

  B.letter_listen = (L, ctx) => {
    const alt = altWord(L, ctx);
    const word = alt ? alt.en : L.key;
    const ds = distract(L, ctx, 3, x => x.kind === 'letter' && x.single === L.single && soundOf(x) !== soundOf(L), x => x.ch);
    if (ds.length < 2) return null;
    const all = U.shuffle([L, ...ds]);
    const title = L.pos === 'start' ? 'С чего начинается это слово?' : 'Какие буквы дают звук в этом слове?';
    return choice({
      title, prompt: h('div', { class: 'prompt' }, audioRow(word)), autoplay: word,
      options: all.map(x => ({ cls: (x.ch.length > 3 ? 'word-opt' : 'letter-opt') + ' en', label: x.ch })), correct: all.indexOf(L),
      fb: { en: word, ru: alt ? alt.ru : L.keyRu }
    });
  };

  B.letter_case = (L) => {
    if (!L.single) return null;
    const conf = U.shuffle((LETTER_CONF[L.ch] || '').split(''));
    const rnd = U.shuffle('abcdefghijklmnopqrstuvwxyz'.split(''));
    const others = [...new Set(conf.concat(rnd))].filter(c => c !== L.ch).slice(0, 3);
    const all = U.shuffle([L.ch, ...others]);
    return choice({
      title: 'Найдите эту же букву, но маленькую', prompt: h('div', { class: 'prompt' }, h('div', { class: 'bigletter en' }, L.uc)),
      options: all.map(c => ({ cls: 'letter-opt en', label: c })), correct: all.indexOf(L.ch), fb: { en: L.uc + ' ' + L.ch, ru: '', say: X.nameSay(L.ch) }, sayAfter: X.nameSay(L.ch)
    });
  };

  B.twin_sound = (L) => {
    if (!L.twin) return null;
    const others = U.sample(['м', 'т', 'л', 'д', 'ш', 'з', 'ф', 'ц'].filter(x => x !== L.snd && x !== L.twin.wrong), 2);
    const all = U.shuffle([L.snd, L.twin.wrong, ...others]);
    const lower = L.twin.cyr === L.twin.cyr.toLowerCase();
    return choice({
      title: 'Как читается эта английская буква?',
      prompt: h('div', { class: 'prompt' }, h('div', { class: 'bigletter en' }, lower ? L.ch : L.uc), h('p', { class: 'muted small' }, 'Осторожно: похожа на русскую!')),
      options: all.map(s => ({ cls: 'sound-opt', label: '«' + s + '»' })), correct: all.indexOf(L.snd),
      fb: { en: L.key, ru: L.keyRu, note: L.twin.note }, sayAfter: L.key
    });
  };

  B.name_listen = (N) => {
    const conf = (NAME_CONF[N.uc] || '').split('');
    const rnd = U.shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
    const others = [...new Set(conf.concat(rnd))].filter(c => c !== N.uc).slice(0, 3);
    const all = U.shuffle([N.uc, ...others]);
    const say = X.nameSay(N.ch);
    return choice({
      title: 'Какую букву назвали?', prompt: h('div', { class: 'prompt' }, audioRow(say)), autoplay: say,
      options: all.map(c => ({ cls: 'letter-opt en', label: c })), correct: all.indexOf(N.uc), fb: { en: N.uc + ' ' + N.ch, ru: '', say }
    });
  };

  B.spell_listen = (it, ctx) => {
    const w = it.en.toLowerCase();
    if (it.kind !== 'word' || !/^[a-z]{2,6}$/.test(w)) return null;
    const say = w.split('').map(X.nameSay).join(' ');
    const cands = spellingOptions(it, ctx, 3);
    if (cands.length < 2) return null;
    const all = U.shuffle([it.en, ...cands]);
    return choice({
      title: 'Слово продиктовали по буквам. Какое?', prompt: h('div', { class: 'prompt' }, audioRow(say)), autoplay: say,
      options: all.map(x => ({ cls: 'word-opt en', label: x })), correct: all.indexOf(it.en), fb: fbOf(it), sayAfter: it.en
    });
  };

  // Which exercise types fit an item at a given level (0 = just met, 2+ = should produce it)
  function menu(it, lvl, ctx) {
    const mic = Sp.canListen() && !ctx.noSpeak && Math.random() < 0.6;
    const k = it.kind;
    let m;
    if (k === 'letter') m = lvl <= 0 ? ['letter_pic', 'letter_listen'] : ['letter_listen', 'letter_pic', it.twin && 'twin_sound', it.single && 'letter_case'];
    else if (k === 'name') m = ['name_listen'];
    else if (k === 'pair') m = ['minimal'];
    else if (k === 'word') {
      const pic = !!it.pic, short = /^[a-z]{2,7}$/i.test(it.en);
      if (lvl <= 0) m = pic ? (it.read ? ['read_pick_pic', 'listen_pick_pic'] : ['listen_pick_pic', 'read_pick_meaning']) : ['listen_pick_word', 'read_pick_meaning'];
      else if (lvl === 1) m = pic ? (it.read ? ['read_pick_pic', 'listen_pick_word', 'pic_pick_word'] : ['pic_pick_word', 'listen_pick_pic', 'listen_pick_word']) : ['read_pick_meaning', 'listen_pick_word', 'ru_pick_en'];
      else m = [short && 'spell', 'listen_pick_word', pic ? 'pic_pick_word' : 'ru_pick_en', mic && 'speak'];
    } else if (k === 'sent') {
      if (lvl <= 0) m = ['read_pick_meaning', it.gap && 'gap'];
      else if (lvl === 1) m = [it.gap && 'gap', 'build', 'ru_pick_en'];
      else m = ['listen_build', 'build', it.gap && 'gap', mic && 'speak'];
    } else {
      if (lvl <= 0) m = ['listen_pick_meaning', 'read_pick_meaning'];
      else if (lvl === 1) m = ['ru_pick_en', 'build', 'listen_pick_meaning'];
      else m = ['listen_build', 'build', mic && 'speak'];
    }
    return m.filter(Boolean);
  }

  const FALLBACK = {
    letter: ['letter_pic', 'letter_listen', 'letter_case'], name: ['name_listen'], pair: ['minimal'],
    word: ['read_pick_meaning', 'listen_pick_word', 'listen_pick_pic'], phrase: ['read_pick_meaning', 'listen_pick_meaning'], sent: ['read_pick_meaning', 'build']
  };

  X.make = function (entry, ctx) {
    const it = C.items[entry.id];
    if (!it) return null;
    const types = entry.mode ? [entry.mode] : U.shuffle(menu(it, entry.lvl, ctx));
    types.sort((a, b) => (a === ctx.lastType) - (b === ctx.lastType));
    for (const t of types.concat(FALLBACK[it.kind] || [])) {
      const ex = B[t] && B[t](it, ctx);
      if (ex) {
        ex.type = t;
        ex.item = it;
        ctx.lastType = t;
        return ex;
      }
    }
    return null;
  };

  // ---------- match pairs ----------
  X.makeMatch = function (ids) {
    const picked = [], used = new Set();
    U.shuffle(ids.map(id => C.items[id]).filter(it => it && it.kind === 'word' && it.pic)).forEach(it => {
      if (picked.length >= 5 || used.has(it.pic) || used.has(it.en.toLowerCase())) return;
      used.add(it.pic);
      used.add(it.en.toLowerCase());
      picked.push(it);
    });
    if (picked.length < 3) return null;
    let errors = 0, done = 0, selL = -1, selR = -1, api;
    const left = U.shuffle(picked), right = U.shuffle(picked);
    const lb = left.map(it => h('button', { class: 'mitem en', type: 'button' }, it.en));
    const rb = right.map(it => h('button', { class: 'mitem pic-m', type: 'button' }, it.pic));
    function tryPair() {
      if (selL < 0 || selR < 0) return;
      const L = lb[selL], R = rb[selR];
      if (left[selL] === right[selR]) {
        [L, R].forEach(b => { b.classList.remove('sel'); b.classList.add('done'); b.disabled = true; });
        done++;
        U.sfx('ok');
        if (done === picked.length) setTimeout(() => api.done({ ok: errors <= 1, match: true }), 350);
      } else {
        errors++;
        [L, R].forEach(b => { b.classList.remove('sel'); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 450); });
        U.sfx('bad');
        U.vibrate(30);
      }
      selL = selR = -1;
    }
    lb.forEach((b, i) => { b.onclick = () => { selL = i; lb.forEach((x, j) => x.classList.toggle('sel', j === i)); Sp.speak(left[i].en); tryPair(); }; });
    rb.forEach((b, i) => { b.onclick = () => { selR = i; rb.forEach((x, j) => x.classList.toggle('sel', j === i)); tryPair(); }; });
    return {
      title: 'Найдите пары', auto: true, type: 'match',
      view(a) { api = a; return h('div', { class: 'ex' }, h('div', { class: 'match' }, h('div', { class: 'match-col' }, lb), h('div', { class: 'match-col' }, rb))); }
    };
  };

  // ---------- intro cards ----------
  function segments(word) {
    const w = word.toLowerCase(), out = [];
    let i = 0;
    while (i < w.length) {
      const g = GRAPHEMES.find(x => w.startsWith(x, i));
      const len = g ? g.length : 1;
      out.push(word.slice(i, i + len));
      i += len;
    }
    return out;
  }
  function blend(el, word) {
    const spans = Array.from(el.children);
    let i = 0;
    (function step() {
      spans.forEach((s, j) => s.classList.toggle('on', j === i));
      i++;
      if (i <= spans.length) setTimeout(step, 280);
      else Sp.speak(word);
    })();
  }
  function highlightKey(L) {
    const k = L.key;
    const m = L.re ? k.toLowerCase().match(new RegExp(L.re)) : null;
    if (!m) return [k];
    return [k.slice(0, m.index), h('b', {}, k.slice(m.index, m.index + m[0].length)), k.slice(m.index + m[0].length)];
  }

  const KIND_LABEL = { word: 'Новое слово', phrase: 'Новая фраза', sent: 'Новое предложение' };

  X.intro = function (it) {
    if (it.kind === 'letter') {
      const L = it;
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, L.single ? 'Новая буква' : 'Новое сочетание букв'),
        L.single ? h('div', { class: 'bigletter en' }, L.uc, h('small', {}, L.ch)) : h('div', { class: 'bigletter en', style: L.ch.length > 3 ? 'font-size:56px' : '' }, L.ch),
        h('div', { class: 'key-row' },
          h('div', { class: 'pic' }, L.pic),
          h('div', { class: 'grow', style: 'text-align:left' }, h('div', { class: 'en' }, highlightKey(L)), h('div', { class: 'muted small' }, L.keyRu)),
          auBtn(L.key, { cls: 'sm' }), slowBtn(L.key)),
        h('div', { class: 'intro-hint', html: L.hint }),
        L.twin ? h('div', { class: 'twin-warn', html: '<b>Буква-обманщик.</b> ' + L.twin.note }) : null,
        L.single ? h('button', { class: 'btn sm', type: 'button', onclick: () => Sp.speak(X.nameSay(L.ch)) }, 'Как называется буква') : null);
      return { node, play: () => Sp.speak(L.key) };
    }
    if (it.kind === 'name') {
      const L = A.DATA.letters[it.letterId];
      const say = X.nameSay(it.ch);
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, 'Название буквы'),
        h('div', { class: 'bigletter en' }, it.uc, h('small', {}, it.ch)),
        audioRow(say),
        L ? h('div', { class: 'intro-hint' }, 'Так букву называют, когда диктуют по буквам. А звук у неё — как в слове ', h('b', { class: 'en' }, L.key), ' ', L.pic) : null);
      return { node, play: () => Sp.speak(say) };
    }
    if (it.kind === 'pair') {
      const card = o => h('button', { class: 'pair-card', type: 'button', onclick: () => Sp.speak(o.en) },
        h('div', { class: 'pic' }, o.pic), h('div', { class: 'en' }, o.en), h('div', { class: 'ru' }, o.ru));
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, 'Тренируем слух'),
        h('h2', { class: 'h2' }, 'Похожие, но разные слова'),
        h('div', { class: 'pair-cards' }, card(it.a), card(it.b)),
        h('div', { class: 'intro-hint', html: it.note }),
        h('p', { class: 'muted small' }, 'Нажимайте на карточки по очереди и слушайте разницу.'));
      return { node, play: () => Sp.speak(it.a.en, { slow: true }).then(() => Sp.speak(it.b.en, { slow: true })) };
    }
    const isRead = it.kind === 'word' && it.read;
    const enEl = h('div', { class: 'intro-en en' + sizeCls(it.en) + (isRead ? ' blend' : ''), role: 'button', tabindex: '0' });
    if (isRead) segments(it.en).forEach(s => enEl.appendChild(h('span', {}, s)));
    else enEl.textContent = it.en;
    const say = () => (isRead ? blend(enEl, it.en) : Sp.speak(it.en));
    enEl.onclick = say;
    const node = h('div', { class: 'intro' },
      h('div', { class: 'label kind' }, KIND_LABEL[it.kind] || ''),
      it.pic ? picNode(it.pic) : null,
      enEl,
      h('div', { class: 'intro-ru' }, it.ru),
      audioRow(it.en),
      isRead ? h('p', { class: 'muted small' }, 'Посмотрите, как звуки букв сливаются в слово. Нажмите на слово, чтобы повторить.') : null,
      it.kind === 'sent' && it.gap ? h('div', { class: 'intro-hint' }, 'Главное слово здесь — ', h('b', { class: 'en' }, it.gap)) : null);
    return { node, play: say };
  };

  X.tips = function (unit) {
    const lc = C.LINES[unit.line].color;
    return h('div', { class: 'tip-list' }, unit.tips.map(t => h('div', { class: 'tip', style: '--lc:' + lc },
      h('h4', {}, t.t), h('p', { html: t.x }),
      t.ex ? h('div', { class: 'chips' }, t.ex.map(e => h('button', { class: 'chip en', type: 'button', onclick: () => Sp.speak(e) }, e))) : null)));
  };
})(window.A);

</script>
<script>
'use strict';
// Lesson / review session runner.
// Order inside a lesson: meet each new item and check it right away (easy task), then mixed practice
// with older items (interleaving + spaced retrieval), then harder production tasks.
// Wrong answers come back 2–3 tasks later, so every session ends on a correct retrieval.
(function (A) {
  const U = A.U, h = U.h, C = A.Course, X = A.Ex, Sp = A.Speech, St = A.Store;
  const L = A.Lesson = {};
  const MAX_TASKS = 18;
  const PRAISE = ['Верно!', 'Отлично!', 'Так держать!', 'Супер!', 'Правильно!', 'Здорово!'];
  let S = null;
  let el = {};

  L.active = () => !!S && !S.finished;

  function makeCtx(unitIndex, extra) {
    const known = new Set(Object.keys(St.state.items).filter(id => C.items[id]));
    (extra || []).forEach(id => known.add(id));
    return { known, knownIds: Array.from(known), unitIndex, lastType: null, noSpeak: false };
  }

  // Learned items, most forgotten first (due ones before the rest)
  function weakest(excl, n) {
    const now = Date.now(), today = U.dayKey();
    return Object.keys(St.state.items)
      .filter(id => C.items[id] && !excl.has(id))
      .map(id => ({ id, r: A.SRS.retr(St.state.items[id], now), due: A.SRS.isDue(St.state.items[id], today) ? 1 : 0 }))
      .sort((a, b) => (b.due - a.due) || (a.r - b.r))
      .slice(0, n).map(x => x.id);
  }

  // Shuffle while avoiding the same item twice in a row
  function spread(list) {
    const out = [], pool = U.shuffle(list);
    while (pool.length) {
      const last = out[out.length - 1];
      let i = pool.findIndex(e => !last || e.id !== last.id);
      if (i < 0) i = 0;
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  function lessonQueue(lesson) {
    const q = [];
    const news = lesson.newIds, refs = lesson.refIds;
    if (lesson.idx === 0 && lesson.unit.tips && !St.state.lessons[lesson.key]) q.push({ t: 'tips' });

    if (lesson.mode) {
      const items = refs.concat(news);
      const twice = items.concat(U.sample(items, Math.min(items.length, 4)));
      return q.concat(spread(twice.map(id => ({ t: 'ex', id, lvl: 1, mode: lesson.mode }))));
    }

    if (lesson.review) {
      const ex = refs.map(id => ({ t: 'ex', id, lvl: 1 + (Math.random() < 0.5 ? 1 : 0) }));
      refs.filter(id => C.items[id].kind === 'pair').forEach(id => ex.push({ t: 'ex', id, lvl: 2 }));
      const list = spread(ex).slice(0, 15);
      list.splice(Math.min(list.length, 6), 0, { t: 'match', ids: refs });
      return q.concat(list);
    }

    const p1 = [], p2 = [], p3 = [];
    news.forEach(id => {
      p1.push({ t: 'intro', id });
      p1.push({ t: 'ex', id, lvl: 0 });
      if (C.items[id].kind === 'pair') p1.push({ t: 'ex', id, lvl: 1 });
    });
    news.forEach(id => { if (C.items[id].kind !== 'pair') p2.push({ t: 'ex', id, lvl: 1 }); });
    refs.forEach(id => p2.push({ t: 'ex', id, lvl: 1 }));
    news.forEach(id => { const k = C.items[id].kind; if (k !== 'pair' && k !== 'name') p3.push({ t: 'ex', id, lvl: 2 }); });

    const count = () => p1.filter(e => e.t === 'ex').length + p2.length + p3.length;
    const review = weakest(new Set(news.concat(refs)), 3);
    review.forEach(id => { if (count() < MAX_TASKS - 1) p2.push({ t: 'ex', id, lvl: 2 }); });
    while (count() > MAX_TASKS && p3.length > 2) p3.splice(Math.floor(Math.random() * p3.length), 1);
    while (count() > MAX_TASKS && p2.length > news.length) p2.pop();

    q.push(...p1, ...spread(p2));
    if (news.some(id => C.items[id].kind === 'word' && C.items[id].pic)) {
      q.push({ t: 'match', ids: news.concat(refs, U.sample(Object.keys(St.state.items), 8)) });
    }
    q.push(...spread(p3));
    return q;
  }

  function reviewQueue() {
    const now = Date.now();
    let ids = A.Progress.dueIds()
      .sort((a, b) => A.SRS.retr(St.state.items[a], now) - A.SRS.retr(St.state.items[b], now))
      .slice(0, 12);
    let practice = false;
    if (!ids.length) { ids = weakest(new Set(), 10); practice = true; }
    const q = spread(ids.map(id => ({ t: 'ex', id, lvl: Math.min(3, Math.max(1, St.state.items[id].reps)) })));
    if (q.length >= 5) q.splice(3, 0, { t: 'match', ids });
    return { q, practice };
  }

  // ---------- public ----------
  L.startLesson = function (lesson) {
    if (lesson.story) { A.Story.start(lesson); return; }
    begin({ kind: 'lesson', lesson, queue: lessonQueue(lesson), unitIndex: lesson.unit.index, extraKnown: lesson.newIds.concat(lesson.refIds) });
  };
  L.startReview = function () {
    const r = reviewQueue();
    if (!r.q.length) { U.toast('Повторять пока нечего — сначала пройдите урок'); return; }
    const nl = C.nextLesson();
    begin({ kind: 'review', practice: r.practice, queue: r.q, unitIndex: nl ? nl.unit.index : 999 });
  };
  L.askExit = async function () {
    if (!L.active()) { A.App.exitFocus(); return; }
    const ok = await U.confirm({ title: 'Выйти из урока?', text: 'Прогресс этого урока не сохранится.', ok: 'Выйти', cancel: 'Продолжить урок', danger: true });
    if (ok) { Sp.stop(); S = null; A.App.exitFocus(); }
  };

  // Shared lesson shell (also used by stories)
  L.shell = function (onClose) {
    el = {};
    el.progress = h('i');
    el.combo = h('div', { class: 'combo', 'aria-live': 'polite' });
    el.body = h('div', { class: 'lesson-body' });
    el.fb = h('div', { class: 'feedback', hidden: true });
    el.cta = h('button', { class: 'btn primary block', type: 'button' }, 'Проверить');
    el.foot = h('div', { class: 'lesson-foot' }, el.fb, el.cta);
    const close = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Выйти', html: U.icon('close'), onclick: onClose || L.askExit });
    U.$('#main').replaceChildren(h('div', { class: 'lesson' },
      h('div', { class: 'lesson-top' }, close, h('div', { class: 'progress', role: 'progressbar' }, el.progress), el.combo),
      el.body, el.foot));
    U.$('#main').scrollTop = 0;
    return el;
  };

  function begin(o) {
    Sp.stop();
    S = Object.assign(o, { pos: 0, results: {}, retries: {}, answered: 0, correct: 0, xp: 0, combo: 0, errRun: 0, t0: Date.now(), introduced: [], phase: 'idle' });
    S.ctx = makeCtx(o.unitIndex, o.extraKnown);
    A.App.enterFocus();
    L.shell();
    show();
  }

  function adjust(e) {
    const r = S.results[e.id];
    let lvl = e.lvl;
    if (r && r.err > r.ok) lvl -= 1;
    if (S.errRun >= 2) lvl = 0;
    return Object.assign({}, e, { lvl: Math.max(0, lvl) });
  }

  function show() {
    if (!S) return;
    let e = S.queue[S.pos];
    let ex = null;
    // skip entries that cannot produce a task (e.g. not enough distractors yet)
    while (e && (e.t === 'ex' || e.t === 'match')) {
      ex = e.t === 'match' ? X.makeMatch(e.ids, S.ctx) : X.make(adjust(e), S.ctx);
      if (ex) break;
      S.pos++;
      e = S.queue[S.pos];
    }
    el.progress.style.width = Math.round(S.pos / S.queue.length * 100) + '%';
    if (!e) { finish(); return; }

    el.body.replaceChildren();
    el.fb.hidden = true;
    el.foot.className = 'lesson-foot';
    el.cta.hidden = false;
    el.cta.disabled = false;
    U.$('#main').scrollTop = 0;
    S.phase = 'idle';
    S.ex = null;

    if (e.t === 'tips') {
      el.body.append(h('div', { class: 'ex-title' }, 'Перед уроком'), X.tips(S.lesson.unit));
      el.cta.textContent = 'Понятно, начнём';
      el.cta.onclick = next;
      return;
    }
    if (e.t === 'intro') {
      const card = X.intro(C.items[e.id]);
      el.body.append(card.node);
      el.cta.textContent = 'Дальше';
      el.cta.onclick = next;
      if (!S.introduced.includes(e.id)) S.introduced.push(e.id);
      setTimeout(() => { if (S && S.queue[S.pos] === e) card.play(); }, 350);
      return;
    }

    S.ex = ex;
    const api = {
      ready: b => { if (S && S.ex === ex && S.phase === 'idle') el.cta.disabled = !b; },
      done: r => result(e, ex, r)
    };
    el.body.append(h('div', { class: 'ex-title' }, ex.title), ex.view(api));
    if (ex.auto) {
      el.cta.hidden = true;
    } else {
      el.cta.textContent = 'Проверить';
      el.cta.disabled = true;
      el.cta.onclick = () => { if (S && S.phase === 'idle') result(e, ex, ex.check()); };
    }
    if (ex.autoplay) {
      setTimeout(() => {
        if (!S || S.ex !== ex || S.phase !== 'idle') return;
        const varied = ex.autoplayOpt && ex.autoplayOpt.varied;
        (varied ? Sp.speakVaried : Sp.speak)(ex.autoplay, ex.autoplayOpt);
      }, 320);
    }
  }

  function requeue(e) {
    const n = S.retries[e.id] || 0;
    if (n >= 2) return;
    S.retries[e.id] = n + 1;
    const at = Math.min(S.queue.length, S.pos + 3 + Math.floor(Math.random() * 2));
    S.queue.splice(at, 0, { t: 'ex', id: e.id, lvl: Math.max(0, (e.lvl || 1) - 1), mode: e.mode, retry: true });
  }

  function result(e, ex, r) {
    if (!S || S.phase !== 'idle' || S.ex !== ex) return;
    S.phase = 'answered';
    el.cta.hidden = false;
    el.cta.disabled = false;
    if (r.skip) {
      showFb('neutral', r.msg || 'Пропускаем это задание', null);
    } else {
      S.answered++;
      if (e.t === 'ex') {
        const res = S.results[e.id] || (S.results[e.id] = { ok: 0, err: 0 });
        if (r.ok) res.ok++; else res.err++;
      }
      if (r.spoken) St.state.stats.spoken++;
      if (r.ok) {
        S.correct++;
        S.xp++;
        S.combo++;
        S.errRun = 0;
        U.sfx('ok');
        U.vibrate(12);
        showFb('good', U.pick(PRAISE), ex);
        if (ex.sayAfter) Sp.speak(ex.sayAfter);
      } else {
        S.combo = 0;
        S.errRun++;
        U.sfx('bad');
        U.vibrate([30, 40, 30]);

        const say = (ex.fb && (ex.fb.say || ex.fb.en)) || ex.sayAfter;
        setTimeout(() => { if (S && S.ex === ex) { if (ex.afterWrong) ex.afterWrong(); else if (say) Sp.speak(say); } }, 450);
        if (e.t === 'ex') requeue(e);

    }

  function showFb(kind, title, ex) {
    el.foot.className = 'lesson-foot ' + kind;

    } else if (fb && kind === 'good' && fb.en && fb.ru) {
      body.append(h('span', { class: 'en', style: 'font-size:17px' }, fb.en), ' — ' + fb.ru);
    }
    const replay = fb && fb.en ? X.auBtn(fb.say || fb.en, { cls: 'xs fb-replay' }) : null;
    U.fill(el.fb,
      h('div', { class: 'fb-ico', html: U.icon(kind === 'good' ? 'check' : kind === 'bad' ? 'x' : 'info') }),
      h('div', { class: 'grow' }, h('div', { class: 'fb-title' }, title), body),
      replay);
    el.fb.hidden = false;
  }

  function next() {
    if (!S) return;
    Sp.stop();
    S.pos++;
    show();
  }

  function finish() {
    const stt = St.state;
    const secs = (Date.now() - S.t0) / 1000;
    let fresh = 0;
    Object.keys(S.results).forEach(id => {
      const r = S.results[id];
      const g = r.err === 0 ? 3 : (r.err === 1 && r.ok > 0) ? 2 : 1;
      if (!stt.items[id]) fresh++;
      stt.items[id] = A.SRS.review(stt.items[id], g);
    });
    S.introduced.forEach(id => { if (!stt.items[id]) { stt.items[id] = A.SRS.review(null, 3); fresh++; } });
    const acc = S.answered ? Math.round(S.correct / S.answered * 100) : 100;
    const perfect = S.answered >= 4 && S.correct === S.answered;
    const xp = S.xp + (S.kind === 'lesson' ? 5 : 3) + (perfect ? 5 : 0);
    stt.stats.answered += S.answered;
    stt.stats.correct += S.correct;
    if (perfect) stt.stats.perfect++;
    if (S.kind === 'review') stt.stats.reviews++;
    let unitDone = false;
    if (S.kind === 'lesson') {
      const was = C.unitComplete(S.lesson.unit);
      stt.lessons[S.lesson.key] = { at: Date.now(), acc };
      unitDone = !was && C.unitComplete(S.lesson.unit);
    }
    const ev = A.Progress.addXP(xp, secs);
    const badges = A.Progress.checkBadges();
    St.save();
    S.finished = true;
    L.finishView({
      label: S.kind === 'review' ? (S.practice ? 'Тренировка' : 'Повторение') : S.lesson.unit.title + ' · ' + S.lesson.title,

  const fmtTime = s => { const m = Math.floor(s / 60), r = Math.round(s % 60); return m + ':' + String(r).padStart(2, '0'); };
  const stat = (b, s) => h('div', { class: 'stat' }, h('b', {}, String(b)), h('span', {}, s));

    const si = A.Progress.streakInfo();
    const title = o.perfect ? 'Без единой ошибки!' : o.acc >= 85 ? 'Отличный урок!' : o.acc >= 60 ? 'Урок пройден!' : 'Готово! Ошибки — часть обучения';
    const notes = [];
    if (o.unitDone) notes.push('Станция пройдена — следующая открыта.');
    if (o.ev && o.ev.goalDone) notes.push('Дневная цель выполнена!');
    if (o.ev && o.ev.newFreeze) notes.push('Вы получили заморозку серии: если пропустите день, серия не сгорит.');
    if (o.ev && o.ev.usedFreeze) notes.push('Заморозка сохранила вашу серию.');
    if (o.review) notes.push('Повторённые слова вернутся позже — как раз тогда, когда начнут забываться.');
    else if (o.acc < 70) notes.push('Трудные слова вернутся в повторении. Так мозг запоминает надёжнее.');
    el.body.replaceChildren(h('div', { class: 'finish' },
      h('div', { class: 'label' }, o.label),
      h('h1', { class: 'h1' }, title),
      h('div', { class: 'big-xp' }, '+' + o.xp + ' XP'),
      h('div', { class: 'stat-row' }, stat(o.acc + '%', 'точность'), stat(fmtTime(o.secs), 'время'), stat(o.fresh, U.plural(o.fresh, ['новое', 'новых', 'новых']))),
      h('div', { class: 'card flat stack', style: 'align-self:stretch;text-align:left' },
        h('div', { class: 'row' }, h('span', { style: 'color:var(--read)', html: U.icon('flame') }),
          h('b', {}, si.n + ' ' + U.plural(si.n, ['день', 'дня', 'дней']) + ' подряд')),
        h('div', { class: 'row' }, h('div', { class: 'progress grow' }, h('i', { style: 'width:' + Math.min(100, Math.round(today / goal * 100)) + '%' })),
          h('span', { class: 'small muted' }, Math.min(today, goal) + ' / ' + goal + ' XP'))),
      notes.length ? h('div', { class: 'stack', style: 'align-self:stretch;text-align:left' }, notes.map(n => h('p', { class: 'notice' }, n))) : null,
      o.badges && o.badges.length ? h('div', { class: 'stack' }, h('div', { class: 'label' }, 'Новые награды'),
        h('div', { class: 'new-badges' }, o.badges.map(b => h('div', { class: 'badge got' }, h('div', { class: 'medal' }, b.mark), h('div', { class: 'bt' }, b.t))))) : null));
    el.fb.hidden = true;
    el.foot.className = 'lesson-foot';
    el.combo.textContent = '';
    el.cta.hidden = false;
    el.cta.disabled = false;
    el.cta.textContent = 'Продолжить';
    el.cta.onclick = () => A.App.exitFocus();
    U.$('#main').scrollTop = 0;
