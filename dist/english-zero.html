          mic.classList.add('listening');
          status.textContent = 'Говорите… (нажмите ещё раз, чтобы закончить)';
          const r = await Sp.record(seconds * 1000);
          mic.classList.remove('listening');
          if (r.error) {
            if (Sp.recBlocked) {
              ctx.noRecord = true;
              status.textContent = 'Нет доступа к микрофону — это задание пропускаем.';
              setTimeout(() => done({ skip: true }), 1500);
            } else status.textContent = 'Не получилось записать. Попробуйте ещё раз.';
            return;
          }
          url = r.url;
          compare.hidden = false;
          verdict.hidden = false;
          playBoth();
        };
        const skip = h('button', {
          class: 'btn ghost sm', type: 'button',
          onclick: () => { Sp.stopRecording(); Sp.pauseMic(15); done({ skip: true, msg: 'Хорошо, 15 минут без микрофона.' }); }
        }, 'Не могу говорить сейчас');
        return h('div', { class: 'ex' },
          h('div', { class: 'prompt' }, wordNode(it.en), h('div', { class: 'ru-hint' }, it.ru), audioRow(it.en)),
          h('div', { class: 'mic-wrap' }, mic, status, compare, verdict), skip);
      }
    };
  };

  // ----- letters -----
  // Another word with the same sound, but only one the learner has already been shown
  function altWord(L, ctx) {
    if (!L.re || !ctx.learned || Math.random() < 0.5) return null;
    const re = new RegExp(L.re);
    const ws = Array.from(ctx.learned).map(id => C.items[id]).filter(x => x && x.kind === 'word' && x.read && re.test(x.en.toLowerCase()));
    return ws.length ? U.pick(ws) : null;
  }

  B.letter_pic = (L, ctx) => {
    const ds = distract(L, ctx, 3, x => x.kind === 'letter' && x.single === L.single && soundOf(x) !== soundOf(L), x => x.pic);
    if (ds.length < 2) return null;
    const all = U.shuffle([L, ...ds]);
    const title = L.pos === 'start' ? (L.single ? 'Какое слово начинается с этой буквы?' : 'Какое слово начинается с этих букв?') : 'В каком слове есть этот звук?';
    return choice({
      title, prompt: h('div', { class: 'prompt' }, h('div', { class: 'bigletter en', style: L.ch.length > 3 ? 'font-size:56px' : '' }, L.ch),
        h('p', { class: 'muted small' }, 'Нажимайте на картинки, чтобы услышать слово')),
      options: all.map(x => ({ cls: 'pic-opt', label: x.pic, say: x.key, why: 'Это «<span class="en">' + esc(x.key) + '</span>» (' + esc(x.keyRu) + ') — здесь звук «' + esc(x.ch) + '».' })),
      correct: all.indexOf(L), fb: { en: L.key, ru: L.keyRu }, sayAfter: L.key
    });
  };

  B.letter_listen = (L, ctx) => {
    const alt = altWord(L, ctx);
    const word = alt ? alt.en : L.key;
    const ds = distract(L, ctx, 3, x => x.kind === 'letter' && x.single === L.single && soundOf(x) !== soundOf(L), x => x.ch);
    if (ds.length < 2) return null;
    const all = U.shuffle([L, ...ds]);
    const title = L.pos === 'start' ? 'С чего начинается это слово?' : 'Какие буквы дают звук в этом слове?';
    return choice({
      title, prompt: h('div', { class: 'prompt' }, audioRow(word)), autoplay: word, listen: true,
      options: all.map(x => ({ cls: (x.ch.length > 3 ? 'word-opt' : 'letter-opt') + ' en', label: x.ch, why: '«' + esc(x.ch) + '» звучит как в слове «<span class="en">' + esc(x.key) + '</span>».' })),
      correct: all.indexOf(L), fb: { en: word, ru: alt ? alt.ru : L.keyRu }
    });
  };

  B.letter_case = (L) => {
    if (!L.single) return null;
    const conf = U.shuffle((LETTER_CONF[L.ch] || '').split(''));
    const rnd = U.shuffle('abcdefghijklmnopqrstuvwxyz'.split(''));
    const others = [...new Set(conf.concat(rnd))].filter(c => c !== L.ch).slice(0, 3);
    const all = U.shuffle([L.ch, ...others]);
    return choice({
      title: 'Найдите эту же букву, но маленькую', prompt: h('div', { class: 'prompt' }, h('div', { class: 'bigletter en' }, L.uc)),
      options: all.map(c => ({ cls: 'letter-opt en', label: c, why: '«' + c + '» — это маленькая ' + c.toUpperCase() + '.' })),
      correct: all.indexOf(L.ch), fb: { en: L.uc + ' ' + L.ch, ru: '', say: X.nameSay(L.ch) }, sayAfter: X.nameSay(L.ch)
    });
  };

  B.twin_sound = (L) => {
    if (!L.twin) return null;
    const others = U.sample(['м', 'т', 'л', 'д', 'ш', 'з', 'ф', 'ц'].filter(x => x !== L.snd && x !== L.twin.wrong), 2);
    const all = U.shuffle([L.snd, L.twin.wrong, ...others]);
    const lower = L.twin.cyr === L.twin.cyr.toLowerCase();
    return choice({
      title: 'Как читается эта английская буква?',
      prompt: h('div', { class: 'prompt' }, h('div', { class: 'bigletter en' }, lower ? L.ch : L.uc), h('p', { class: 'muted small' }, 'Осторожно: похожа на русскую!')),
      options: all.map(s => ({ cls: 'sound-opt', label: '«' + s + '»' })), correct: all.indexOf(L.snd),
      fb: { en: L.key, ru: L.keyRu, note: L.twin.note }, sayAfter: L.key
    });
  };

  B.name_listen = (N) => {
    const conf = (NAME_CONF[N.uc] || '').split('');
    const rnd = U.shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
    const others = [...new Set(conf.concat(rnd))].filter(c => c !== N.uc).slice(0, 3);
    const all = U.shuffle([N.uc, ...others]);
    const say = X.nameSay(N.ch);
    return choice({
      title: 'Какую букву назвали?', prompt: h('div', { class: 'prompt' }, audioRow(say)), autoplay: say, listen: true,
      options: all.map(c => ({ cls: 'letter-opt en', label: c })), correct: all.indexOf(N.uc), fb: { en: N.uc + ' ' + N.ch, ru: '', say }
    });
  };

  B.spell_listen = (it, ctx) => {
    const w = it.en.toLowerCase();
    if (it.kind !== 'word' || !/^[a-z]{2,6}$/.test(w)) return null;
    const say = w.split('').map(X.nameSay).join(' ');
    const cands = spellingOptions(it, ctx, 3);
    if (cands.length < 2) return null;
    const all = U.shuffle([it.en, ...cands]);
    return choice({
      title: 'Слово продиктовали по буквам. Какое?', prompt: h('div', { class: 'prompt' }, audioRow(say)), autoplay: say, listen: true,
      options: all.map(x => ({ cls: 'word-opt en', label: x, why: wordWhy(it.en, x) })), correct: all.indexOf(it.en), fb: fbOf(it), sayAfter: it.en
    });
  };

  // Which exercise types fit an item at a given level (0 = just met, 2+ = should produce it)
  function menu(it, lvl, ctx) {
    const mic = Sp.canListen() && !ctx.noSpeak && Math.random() < 0.6;
    const rec = Sp.canRecord() && !ctx.noRecord && Math.random() < 0.5;
    const k = it.kind;
    let m;
    if (k === 'letter') m = lvl <= 0 ? ['letter_pic', 'letter_listen'] : ['letter_listen', 'letter_pic', it.twin && 'twin_sound', it.single && 'letter_case'];
    else if (k === 'name') m = ['name_listen'];
    else if (k === 'pair') m = ['minimal'];
    else if (k === 'word') {
      const pic = !!it.pic, short = /^[a-z]{2,7}$/i.test(it.en);
      if (lvl <= 0) m = pic ? (it.read ? ['read_pick_pic', 'listen_pick_pic'] : ['listen_pick_pic', 'read_pick_meaning']) : ['listen_pick_word', 'read_pick_meaning'];
      else if (lvl === 1) m = pic ? (it.read ? ['read_pick_pic', 'listen_pick_word', 'pic_pick_word'] : ['pic_pick_word', 'listen_pick_pic', 'listen_pick_word']) : ['read_pick_meaning', 'listen_pick_word', 'ru_pick_en'];
      else m = [short && 'spell', 'listen_pick_word', pic ? 'pic_pick_word' : 'ru_pick_en', mic && 'speak'];
    } else if (k === 'sent') {
      if (lvl <= 0) m = ['read_pick_meaning', it.gap && 'gap'];
      else if (lvl === 1) m = [it.gap && 'gap', 'build', 'ru_pick_en'];
      else m = ['listen_build', 'build', it.gap && 'gap', mic && 'speak', rec && 'shadow'];
    } else {
      if (lvl <= 0) m = ['listen_pick_meaning', 'read_pick_meaning'];
      else if (lvl === 1) m = ['ru_pick_en', 'build', 'listen_pick_meaning'];
      else m = ['listen_build', 'build', mic && 'speak', rec && 'shadow'];
    }
    return m.filter(Boolean);
  }

  const FALLBACK = {
    letter: ['letter_pic', 'letter_listen', 'letter_case'], name: ['name_listen'], pair: ['minimal'],
    word: ['read_pick_meaning', 'listen_pick_word', 'listen_pick_pic'], phrase: ['read_pick_meaning', 'listen_pick_meaning'], sent: ['read_pick_meaning', 'build', 'gap']
  };

  // A grammar pattern becomes a fresh sentence each time it is practised
  function variantOf(p) {
    return Object.assign({ id: p.id, kind: 'sent', pic: '', pat: p }, p.gen());
  }

  X.make = function (entry, ctx) {
    const base = C.items[entry.id];
    if (!base) return null;
    const it = base.kind === 'pat' ? variantOf(base) : base;
    let types = entry.mode ? [entry.mode] : U.shuffle(menu(it, entry.lvl, ctx));
    types.sort((a, b) => (a === ctx.lastType) - (b === ctx.lastType));
    types = types.concat(FALLBACK[it.kind] || []);
    if (Sp.muted()) types = types.filter(t => !AUDIO_TYPES.has(t));
    for (const t of types) {
      const ex = B[t] && B[t](it, ctx);
      if (ex) {
        ex.type = t;
        ex.item = base;
        ctx.lastType = t;
        return ex;
      }
    }
    return null;
  };
  X.audioOnly = it => !it || it.kind === 'name' || it.kind === 'pair';

  // ---------- match pairs ----------
  X.makeMatch = function (ids) {
    const picked = [], used = new Set();
    U.shuffle(ids.map(id => C.items[id]).filter(it => it && it.kind === 'word' && it.pic)).forEach(it => {
      if (picked.length >= 5 || used.has(it.pic) || used.has(it.en.toLowerCase())) return;
      used.add(it.pic);
      used.add(it.en.toLowerCase());
      picked.push(it);
    });
    if (picked.length < 3) return null;
    let errors = 0, done = 0, selL = -1, selR = -1, api;
    const left = U.shuffle(picked), right = U.shuffle(picked);
    const lb = left.map(it => h('button', { class: 'mitem en', type: 'button' }, it.en));
    const rb = right.map(it => h('button', { class: 'mitem pic-m', type: 'button' }, it.pic));
    function tryPair() {
      if (selL < 0 || selR < 0) return;
      const L = lb[selL], R = rb[selR];
      if (left[selL] === right[selR]) {
        [L, R].forEach(b => { b.classList.remove('sel'); b.classList.add('done'); b.disabled = true; });
        done++;
        U.sfx('ok');
        if (done === picked.length) setTimeout(() => api.done({ ok: errors <= 1, match: true }), 350);
      } else {
        errors++;
        [L, R].forEach(b => { b.classList.remove('sel'); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 450); });
        U.sfx('bad');
        U.vibrate(30);
      }
      selL = selR = -1;
    }
    lb.forEach((b, i) => { b.onclick = () => { selL = i; lb.forEach((x, j) => x.classList.toggle('sel', j === i)); Sp.speak(left[i].en); tryPair(); }; });
    rb.forEach((b, i) => { b.onclick = () => { selR = i; rb.forEach((x, j) => x.classList.toggle('sel', j === i)); tryPair(); }; });
    return {
      title: 'Найдите пары', auto: true, type: 'match',
      view(a) { api = a; return h('div', { class: 'ex' }, h('div', { class: 'match' }, h('div', { class: 'match-col' }, lb), h('div', { class: 'match-col' }, rb))); }
    };
  };

  // ---------- intro cards ----------
  function segments(word) {
    const w = word.toLowerCase(), out = [];
    let i = 0;
    while (i < w.length) {
      const g = GRAPHEMES.find(x => w.startsWith(x, i));
      const len = g ? g.length : 1;
      out.push(word.slice(i, i + len));
      i += len;
    }
    return out;
  }
  function blend(el, word) {
    const spans = Array.from(el.children);
    let i = 0;
    (function step() {
      if (!el.isConnected) return; // the learner has moved on: no late sound on the next screen
      spans.forEach((s, j) => s.classList.toggle('on', j === i));
      i++;
      if (i <= spans.length) setTimeout(step, 280);
      else Sp.speak(word);
    })();
  }
  function highlightKey(L) {
    const k = L.key;
    const m = L.re ? k.toLowerCase().match(new RegExp(L.re)) : null;
    if (!m) return [k];
    return [k.slice(0, m.index), h('b', {}, k.slice(m.index, m.index + m[0].length)), k.slice(m.index + m[0].length)];
  }

  const KIND_LABEL = { word: 'Новое слово', phrase: 'Новая фраза', sent: 'Новое предложение' };

  X.intro = function (it) {
    if (it.kind === 'letter') {
      const L = it;
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, L.single ? 'Новая буква' : 'Новое сочетание букв'),
        L.single ? h('div', { class: 'bigletter en' }, L.uc, h('small', {}, L.ch)) : h('div', { class: 'bigletter en', style: L.ch.length > 3 ? 'font-size:56px' : '' }, L.ch),
        h('div', { class: 'key-row' },
          h('div', { class: 'pic' }, L.pic),
          h('div', { class: 'grow', style: 'text-align:left' }, h('div', { class: 'en' }, highlightKey(L)), h('div', { class: 'muted small' }, L.keyRu)),
          auBtn(L.key, { cls: 'sm' }), slowBtn(L.key)),
        h('div', { class: 'intro-hint', html: L.hint }),
        L.twin ? h('div', { class: 'twin-warn', html: '<b>Буква-обманщик.</b> ' + L.twin.note }) : null,
        L.single ? h('button', { class: 'btn sm', type: 'button', onclick: () => Sp.speak(X.nameSay(L.ch)) }, 'Как называется буква') : null);
      return { node, play: () => Sp.speak(L.key) };
    }
    if (it.kind === 'name') {
      const L = A.DATA.letters[it.letterId];
      const say = X.nameSay(it.ch);
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, 'Название буквы'),
        h('div', { class: 'bigletter en' }, it.uc, h('small', {}, it.ch)),
        audioRow(say),
        L ? h('div', { class: 'intro-hint' }, 'Так букву называют, когда диктуют по буквам. А звук у неё — как в слове ', h('b', { class: 'en' }, L.key), ' ', L.pic) : null);
      return { node, play: () => Sp.speak(say) };
    }
    if (it.kind === 'pair') {
      const card = o => h('button', { class: 'pair-card', type: 'button', onclick: () => Sp.speak(o.en) },
        h('div', { class: 'pic' }, o.pic), h('div', { class: 'en' }, o.en), h('div', { class: 'ru' }, o.ru));
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, 'Тренируем слух'),
        h('h2', { class: 'h2' }, 'Похожие, но разные слова'),
        h('div', { class: 'pair-cards' }, card(it.a), card(it.b)),
        h('div', { class: 'intro-hint', html: it.note }),
        h('p', { class: 'muted small' }, 'Нажимайте на карточки по очереди и слушайте разницу.'));
      return { node, play: () => Sp.speakSeq([it.a.en, it.b.en], { slow: true }) };
    }
    if (it.kind === 'pat') {
      const ex = U.sample(it.variants, 3);
      const node = h('div', { class: 'intro' },
        h('div', { class: 'label kind' }, 'Правило'),
        h('div', { class: 'intro-en en md' }, it.en),
        h('div', { class: 'intro-ru' }, it.ru),
        h('div', { class: 'intro-hint', html: it.rule }),
        h('div', { class: 'stack', style: 'align-self:stretch' }, ex.map(v => h('div', { class: 'key-row' },
          h('div', { class: 'grow', style: 'text-align:left' }, h('div', { class: 'en', style: 'font-size:19px;font-weight:700' }, v.en), h('div', { class: 'muted small' }, v.ru)),
          auBtn(v.en, { cls: 'xs' })))),
        h('p', { class: 'muted small' }, 'Дальше правило будет каждый раз с новыми предложениями — так тренируется само правило, а не заученная фраза.'));
      return { node, play: () => Sp.speak(ex[0].en) };
    }
    const isRead = it.kind === 'word' && it.read;
    const enEl = h('div', { class: 'intro-en en' + sizeCls(it.en) + (isRead ? ' blend' : ''), role: 'button', tabindex: '0' });
    if (isRead) segments(it.en).forEach(s => enEl.appendChild(h('span', {}, s)));
    else enEl.textContent = it.en;
    const say = () => (isRead ? blend(enEl, it.en) : Sp.speak(it.en));
    enEl.onclick = say;
    const node = h('div', { class: 'intro' },
      h('div', { class: 'label kind' }, KIND_LABEL[it.kind] || ''),
      it.pic ? picNode(it.pic) : null,
      enEl,
      h('div', { class: 'intro-ru' }, it.ru),
      audioRow(it.en),
      isRead ? h('p', { class: 'muted small' }, 'Посмотрите, как звуки букв сливаются в слово. Нажмите на слово, чтобы повторить.') : null,
      it.kind === 'sent' && it.gap ? h('div', { class: 'intro-hint' }, 'Главное слово здесь — ', h('b', { class: 'en' }, it.gap),
        whyWord(it.gap) ? h('span', { html: '. ' + whyWord(it.gap) }) : null) : null);
    return { node, play: say };
  };

  X.tips = function (unit) {
    const lc = C.LINES[unit.line].color;
    return h('div', { class: 'tip-list' }, unit.tips.map(t => h('div', { class: 'tip', style: '--lc:' + lc },
      h('h4', {}, t.t), h('p', { html: t.x }),
      t.ex ? h('div', { class: 'chips' }, t.ex.map(e => h('button', { class: 'chip en', type: 'button', onclick: () => Sp.speak(e) }, e))) : null)));
  };
})(window.A);

</script>
<script>
'use strict';
// Lesson / review session runner.
// Order inside a lesson: meet each new item and check it right away (easy task), then mixed practice
// with older items (interleaving + spaced retrieval), then harder production tasks.
// Wrong answers come back 2–3 tasks later, so every session ends on a correct retrieval.
(function (A) {
  const U = A.U, h = U.h, C = A.Course, X = A.Ex, Sp = A.Speech, St = A.Store;
  const L = A.Lesson = {};
  const MAX_TASKS = 18;
  const PRAISE = ['Верно!', 'Отлично!', 'Так держать!', 'Супер!', 'Правильно!', 'Здорово!'];
  let S = null;
  let el = {};
  Sp.onMute(on => { if (el.mute) el.mute.hidden = !on; });

  L.active = () => !!S && !S.finished;

  // learned: items the learner has actually been shown (grows as new items are introduced in this lesson);
  // known: learned plus this lesson's items (used only as wrong options)
  function makeCtx(unitIndex, extra) {
    const learned = new Set(Object.keys(St.state.items).filter(id => C.items[id]));
    const known = new Set(learned);
    (extra || []).forEach(id => known.add(id));
    return { learned, known, knownIds: Array.from(known), unitIndex, lastType: null, noSpeak: false };
  }

  // Learned items, most forgotten first (due ones before the rest)
  function weakest(excl, n) {
    const now = Date.now(), today = U.dayKey();
    return Object.keys(St.state.items)
      .filter(id => C.items[id] && !excl.has(id))
      .map(id => ({ id, r: A.SRS.retr(St.state.items[id], now), due: A.SRS.isDue(St.state.items[id], today) ? 1 : 0 }))
      .sort((a, b) => (b.due - a.due) || (a.r - b.r))
      .slice(0, n).map(x => x.id);
  }

  // Shuffle while avoiding the same item twice in a row
  function spread(list) {
    const out = [], pool = U.shuffle(list);
    while (pool.length) {
      const last = out[out.length - 1];
      let i = pool.findIndex(e => !last || e.id !== last.id);
      if (i < 0) i = 0;
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  function lessonQueue(lesson) {
    const q = [];
    const news = lesson.newIds, refs = lesson.refIds;
    if (lesson.idx === 0 && lesson.unit.tips && !St.state.lessons[lesson.key]) q.push({ t: 'tips' });

    if (lesson.mode) {
      const items = refs.concat(news);
      const twice = items.concat(U.sample(items, Math.min(items.length, 4)));
      return q.concat(spread(twice.map(id => ({ t: 'ex', id, lvl: 1, mode: lesson.mode }))));
    }

    if (lesson.review) {
      const ex = refs.map(id => ({ t: 'ex', id, lvl: 1 + (Math.random() < 0.5 ? 1 : 0) }));
      refs.filter(id => C.items[id].kind === 'pair').forEach(id => ex.push({ t: 'ex', id, lvl: 2 }));
      const list = spread(ex).slice(0, 15);
      list.splice(Math.min(list.length, 6), 0, { t: 'match', ids: refs });
      return q.concat(list);
    }

    const p1 = [], p2 = [], p3 = [];
    news.forEach(id => {
      p1.push({ t: 'intro', id });
      p1.push({ t: 'ex', id, lvl: 0 });
      if (C.items[id].kind === 'pair') p1.push({ t: 'ex', id, lvl: 1 });
    });
    news.forEach(id => { if (C.items[id].kind !== 'pair') p2.push({ t: 'ex', id, lvl: 1 }); });
    refs.forEach(id => p2.push({ t: 'ex', id, lvl: 1 }));
    news.forEach(id => { const k = C.items[id].kind; if (k !== 'pair' && k !== 'name') p3.push({ t: 'ex', id, lvl: 2 }); });

    const count = () => p1.filter(e => e.t === 'ex').length + p2.length + p3.length;
    const review = weakest(new Set(news.concat(refs)), 3);
    review.forEach(id => { if (count() < MAX_TASKS - 1) p2.push({ t: 'ex', id, lvl: 2 }); });
    while (count() > MAX_TASKS && p3.length > 2) p3.splice(Math.floor(Math.random() * p3.length), 1);
    while (count() > MAX_TASKS && p2.length > news.length) p2.pop();

    q.push(...p1, ...spread(p2));
    if (news.some(id => C.items[id].kind === 'word' && C.items[id].pic)) {
      q.push({ t: 'match', ids: news.concat(refs, U.sample(Object.keys(St.state.items), 8)) });
    }
    q.push(...spread(p3));
    return q;
  }

  function reviewQueue() {
    const now = Date.now();
    let ids = A.Progress.dueIds()
      .sort((a, b) => A.SRS.retr(St.state.items[a], now) - A.SRS.retr(St.state.items[b], now))
      .slice(0, 12);
    let practice = false;
    if (!ids.length) { ids = weakest(new Set(), 10); practice = true; }
    const q = spread(ids.map(id => ({ t: 'ex', id, lvl: Math.min(3, Math.max(1, St.state.items[id].reps)) })));
    if (q.length >= 5) q.splice(3, 0, { t: 'match', ids });
    return { q, practice };
  }

  // ---------- public ----------
  L.startLesson = async function (lesson) {
    // Listening-only lessons cannot run in "can't listen now" mode
    const ids = lesson.newIds.concat(lesson.refIds);
    const audioOnly = lesson.mode === 'spell_listen' || (ids.length && ids.every(id => X.audioOnly(C.items[id])));
    if (Sp.muted() && (audioOnly || lesson.story)) {
      const ok = await U.confirm({ title: 'Включить звук?', text: 'Этот урок нельзя пройти без звука.', ok: 'Включить звук', cancel: 'Позже' });
      if (!ok) return;
      Sp.unmute();
    }
    if (lesson.story) { A.Story.start(lesson); return; }
    begin({ kind: 'lesson', lesson, queue: lessonQueue(lesson), unitIndex: lesson.unit.index, extraKnown: lesson.newIds.concat(lesson.refIds) });
  };
  L.startReview = function () {
    const r = reviewQueue();
    if (!r.q.length) { U.toast('Повторять пока нечего — сначала пройдите урок'); return; }
    const nl = C.nextLesson();
    begin({ kind: 'review', practice: r.practice, queue: r.q, unitIndex: nl ? nl.unit.index : 999 });
  };
  L.askExit = async function () {
    if (!L.active()) { A.App.exitFocus(); return; }
    const ok = await U.confirm({ title: 'Выйти из урока?', text: 'Прогресс этого урока не сохранится.', ok: 'Выйти', cancel: 'Продолжить урок', danger: true });
    if (ok) { Sp.stop(); S = null; A.App.exitFocus(); }
  };

  // Shared lesson shell (also used by stories)
  L.shell = function (onClose) {
    el = {};
    el.progress = h('i');
    el.combo = h('div', { class: 'combo', 'aria-live': 'polite' });
    el.body = h('div', { class: 'lesson-body' });
    el.fb = h('div', { class: 'feedback', hidden: true });
    el.cta = h('button', { class: 'btn primary block', type: 'button' }, 'Проверить');
    el.foot = h('div', { class: 'lesson-foot' }, el.fb, el.cta);
    const close = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Выйти', html: U.icon('close'), onclick: onClose || L.askExit });
    el.mute = h('button', {
      class: 'mute-chip', type: 'button', hidden: !Sp.muted(), title: 'Включить звук',
      onclick: () => { Sp.unmute(); U.toast('Звук снова включён'); }
    }, '🔇 без звука');
    U.$('#main').replaceChildren(h('div', { class: 'lesson' },
      h('div', { class: 'lesson-top' }, close, h('div', { class: 'progress', role: 'progressbar' }, el.progress), el.mute, el.combo),
      el.body, el.foot));
    U.$('#main').scrollTop = 0;
    return el;
  };

  function begin(o) {
    Sp.stop();
    S = Object.assign(o, { pos: 0, results: {}, retries: {}, answered: 0, correct: 0, xp: 0, combo: 0, errRun: 0, t0: Date.now(), introduced: [], phase: 'idle' });
    S.ctx = makeCtx(o.unitIndex, o.extraKnown);
    A.App.enterFocus();
    L.shell();
    show();
  }

  function adjust(e) {
    const r = S.results[e.id];
    let lvl = e.lvl;
    if (r && r.err > r.ok) lvl -= 1;
    if (S.errRun >= 2) lvl = 0;
    return Object.assign({}, e, { lvl: Math.max(0, lvl) });
  }

  function show() {
    if (!S) return;
    let e = S.queue[S.pos];
    let ex = null;
    // skip entries that cannot produce a task (e.g. not enough distractors yet)
    while (e && (e.t === 'ex' || e.t === 'match')) {
      ex = e.t === 'match' ? X.makeMatch(e.ids, S.ctx) : X.make(adjust(e), S.ctx);
      if (ex) break;
      S.pos++;
      e = S.queue[S.pos];
    }
    el.progress.style.width = Math.round(S.pos / S.queue.length * 100) + '%';
    if (!e) { finish(); return; }

    el.body.replaceChildren();
    el.fb.hidden = true;
    el.foot.className = 'lesson-foot';
    el.cta.hidden = false;
    el.cta.disabled = false;
    U.$('#main').scrollTop = 0;
    S.phase = 'idle';
    S.ex = null;

    if (e.t === 'tips') {
      el.body.append(h('div', { class: 'ex-title' }, 'Перед уроком'), X.tips(S.lesson.unit));
      el.cta.textContent = 'Понятно, начнём';
      el.cta.onclick = next;
      return;
    }
    if (e.t === 'intro') {
      const card = X.intro(C.items[e.id]);
      el.body.append(card.node);
      el.cta.textContent = 'Дальше';
      el.cta.onclick = next;
      if (!S.introduced.includes(e.id)) S.introduced.push(e.id);
      S.ctx.learned.add(e.id);
      setTimeout(() => { if (S && S.queue[S.pos] === e) card.play(); }, 350);
      return;
    }

    S.ex = ex;
    const api = {
      ready: b => { if (S && S.ex === ex && S.phase === 'idle') el.cta.disabled = !b; },
      done: r => result(e, ex, r)
    };
    el.body.append(h('div', { class: 'ex-title' }, ex.title), ex.view(api));
    if (ex.auto) {
      el.cta.hidden = true;
    } else {
      el.cta.textContent = 'Проверить';
      el.cta.disabled = true;
      el.cta.onclick = () => { if (S && S.phase === 'idle') result(e, ex, ex.check()); };
    }
    if (ex.autoplay) {
      setTimeout(() => {
        if (!S || S.ex !== ex || S.phase !== 'idle') return;
        const varied = ex.autoplayOpt && ex.autoplayOpt.varied;
        (varied ? Sp.speakVaried : Sp.speak)(ex.autoplay, ex.autoplayOpt);
      }, 320);
    }
  }

  function requeue(e) {
    const n = S.retries[e.id] || 0;
    if (n >= 2) return;
    S.retries[e.id] = n + 1;
    const at = Math.min(S.queue.length, S.pos + 3 + Math.floor(Math.random() * 2));
    S.queue.splice(at, 0, { t: 'ex', id: e.id, lvl: Math.max(0, (e.lvl || 1) - 1), mode: e.mode, retry: true });
  }

  function result(e, ex, r) {
    if (!S || S.phase !== 'idle' || S.ex !== ex) return;
    S.phase = 'answered';
    el.cta.hidden = false;
    el.cta.disabled = false;
    if (r.skip) {
      showFb('neutral', r.msg || 'Пропускаем это задание', null);
    } else {
      S.answered++;
      if (e.t === 'ex') {
        const res = S.results[e.id] || (S.results[e.id] = { ok: 0, err: 0 });
        if (r.ok) res.ok++; else res.err++;
      }
      if (r.spoken) St.state.stats.spoken++;
      if (r.ok) {
        S.correct++;
        S.xp++;
        S.combo++;
        S.errRun = 0;
        U.sfx('ok');
        U.vibrate(12);
        showFb('good', U.pick(PRAISE), ex);
        if (ex.sayAfter) Sp.speak(ex.sayAfter);
      } else {
        S.combo = 0;
        S.errRun++;
        U.sfx('bad');
        U.vibrate([30, 40, 30]);
        showFb('bad', 'Правильный ответ:', ex, r);
        const say = (ex.fb && (ex.fb.say || ex.fb.en)) || ex.sayAfter;
        setTimeout(() => { if (S && S.ex === ex) { if (ex.afterWrong) ex.afterWrong(); else if (say) Sp.speak(say); } }, 450);
        if (e.t === 'ex') requeue(e);
      }
    }
    el.combo.textContent = S.combo >= 3 ? S.combo + ' подряд' : '';
    el.cta.textContent = 'Дальше';
    el.cta.onclick = next;
  }

  function showFb(kind, title, ex, r) {
    el.foot.className = 'lesson-foot ' + kind;
    const fb = ex && ex.fb;
    const body = h('div', { class: 'fb-body' });
    if (fb && kind === 'bad') {
      if (fb.en) body.append(h('div', { class: 'en' }, fb.en));
      if (fb.ru) body.append(h('div', {}, fb.ru));
      if (r && r.why) body.append(h('div', { class: 'fb-why', html: r.why }));
      if (fb.note) body.append(h('div', { class: 'small', style: 'margin-top:6px', html: fb.note }));
    } else if (fb && kind === 'good' && fb.en && fb.ru) {
      body.append(h('span', { class: 'en', style: 'font-size:17px' }, fb.en), ' — ' + fb.ru);
    }
    const replay = fb && fb.en ? X.auBtn(fb.say || fb.en, { cls: 'xs fb-replay' }) : null;
    U.fill(el.fb,
      h('div', { class: 'fb-ico', html: U.icon(kind === 'good' ? 'check' : kind === 'bad' ? 'x' : 'info') }),
      h('div', { class: 'grow' }, h('div', { class: 'fb-title' }, title), body),
      replay);
    el.fb.hidden = false;
  }

  function next() {
    if (!S) return;
    Sp.stop();
    S.pos++;
    show();
  }

  function finish() {
    const stt = St.state;
    const secs = (Date.now() - S.t0) / 1000;
    let fresh = 0;
    Object.keys(S.results).forEach(id => {
      const r = S.results[id];
      const g = r.err === 0 ? 3 : (r.err === 1 && r.ok > 0) ? 2 : 1;
      if (!stt.items[id]) fresh++;
      stt.items[id] = A.SRS.review(stt.items[id], g);
    });
    S.introduced.forEach(id => { if (!stt.items[id]) { stt.items[id] = A.SRS.review(null, 3); fresh++; } });
    const acc = S.answered ? Math.round(S.correct / S.answered * 100) : 100;
    const perfect = S.answered >= 4 && S.correct === S.answered;
    const xp = S.xp + (S.kind === 'lesson' ? 5 : 3) + (perfect ? 5 : 0);
    stt.stats.answered += S.answered;
    stt.stats.correct += S.correct;
    if (perfect) stt.stats.perfect++;
    if (S.kind === 'review') stt.stats.reviews++;
    let unitDone = false;
    if (S.kind === 'lesson') {
      const was = C.unitComplete(S.lesson.unit);
      stt.lessons[S.lesson.key] = { at: Date.now(), acc };
      unitDone = !was && C.unitComplete(S.lesson.unit);
    }
    const ev = A.Progress.addXP(xp, secs);
    const badges = A.Progress.checkBadges();
    St.save();
    S.finished = true;
    L.finishView({
      label: S.kind === 'review' ? (S.practice ? 'Тренировка' : 'Повторение') : S.lesson.unit.title + ' · ' + S.lesson.title,
      xp, acc, secs, fresh, perfect, ev, badges, unitDone, review: S.kind === 'review'
    });
  }

  const fmtTime = s => { const m = Math.floor(s / 60), r = Math.round(s % 60); return m + ':' + String(r).padStart(2, '0'); };
  const stat = (b, s) => h('div', { class: 'stat' }, h('b', {}, String(b)), h('span', {}, s));

  L.finishView = function (o) {
    el.progress.style.width = '100%';
    U.sfx('done');
    U.confetti();
    const goal = St.state.settings.goal, today = A.Progress.todayXP();
    const si = A.Progress.streakInfo();
    const title = o.perfect ? 'Без единой ошибки!' : o.acc >= 85 ? 'Отличный урок!' : o.acc >= 60 ? 'Урок пройден!' : 'Готово! Ошибки — часть обучения';
    const notes = [];
    if (o.unitDone) notes.push('Станция пройдена — следующая открыта.');
    if (o.ev && o.ev.goalDone) notes.push('Дневная цель выполнена!');
    if (o.ev && o.ev.newFreeze) notes.push('Вы получили заморозку серии: если пропустите день, серия не сгорит.');
    if (o.ev && o.ev.usedFreeze) notes.push('Заморозка сохранила вашу серию.');
    if (o.review) notes.push('Повторённые слова вернутся позже — как раз тогда, когда начнут забываться.');
    else if (o.acc < 70) notes.push('Трудные слова вернутся в повторении. Так мозг запоминает надёжнее.');
    el.body.replaceChildren(h('div', { class: 'finish' },
      h('div', { class: 'label' }, o.label),
      h('h1', { class: 'h1' }, title),
      h('div', { class: 'big-xp' }, '+' + o.xp + ' XP'),
      h('div', { class: 'stat-row' }, stat(o.acc + '%', 'точность'), stat(fmtTime(o.secs), 'время'), stat(o.fresh, U.plural(o.fresh, ['новое', 'новых', 'новых']))),
      h('div', { class: 'card flat stack', style: 'align-self:stretch;text-align:left' },
        h('div', { class: 'row' }, h('span', { style: 'color:var(--read)', html: U.icon('flame') }),
          h('b', {}, si.n + ' ' + U.plural(si.n, ['день', 'дня', 'дней']) + ' подряд')),
        h('div', { class: 'row' }, h('div', { class: 'progress grow' }, h('i', { style: 'width:' + Math.min(100, Math.round(today / goal * 100)) + '%' })),
          h('span', { class: 'small muted' }, Math.min(today, goal) + ' / ' + goal + ' XP'))),
      notes.length ? h('div', { class: 'stack', style: 'align-self:stretch;text-align:left' }, notes.map(n => h('p', { class: 'notice' }, n))) : null,
      o.badges && o.badges.length ? h('div', { class: 'stack' }, h('div', { class: 'label' }, 'Новые награды'),
        h('div', { class: 'new-badges' }, o.badges.map(b => h('div', { class: 'badge got' }, h('div', { class: 'medal' }, b.mark), h('div', { class: 'bt' }, b.t))))) : null));
    el.fb.hidden = true;
    el.foot.className = 'lesson-foot';
    el.combo.textContent = '';
    el.cta.hidden = false;
    el.cta.disabled = false;
    el.cta.textContent = 'Продолжить';
    el.cta.onclick = () => A.App.exitFocus();
    U.$('#main').scrollTop = 0;
  };
})(window.A);

</script>
<script>
'use strict';
// Story reader: lines appear one at a time with audio; every word can be tapped for a translation.
// Ends with a few comprehension questions.
// Dialogues add a role-play: after listening, the learner plays Anna and picks her replies.
(function (A) {
  const U = A.U, h = U.h, C = A.Course, Sp = A.Speech, St = A.Store;
  const Story = A.Story = {};
  let T = null;
  let el = null;

  function voiceFor(who) {
    const vs = Sp.voices();
    if (!vs.length || who === 'Anna' || !who) return null;
    let hsh = 0;
    for (const ch of who) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
    const def = Sp.defaultVoice();
    const others = vs.filter(v => v !== def);
    return others.length ? others[hsh % others.length] : null;
  }
  const sayLine = line => Sp.speak(line[1], { clip: 'story|' + U.audioKey(line[1]), voice: voiceFor(line[0]) });

  let popT;
  function gloss(word, wEl) {
    const tr = C.gloss(word);
    U.$$('.w.on').forEach(x => x.classList.remove('on'));
    wEl.classList.add('on');
    const clean = word.replace(/[.,!?“”"]/g, '');
    Sp.speak(clean);
    let pop = U.$('.gloss-pop');
    if (pop) pop.remove();
    pop = h('div', { class: 'gloss-pop', role: 'status' }, h('span', { class: 'en' }, clean), h('span', {}, tr ? '— ' + tr : '— (имя или новое слово)'));
    document.body.append(pop);
    clearTimeout(popT);
    popT = setTimeout(() => { pop.remove(); wEl.classList.remove('on'); }, 2600);
  }

  function bubble(line, opt) {
    opt = opt || {};
    const [who, en, ru] = line;
    const side = who === 'Anna' ? ' right' : who ? '' : ' narr';
    const enEl = h('div', { class: 'line-en en' });
    en.split(/(\s+)/).forEach(tok => {
      if (/^\s+$/.test(tok)) enEl.append(tok);
      else {
        const w = h('span', { class: 'w', role: 'button', tabindex: '0' }, tok);
        w.onclick = () => { if (!b.classList.contains('masked')) gloss(tok, w); };
        enEl.append(w);
      }
    });
    const ruEl = h('div', { class: 'line-ru', hidden: true }, ru);
    const play = A.Ex.auBtn(en, { cls: 'xs' });
    play.onclick = () => sayLine(line);
    const tr = h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { ruEl.hidden = !ruEl.hidden; } }, 'Перевод');
    const label = who === 'Anna' && T && T.dialog ? 'Anna (вы)' : who;
    const b = h('div', { class: 'bubble' + side + (opt.masked ? ' masked' : '') }, who ? h('div', { class: 'who' }, label) : null, enEl, ruEl, h('div', { class: 'line-tools' }, play, tr));
    return b;
  }

  Story.start = function (lesson) {
    const story = A.DATA.stories[lesson.story];
    const dialog = story.type === 'dialog';
    const roleLines = dialog ? story.lines.filter(l => l[0] === story.role).length : 0;
    T = { lesson, story, dialog, shown: 0, q: -1, correct: 0, roleOk: 0, roleTotal: roleLines, t0: Date.now(), finished: false, done: 0 };
    T.total = story.lines.length + story.questions.length + roleLines;
    A.App.enterFocus();
    el = A.Lesson.shell(askExit);
    cover();
  };

  async function askExit() {
    if (!T || T.finished) { A.App.exitFocus(); return; }
    const ok = await U.confirm({ title: T.dialog ? 'Закрыть диалог?' : 'Закрыть историю?', text: 'Его можно будет пройти заново в любой момент.', ok: 'Закрыть', cancel: 'Продолжить' });
    if (ok) { Sp.stop(); T = null; A.App.exitFocus(); }
  }
  Story.askExit = askExit;
  Story.active = () => !!T && !T.finished;

  const step = () => { T.done++; el.progress.style.width = Math.round(T.done / T.total * 100) + '%'; };
  function resetFoot() {
    el.fb.hidden = true;
    el.foot.className = 'lesson-foot';
    el.cta.hidden = false;
    el.cta.disabled = false;
  }

  function cover() {
    const s = T.story;
    const who = [...new Set(s.lines.map(l => l[0]).filter(Boolean))];
    el.body.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'story-cover' + (T.dialog ? ' dial' : '') },
        h('div', { class: 'label' }, T.dialog ? 'Диалог' : 'История'),
        h('h1', { class: 'h1' }, s.title),
        h('p', {}, s.intro),
        h('p', { class: 'small' }, (T.dialog ? 'Участники: ' : 'Герои: ') + who.join(', '))),
      T.dialog
        ? h('div', { class: 'intro-hint' }, 'Три шага: ', h('b', {}, 'послушайте'), ' разговор (текст скрыт — попробуйте понять на слух), ', h('b', {}, 'ответьте'), ' на вопросы и ', h('b', {}, 'сыграйте Анну'), ': выбирайте её реплики.')
        : h('div', { class: 'intro-hint' }, 'Слушайте каждую реплику. ', h('b', {}, 'Нажмите на любое слово'), ' — увидите перевод. Кнопка «Перевод» показывает всю фразу, но сначала попробуйте понять сами.')));
    el.progress.style.width = '0%';
    resetFoot();
    el.cta.textContent = T.dialog ? 'Слушать' : 'Читать';
    el.cta.onclick = nextLine;
  }

  let list, showText = false;
  function nextLine() {
    const s = T.story;
    if (T.shown === 0) {
      list = h('div', { class: 'story-lines' });
      showText = !T.dialog;
      const toggle = T.dialog ? h('button', {
        class: 'btn sm', type: 'button',
        onclick: e => { showText = !showText; U.$$('.bubble', list).forEach(b => b.classList.toggle('masked', !showText)); e.currentTarget.textContent = showText ? 'Скрыть текст' : 'Показать текст'; }
      }, 'Показать текст') : null;
      el.body.replaceChildren(h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:12px' }, h('div', { class: 'ex-title', style: 'margin:0' }, T.dialog ? 'Слушаем' : s.title), toggle), list);
    }
    if (T.shown < s.lines.length) {
      const line = s.lines[T.shown];
      const b = bubble(line, { masked: T.dialog && !showText });
      list.append(b);
      T.shown++;
      step();
      sayLine(line);
      setTimeout(() => b.scrollIntoView({ behavior: 'smooth', block: 'end' }), 30);
      el.cta.textContent = T.shown < s.lines.length ? 'Дальше' : 'К вопросам';
      return;
    }
    question();
  }

  function question() {
    T.q++;
    const s = T.story;
    if (T.q >= s.questions.length) { if (T.dialog) roleIntro(); else finish(); return; }
    const [q, right, ...wrong] = s.questions[T.q];
    const opts = U.shuffle([right, ...wrong]);
    let sel = -1;
    const btns = opts.map((o, i) => h('button', {
      class: 'opt ru-opt', type: 'button',
      onclick: () => { sel = i; btns.forEach((b, j) => b.classList.toggle('sel', j === i)); el.cta.disabled = false; U.sfx('tap'); }
    }, o));
    el.body.replaceChildren(h('div', { class: 'ex' },
      h('div', { class: 'label' }, 'Вопрос ' + (T.q + 1) + ' из ' + s.questions.length),
      h('div', { class: 'ex-title' }, q),
      h('div', { class: 'opts list' }, btns),
      h('details', { class: 'muted small' }, h('summary', {}, T.dialog ? 'Послушать и прочитать разговор' : 'Перечитать историю'),
        h('div', { class: 'story-lines', style: 'margin-top:10px' }, s.lines.map(l => bubble(l))))));
    U.$('#main').scrollTop = 0;
    resetFoot();
    el.cta.textContent = 'Проверить';
    el.cta.disabled = true;
    el.cta.onclick = () => {
      const ok = opts[sel] === right;
      btns.forEach((b, j) => { b.disabled = true; b.classList.remove('sel'); b.classList.add(opts[j] === right ? 'ok' : j === sel ? 'bad' : 'dim'); });
      if (ok) { T.correct++; U.sfx('ok'); U.vibrate(12); } else { U.sfx('bad'); U.vibrate([30, 40, 30]); }
      step();
      feedback(ok, ok ? null : right);
      el.cta.textContent = 'Дальше';
      el.cta.onclick = question;
    };
  }

  function feedback(ok, rightText, isEn) {
    el.foot.className = 'lesson-foot ' + (ok ? 'good' : 'bad');
    U.fill(el.fb, h('div', { class: 'fb-ico', html: U.icon(ok ? 'check' : 'x') }),
      h('div', { class: 'grow' }, h('div', { class: 'fb-title' }, ok ? 'Верно!' : 'Правильный ответ:'),
        ok ? null : h('div', { class: 'fb-body' + (isEn ? ' en' : '') }, rightText)));
    el.fb.hidden = false;
  }

  // ---------- Role-play (dialogues) ----------
  let roleList, roleIdx;
  function roleIntro() {
    el.body.replaceChildren(h('div', { class: 'stack' },
      h('div', { class: 'story-cover dial' }, h('div', { class: 'label' }, 'Шаг 3'), h('h1', { class: 'h1' }, 'Теперь вы — Анна'),
        h('p', {}, 'Собеседник говорит свои реплики, а вы выбираете, что ответить. Правильная реплика прозвучит — повторяйте её вслух.')),
      h('div', { class: 'intro-hint' }, 'Не бойтесь ошибиться: верный вариант покажем сразу.')));
    resetFoot();
    el.cta.textContent = 'Начать';
    roleIdx = 0;
    roleList = h('div', { class: 'story-lines' });
    el.cta.onclick = () => { el.body.replaceChildren(h('div', { class: 'ex-title' }, 'Ваша роль'), roleList); roleNext(); };
  }

  function replyOptions(line) {
    const role = T.story.role;
    const same = T.story.lines.filter(l => l[0] === role && l[1] !== line[1]).map(l => l[1]);
    const other = [].concat(...Object.values(A.DATA.stories).filter(s => s.type === 'dialog' && s !== T.story)
      .map(s => s.lines.filter(l => l[0] === role).map(l => l[1])));
    const picks = U.sample(same, 1).concat(U.sample(other.filter(x => x !== line[1]), 1));
    return U.shuffle([line[1]].concat(picks));
  }

  function roleNext() {
    const s = T.story;
    resetFoot();
    if (roleIdx >= s.lines.length) { finish(); return; }
    const line = s.lines[roleIdx];
    if (line[0] !== s.role) {
      const b = bubble(line);
      roleList.append(b);
      sayLine(line);
      setTimeout(() => b.scrollIntoView({ behavior: 'smooth', block: 'end' }), 30);
      roleIdx++;
      el.cta.textContent = 'Дальше';
      el.cta.onclick = roleNext;
      return;
    }
    const opts = replyOptions(line);
    let sel = -1;
    const box = h('div', { class: 'reply-box' }, h('div', { class: 'label' }, 'Что ответит Анна?'));
    const btns = opts.map((o, i) => h('button', {
      class: 'opt word-opt en reply-opt', type: 'button',
      onclick: () => { sel = i; btns.forEach((b, j) => b.classList.toggle('sel', j === i)); el.cta.disabled = false; U.sfx('tap'); }
    }, o));
    box.append(h('div', { class: 'opts list' }, btns));
    roleList.append(box);
    setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'end' }), 30);
    el.cta.textContent = 'Ответить';
    el.cta.disabled = true;
    el.cta.onclick = () => {
      const ok = opts[sel] === line[1];
      if (ok) { T.roleOk++; U.sfx('ok'); U.vibrate(12); } else { U.sfx('bad'); U.vibrate([30, 40, 30]); }
      box.replaceWith(bubble(line));
      step();
      feedback(ok, line[1], true);
      setTimeout(() => sayLine(line), ok ? 250 : 450);
      roleIdx++;
      el.cta.textContent = 'Дальше';
      el.cta.onclick = roleNext;
    };
  }

  function finish() {
    const stt = St.state;
    const secs = (Date.now() - T.t0) / 1000;
    const n = T.story.questions.length + T.roleTotal;
    const good = T.correct + T.roleOk;
    const xp = 10 + good * 2;
    const was = C.unitComplete(T.lesson.unit);
    stt.lessons[T.lesson.key] = { at: Date.now(), acc: Math.round(good / n * 100) };
    if (T.dialog) stt.stats.dialogs = (stt.stats.dialogs || 0) + 1; else stt.stats.stories++;
    stt.stats.answered += n;
    stt.stats.correct += good;
    const ev = A.Progress.addXP(xp, secs);
    const badges = A.Progress.checkBadges();
    St.save();
    T.finished = true;
    A.Lesson.finishView({
      label: (T.dialog ? 'Диалог · ' : 'История · ') + T.story.title, xp, acc: Math.round(good / n * 100), secs, fresh: 0,
      perfect: good === n, ev, badges, unitDone: !was
    });
  }
})(window.A);

</script>
<script>
'use strict';
// Moving progress between devices without a server:
//  - an animated series of QR codes (the progress is too big for one code), scanned by the other device's camera;
//  - sending the backup as a file through the system share menu (Telegram, e-mail…) or downloading it.
(function (A) {
  const U = A.U, h = U.h, St = A.Store;
  const T = A.Transfer = {};
  const CHUNK = 600;

  function toB64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function fromB64(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function pipe(bytes, stream) {
    const res = new Response(new Blob([bytes]).stream().pipeThrough(stream));
    return new Uint8Array(await res.arrayBuffer());
  }

  // Compressed, base64-encoded backup ('z:' deflate, 'p:' plain when the browser cannot compress)
  T.pack = async function () {
    const bytes = new TextEncoder().encode(St.exportJSON());
    if (window.CompressionStream) return 'z:' + toB64(await pipe(bytes, new CompressionStream('deflate-raw')));
    return 'p:' + toB64(bytes);
  };
  T.unpack = async function (payload) {
    const kind = payload.slice(0, 2), bytes = fromB64(payload.slice(2));
    if (kind === 'z:') return new TextDecoder().decode(await pipe(bytes, new DecompressionStream('deflate-raw')));
    return new TextDecoder().decode(bytes);
  };

  T.canScan = () => 'BarcodeDetector' in window && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const inFrame = () => { try { return window.top !== window.self; } catch (e) { return true; } };

  // ---------- Sender ----------
  T.showQR = async function () {
    if (typeof window.qrcode !== 'function') { U.toast('QR-коды не поддерживаются'); return; }
    const payload = await T.pack();
    const id = Math.random().toString(36).slice(2, 6);
    const n = Math.ceil(payload.length / CHUNK);
    const frames = [];
    for (let i = 0; i < n; i++) {
      const qr = window.qrcode(0, 'L');
      qr.addData('EZ1/' + id + '/' + (i + 1) + '/' + n + '/' + payload.slice(i * CHUNK, (i + 1) * CHUNK));
      qr.make();
      frames.push(qr.createDataURL(4, 2));
    }
    const img = h('img', { class: 'qr-img', alt: 'QR-код с прогрессом', src: frames[0] });
    const label = h('div', { class: 'small muted' }, n > 1 ? 'Кадр 1 из ' + n : '');
    let i = 0;
    const timer = n > 1 ? setInterval(() => { i = (i + 1) % n; img.src = frames[i]; label.textContent = 'Кадр ' + (i + 1) + ' из ' + n; }, 450) : null;
    U.sheet(h('div', { class: 'stack', style: 'align-items:center;text-align:center' },
      h('h2', { class: 'h2' }, 'Покажите этот код другому устройству'),
      h('p', { class: 'muted small' }, 'На телефоне откройте Профиль → Перенос прогресса → «Сканировать QR-код» и наведите камеру на экран. Коды сменяются — держите камеру, пока не соберутся все.'),
      h('div', { class: 'qr-frame' }, img), label,
      h('button', { class: 'btn block', type: 'button', onclick: () => U.closeSheet() }, 'Готово')
    ), { onClose: () => clearInterval(timer) });
    // the sheet's own close button path
    const ov = document.getElementById('overlay');
    const stop = () => { if (ov.hidden) { clearInterval(timer); obs.disconnect(); } };
    const obs = new MutationObserver(stop);
    obs.observe(ov, { attributes: true, attributeFilter: ['hidden'] });
  };

  // ---------- Receiver ----------
  T.scan = async function () {
    if (!T.canScan()) {
      U.toast(inFrame() ? 'Камера недоступна в этой версии. Откройте установленное приложение.' : 'Этот браузер не умеет сканировать QR-коды. Используйте «Отправить файлом».', 4000);
      return;
    }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
    catch (e) { U.toast('Нет доступа к камере.'); return; }
    const video = h('video', { class: 'qr-video', playsinline: true, muted: true, autoplay: true });
    video.srcObject = stream;
    const status = h('div', { class: 'small' }, 'Наведите камеру на QR-код на другом экране');
    const bar = h('i');
    let stopped = false, got = {}, total = 0, session = '';
    const stopAll = () => { stopped = true; stream.getTracks().forEach(t => t.stop()); };
    U.sheet(h('div', { class: 'stack', style: 'align-items:center;text-align:center' },
      h('h2', { class: 'h2' }, 'Сканирование'),
      video, h('div', { class: 'progress', style: 'width:100%' }, bar), status,
      h('button', { class: 'btn block', type: 'button', onclick: () => U.closeSheet() }, 'Отмена')
    ), { onClose: stopAll });
    const ov = document.getElementById('overlay');
    const obs = new MutationObserver(() => { if (ov.hidden) { stopAll(); obs.disconnect(); } });
    obs.observe(ov, { attributes: true, attributeFilter: ['hidden'] });

    let detector;
    try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { status.textContent = 'Сканер недоступен.'; return; }
    try { await video.play(); } catch (e) { /* autoplay attribute handles it */ }
    const tick = async () => {
      if (stopped) return;
      try {
        const codes = await detector.detect(video);
        codes.forEach(c => {
          const m = /^EZ1\/(\w+)\/(\d+)\/(\d+)\/(.*)$/s.exec(c.rawValue || '');
          if (!m) return;
          if (session && m[1] !== session) { got = {}; }
          session = m[1];
          total = +m[3];
          got[m[2]] = m[4];
        });
        const have = Object.keys(got).length;
        if (total) {
          bar.style.width = Math.round(have / total * 100) + '%';
          status.textContent = 'Получено ' + have + ' из ' + total;
        }
        if (total && have === total) {
          stopAll();
          obs.disconnect();
          let payload = '';
          for (let i = 1; i <= total; i++) payload += got[i];
          U.closeSheet();
          importText(await T.unpack(payload));
          return;
        }
      } catch (e) { /* frame not ready yet */ }
      setTimeout(tick, 160);
    };
    video.addEventListener('loadeddata', tick, { once: true });
  };

  async function importText(text) {
    let info = '';
    try { const s = JSON.parse(text).state; info = s ? (Object.keys(s.items || {}).length + ' слов и букв, ' + (s.stats ? s.stats.xp : 0) + ' XP') : ''; } catch (e) { /* shown below */ }
    const ok = await U.confirm({ title: 'Заменить прогресс?', text: 'Прогресс с другого устройства: ' + (info || 'получен') + '. Текущий прогресс на этом устройстве будет заменён.', ok: 'Заменить', danger: true });
    if (!ok) return;
    try { St.importJSON(text); A.App.applyTheme(); U.toast('Прогресс перенесён'); A.App.show('home'); }
    catch (e) { U.toast('Не получилось: ' + e.message); }
  }
  T.importText = importText;

  // ---------- File ----------
  T.shareFile = async function () {
    const name = 'english-zero-' + U.dayKey() + '.json';
    const file = new File([St.exportJSON()], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Прогресс: Английский с нуля' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    if (inFrame()) { U.toast('Здесь файл сохранить нельзя — используйте «Копию текстом».', 3500); return; }
    const a = h('a', { href: URL.createObjectURL(file), download: name });
    document.body.append(a);
    a.click();
    a.remove();
  };
  T.pickFile = function () {
    const input = h('input', { type: 'file', accept: '.json,application/json,text/plain', hidden: true });
    input.onchange = () => {
      const f = input.files && input.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => importText(String(r.result));
      r.readAsText(f);
      input.remove();
    };
    document.body.append(input);
    input.click();
  };
})(window.A);

</script>
<script>
'use strict';
// Conversation practice with Claude (role-play). Works only inside the claude.ai artifact viewer,
// where the page may ask Claude on the viewer's own account (`sample` capability). Elsewhere it is hidden.
(function (A) {
  const U = A.U, h = U.h, Sp = A.Speech, St = A.Store, C = A.Course;
  const AI = A.AI = {};
  AI.ARTIFACT_URL = 'https://claude.ai/artifact/3DTEvCaNh8cAQ5k3bLqRyn';

  let sample = null;
  let state = 'unknown'; // unknown | ready | none | denied
  const listeners = [];
  AI.onChange = fn => listeners.push(fn);
  AI.state = () => state;
  function setState(s) { state = s; listeners.forEach(fn => fn(s)); }

  // `host` defaults to the viewer's window.claude; passing one replaces the current connection
  AI.detect = function (host) {
    if (state !== 'unknown' && !host) return;
    const c = host || window.claude;
    if (!c || typeof c.use !== 'function') { setState('none'); return; }
    c.use('sample').then(fn => { sample = fn; setState(fn ? 'ready' : 'none'); }).catch(() => setState('none'));
  };

  const SCENES = [
    { id: 'cafe', t: 'Кафе', d: 'Закажите кофе и что-нибудь поесть', who: 'Mia', setting: 'a small coffee shop in New York. You are Mia, a friendly barista. The learner is a customer who wants to order.' },
    { id: 'airport', t: 'Паспортный контроль', d: 'Ответьте на вопросы офицера', who: 'Officer', setting: 'passport control at JFK airport in New York. You are a polite officer asking simple questions. The learner is arriving.' },
    { id: 'hotel', t: 'Отель', d: 'Заселитесь в номер', who: 'Receptionist', setting: 'a hotel reception desk. You are a friendly receptionist. The learner has a reservation and wants to check in.' },
    { id: 'shop', t: 'Магазин одежды', d: 'Купите тёплую куртку', who: 'Clerk', setting: 'a clothes store. You are a helpful shop assistant. The learner wants to buy a warm jacket.' },
    { id: 'street', t: 'На улице', d: 'Спросите дорогу до метро', who: 'Sam', setting: 'a street in Manhattan. You are Sam, a kind local. The learner is lost and asks for directions to the subway.' },
    { id: 'neighbor', t: 'Новый сосед', d: 'Познакомьтесь с соседом Беном', who: 'Ben', setting: 'an apartment building. You are Ben, a cheerful teacher who lives next door. You meet the learner for the first time.' },
    { id: 'free', t: 'Свободная тема', d: 'Поговорите с Анной о чём угодно', who: 'Anna', setting: 'a casual chat. You are Anna, a programmer from Moscow who moved to New York and learned English from zero. You are kind and curious.' }
  ];

  function knownWords() {
    const words = Object.keys(St.state.items).map(id => C.items[id]).filter(it => it && it.kind === 'word' && /^[a-z]+$/i.test(it.en)).map(it => it.en.toLowerCase());
    return words.slice(-250).join(', ');
  }
  function rules(scene) {
    const known = knownWords();
    return [
      'You are a role-play partner in an English learning app. The learner is a Russian-speaking adult beginner (CEFR A1).',
      'Scene: ' + scene.setting,
      'Rules:',
      '- Stay in character. Use very simple English: 1-2 short sentences, at most 15 words in total, present or simple past, common words.',
      known ? '- Prefer words the learner already knows: ' + known + '.' : '- Use only the most common English words.',
      '- Keep the conversation going. Usually end with one simple question.',
      '- If the learner\'s last message has a grammar or word mistake, put a short friendly correction in Russian in "fix": first the corrected English sentence in quotes, then one short explanation in Russian. If there is no mistake, "fix" is "".',
      '- If the learner writes in Russian, answer in character in English and in "fix" show (in Russian) how to say their message in English.',
      '- Give 3 short, different things the learner could say next (A1 level English) in "options".',
      'Reply with only JSON: {"say": "your English line", "ru": "Russian translation of say", "fix": "", "options": ["...", "...", "..."]}'
    ].join('\n');
  }

  const ERR = {
    not_granted: 'Разговор с ИИ не разрешён. Разрешить можно в меню этой страницы (Permissions).',
    sampling_disabled: 'ИИ недоступен для этого аккаунта.',
    rate_limited: 'Слишком много сообщений подряд или исчерпан лимит. Попробуйте чуть позже.',
    session_expired: 'Нужно заново войти в claude.ai.',
    refused: 'ИИ не стал отвечать на это сообщение. Попробуйте сказать иначе.'
  };
  const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

  // ---------- Scene picker ----------
  AI.open = function () {
    if (state !== 'ready') { U.toast('Разговор с ИИ работает в версии на claude.ai'); return; }
    U.sheet(h('div', { class: 'stack' },
      h('h2', { class: 'h2' }, 'Разговор с ИИ'),
      h('p', { class: 'muted small' }, 'Собеседник говорит простым английским, исправляет ошибки по-русски и подсказывает варианты ответа. Пишите по-английски, а если не знаете как — можно по-русски.'),
      h('div', { class: 'choice-list' }, SCENES.map(s => h('button', { class: 'choice', type: 'button', onclick: () => { U.closeSheet(); chat(s); } },
        h('span', {}, h('b', {}, s.t), h('span', {}, s.d)))))));
  };

  // ---------- Chat ----------
  let ctl = null;
  function chat(scene) {
    const turns = [{ role: 'user', content: rules(scene) + '\n\nStart the conversation with your first line.' }];
    let sent = 0, busy = false;
    A.App.enterFocus();
    const list = h('div', { class: 'story-lines ai-chat' });
    const chips = h('div', { class: 'chips ai-chips' });
    const input = h('input', { class: 'search', id: 'ai-input', type: 'text', placeholder: 'Напишите по-английски…', autocomplete: 'off', enterkeyhint: 'send' });
    const send = h('button', { class: 'btn primary', type: 'button' }, 'Отправить');
    const stop = h('button', { class: 'btn ghost sm', type: 'button', hidden: true, onclick: () => ctl && ctl.abort() }, 'Остановить');
    const close = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Закрыть', html: U.icon('close'), onclick: exit });
    U.$('#main').replaceChildren(h('div', { class: 'lesson' },
      h('div', { class: 'lesson-top' }, close, h('div', { class: 'grow' }, h('b', {}, scene.t), h('div', { class: 'small muted' }, 'Разговор с ИИ · ' + scene.who))),
      h('div', { class: 'lesson-body' }, list),
      h('div', { class: 'lesson-foot' }, chips, stop, h('div', { class: 'row', style: 'margin-top:8px' }, input, send))));

    function exit() {
      if (ctl) ctl.abort();
      if (sent) { A.Progress.addXP(Math.min(20, sent * 2), 0); St.state.stats.aiMessages = (St.state.stats.aiMessages || 0) + sent; A.Progress.checkBadges(); St.save(); }
      A.App.exitFocus();
    }
    const scroll = n => setTimeout(() => n.scrollIntoView({ behavior: 'smooth', block: 'end' }), 30);
    function aiBubble(r) {
      const ru = h('div', { class: 'line-ru', hidden: true }, r.ru || '');
      const b = h('div', { class: 'bubble' }, h('div', { class: 'who' }, scene.who), h('div', { class: 'line-en en' }, r.say),
        ru, h('div', { class: 'line-tools' },
          h('button', { class: 'au xs', type: 'button', 'aria-label': 'Прослушать', html: U.icon('speaker'), onclick: () => Sp.speak(r.say) }),
          r.ru ? h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { ru.hidden = !ru.hidden; } }, 'Перевод') : null));
      list.append(b);
      scroll(b);
    }
    function note(text, cls) {
      const n = h('div', { class: 'ai-note ' + (cls || '') }, text);
      list.append(n);
      scroll(n);
      return n;
    }
    function setChips(opts) {
      U.fill(chips, (opts || []).slice(0, 3).map(o => h('button', { class: 'chip en', type: 'button', onclick: () => { input.value = o; input.focus(); } }, o)));
    }
    async function ask() {
      busy = true;
      send.disabled = true;
      stop.hidden = false;
      const typing = note('Собеседник печатает…', 'typing');
      ctl = new AbortController();
      try {
        const r = await sample.json(turns, { modelTier: 'quick', cache: false, signal: ctl.signal });
        typing.remove();
        if (!r || typeof r.say !== 'string') throw { code: 'invalid_json' };
        turns.push({ role: 'assistant', content: JSON.stringify(r) });
        if (r.fix) note(r.fix, 'fix');
        aiBubble(r);
        setChips(Array.isArray(r.options) ? r.options.map(String) : []);
      } catch (e) {
        typing.remove();
        if (e && e.code === 'cancelled') { note('Остановлено.'); }
        else {
          if (e && PERMANENT.includes(e.code)) setState('denied');
          note((e && ERR[e.code]) || 'Не получилось получить ответ. Попробуйте отправить ещё раз.', 'err');
          if (turns.length > 1 && turns[turns.length - 1].role === 'user') turns.pop();
        }
      } finally {
        busy = false;
        send.disabled = false;
        stop.hidden = true;
        ctl = null;
      }
    }
    function submit() {
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = '';
      const b = h('div', { class: 'bubble right' }, h('div', { class: 'who' }, 'Вы'), h('div', { class: 'line-en en' }, text));
      list.append(b);
      scroll(b);
      setChips([]);
      turns.push({ role: 'user', content: text });
      // keep the instructions turn and the last exchanges
      while (turns.length > 21) turns.splice(1, 2);
      sent++;
      ask();
    }
    send.onclick = submit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    ask();
  }
})(window.A);

</script>
<script>
'use strict';
// Screens: onboarding, route (home), review, dictionary, profile, science.
(function (A) {
  const U = A.U, h = U.h, C = A.Course, Sp = A.Speech, St = A.Store, P = A.Progress;
  const Scr = A.Screens = {};

  const PLAN_OPTIONS = [
    { id: 'coffee', t: 'Утром с кофе', s: 'Когда я пью утренний кофе' },
    { id: 'commute', t: 'В дороге', s: 'Когда я еду на работу или учёбу' },
    { id: 'lunch', t: 'В обеденный перерыв', s: 'Когда у меня обеденный перерыв' },
    { id: 'evening', t: 'Вечером перед сном', s: 'Когда я ложусь в кровать вечером' }
  ];
  const GOALS = [
    { xp: 20, t: 'Спокойно', s: 'Около 5 минут в день' },
    { xp: 40, t: 'Обычно', s: 'Около 10 минут в день' },
    { xp: 60, t: 'Серьёзно', s: 'Около 15 минут в день' },
    { xp: 100, t: 'Интенсив', s: '25 минут и больше' }
  ];
  const minutesFor = xp => (GOALS.find(g => g.xp === xp) || GOALS[1]).s.replace(/^Около /, '').replace(/ в день$/, '');

  Scr.planText = function () {
    const p = St.state.settings.plan;
    const opt = PLAN_OPTIONS.find(o => o.id === p.when);
    const when = opt ? opt.s : (p.when === 'custom' && p.custom ? p.custom : '');
    if (!when) return '';
    return when + ', я открываю английский на ' + minutesFor(St.state.settings.goal) + '.';
  };

  function ring(pct) {
    const R = 19, L = 2 * Math.PI * R;
    return '<svg class="ring' + (pct >= 1 ? ' full' : '') + '" viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="' + R + '"/>' +
      '<circle class="fg" cx="22" cy="22" r="' + R + '" stroke-dasharray="' + L.toFixed(1) + '" stroke-dashoffset="' + (L * (1 - Math.min(1, pct))).toFixed(1) + '"/></svg>';
  }

  // ---------- Home / route ----------
  Scr.home = function (main) {
    const s = St.state, si = P.streakInfo(), goal = s.settings.goal, today = P.todayXP();
    const hud = h('div', { class: 'hud' },
      h('div', { class: 'hud-pill fire' + (si.n ? '' : ' dim'), title: 'Дней подряд', html: U.icon('flame') + '<span>' + si.n + '</span>' }),
      s.stats.freezes ? h('div', { class: 'hud-pill ice', title: 'Заморозки серии', html: U.icon('snow') + '<span>' + s.stats.freezes + '</span>' }) : null,
      h('div', { class: 'ring-wrap' }, h('div', {}, h('b', {}, Math.min(today, goal) + ' / ' + goal), h('br'), 'XP сегодня'), h('div', { html: ring(today / goal) })));

    const cards = h('div', { class: 'home-cards' });
    if (!St.persistent) cards.append(h('p', { class: 'notice' }, 'Браузер не даёт сохранять прогресс на этом устройстве (например, в режиме инкогнито). Уроки работают, но после закрытия прогресс пропадёт.'));
    if (si.lost) cards.append(h('p', { class: 'notice' }, 'Серия из ' + si.lost + ' ' + U.plural(si.lost, ['дня', 'дней', 'дней']) + ' прервалась. Не страшно: для привычки важнее вернуться, чем не пропускать. Начнём новую!'));
    else if (si.atRisk && si.n) cards.append(h('p', { class: 'notice' }, 'Пройдите урок или повторение сегодня, чтобы сохранить серию: ' + si.n + ' ' + U.plural(si.n, ['день', 'дня', 'дней']) + '.'));

    const nl = C.nextLesson();
    if (nl) {
      cards.append(h('div', { class: 'next-card' },
        h('div', { class: 'label' }, Object.keys(s.lessons).length ? 'Продолжить маршрут' : 'Первый урок'),
        h('div', { class: 'h2' }, nl.unit.title),
        h('div', { class: 'sub' }, 'Станция ' + (nl.unit.index + 1) + ' · ' + nl.title),
        h('button', { class: 'btn primary', type: 'button', onclick: () => A.Lesson.startLesson(nl) }, 'Начать')));
    } else {
      cards.append(h('div', { class: 'next-card' }, h('div', { class: 'label' }, 'Маршрут пройден'), h('div', { class: 'h2' }, 'Добро пожаловать в Нью-Йорк!'),
        h('div', { class: 'sub' }, 'Продолжайте повторять — так слова останутся с вами надолго.')));
    }
    const due = P.dueIds().length;
    if (due) {
      cards.append(h('div', { class: 'card review-card' },
        h('div', { class: 'num' }, due),
        h('div', { class: 'grow' }, h('b', {}, 'Пора повторить'), h('div', { class: 'small muted' }, U.plural(due, ['слово начинает', 'слова начинают', 'слов начинают']) + ' забываться')),
        h('button', { class: 'btn sm', type: 'button', onclick: () => A.Lesson.startReview() }, 'Повторить')));
    }
    if (Sp.muted()) {
      cards.append(h('div', { class: 'card review-card' },
        h('div', { class: 'num', style: 'font-size:22px' }, '🔇'),
        h('div', { class: 'grow' }, h('b', {}, 'Режим без звука'), h('div', { class: 'small muted' }, 'Ещё ' + Sp.mutedMinutes() + ' мин. Задания на слух пропускаются.')),
        h('button', { class: 'btn sm', type: 'button', onclick: () => { Sp.unmute(); A.App.show('home'); } }, 'Включить звук')));
    }
    if (A.AI.state() === 'ready' && Object.keys(s.lessons).length >= 3) {
      cards.append(h('button', { class: 'card review-card ai-card', type: 'button', onclick: () => A.AI.open() },
        h('div', { class: 'num', style: 'background:color-mix(in srgb, var(--dial) 16%, var(--surface));color:var(--dial)' }, 'AI'),
        h('div', { class: 'grow', style: 'text-align:left' }, h('b', {}, 'Разговор с ИИ'), h('div', { class: 'small muted' }, 'Кафе, аэропорт, отель — собеседник поправит ошибки')),
        h('span', { class: 'muted', html: U.icon('chevron') })));
    }
    const plan = Scr.planText();
    if (plan) cards.append(h('div', { class: 'plan-line', html: U.icon('calendar') + '<span>Ваш план: <b>' + U.escape(plan) + '</b></span>' }));

    const legend = h('div', { class: 'legend' }, Object.keys(C.LINES).map(k => h('span', { style: '--lc:' + C.LINES[k].color }, h('i'), C.LINES[k].name)));

    const zones = {};
    C.units.forEach(u => { (zones[u.zone] = zones[u.zone] || []).push(u); });
    const route = Object.keys(zones).map(z => [
      h('div', { class: 'zone-title' }, h('span', { class: 'zone-n' }, 'ЗОНА ' + z), h('h2', { class: 'h2' }, A.DATA.zones[z])),
      h('div', { class: 'route' }, zones[z].map((u, i, arr) => station(u, i, arr, nl)))
    ]);

    U.fill(main, hud, cards, legend, route);
    const cur = U.$('.station.current', main);
    if (cur && Object.keys(s.lessons).length > 2 && !Scr._scrolled) {
      Scr._scrolled = true;
      setTimeout(() => cur.scrollIntoView({ block: 'center' }), 50);
    }
  };

  function station(u, i, arr, nl) {
    const done = C.unitComplete(u), unlocked = C.unitUnlocked(u), current = !!nl && nl.unit === u;
    const cls = 'station' + (done ? ' done' : '') + (current ? ' current' : '') + (!unlocked ? ' locked' : '') + (i === 0 ? ' first' : '') + (i === arr.length - 1 ? ' last' : '');
    return h('button', { class: cls, type: 'button', style: '--lc:' + C.LINES[u.line].color, onclick: () => openUnit(u), 'aria-label': 'Станция ' + (u.index + 1) + ': ' + u.title },
      h('span', { class: 'st-mark', html: done ? U.icon('check') : '' }),
      h('span', { class: 'st-body' },
        h('span', { class: 'st-glyph' }, u.glyph),
        h('span', { class: 'grow' },
          h('span', { class: 'st-num', style: 'display:block' }, 'Станция ' + (u.index + 1) + ' · ' + C.LINES[u.line].name),
          h('span', { class: 'st-title', style: 'display:block' }, u.title),
          h('span', { class: 'st-sub', style: 'display:block' }, u.sub)),
        h('span', { class: 'st-prog', html: !unlocked ? U.icon('lock') : C.unitDoneCount(u) + '/' + u.lessons.length })));
  }

  function lessonSub(l) {
    if (l.story) return 'История с вопросами';
    if (l.review) return 'Повторение всей станции';
    if (l.mode === 'twin_sound') return 'Латинские буквы, похожие на русские';
    if (l.mode === 'spell_listen') return 'Узнайте слово по названиям букв';
    const ids = l.newIds.length ? l.newIds : l.refIds;
    return ids.slice(0, 5).map(id => {
      const it = C.items[id];
      return it.kind === 'letter' ? it.ch : it.kind === 'pair' ? it.en : it.en;
    }).join(' · ');
  }

  function openUnit(u) {
    const unlocked = C.unitUnlocked(u);
    const lc = C.LINES[u.line].color;
    const firstOpen = u.lessons.find(l => !C.lessonDone(l.key) && C.lessonUnlocked(l));
    const rows = u.lessons.map(l => {
      const done = C.lessonDone(l.key), avail = C.lessonUnlocked(l);
      return h('button', {
        class: 'lesson-row' + (done ? ' done' : '') + (l === firstOpen ? ' next' : ''), type: 'button', disabled: !avail,
        onclick: () => { U.closeSheet(); A.Lesson.startLesson(l); }
      },

  // ---------- Review ----------

  function forecastChart(days) {
    const W = 320, H = 120, max = Math.max(1, ...days.map(d => d.c));
    const bw = 30, gap = (W - 20 - bw * 7) / 6;
    const names = ['завтра', '2 дн', '3 дн', '4 дн', '5 дн', '6 дн', '7 дн'];
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Сколько слов вернётся в ближайшие 7 дней">';
    days.forEach((d, i) => {
      const x = 10 + i * (bw + gap), bh = Math.round(d.c / max * 70);
      svg += '<rect class="bar" x="' + x + '" y="' + (90 - bh) + '" width="' + bw + '" height="' + Math.max(bh, 2) + '" rx="4"/>';
      svg += '<text x="' + (x + bw / 2) + '" y="' + (84 - bh) + '" text-anchor="middle">' + d.c + '</text>';
      svg += '<text x="' + (x + bw / 2) + '" y="108" text-anchor="middle">' + names[i] + '</text>';
    });
    return h('div', { html: svg + '</svg>' });
  }

  // ---------- Dictionary ----------
  const DICT_FILTERS = [['all', 'Все'], ['letter', 'Буквы'], ['word', 'Слова'], ['phrase', 'Фразы'], ['pair', 'Пары звуков']];
  let dictState = { f: 'all', q: '' };

  function dictRow(it, card) {
    const r = A.SRS.retr(card);
    const on = Math.max(1, Math.ceil(r * 4));
    const pic = it.kind === 'letter' ? it.pic : it.kind === 'pair' ? it.a.pic + it.b.pic : it.kind === 'pat' ? 'Аа' : it.pic;
    const en = it.kind === 'letter' ? it.ch : it.en;
    const ru = it.kind === 'letter' ? 'как в ' + it.key + ' — ' + it.keyRu : it.kind === 'pat' ? 'правило: ' + it.ru : it.ru;
    const say = it.kind === 'letter' ? it.key : it.kind === 'pat' ? it.variants[0].en : it.en;
    return h('button', { class: 'dict-row', type: 'button', onclick: () => (it.kind === 'pair' ? Sp.speakSeq([it.a.en, it.b.en]) : Sp.speak(say)) },
      h('span', { class: 'pic' + (U.isTextPic(pic) ? ' txt' : '') }, pic || ''),
      h('span', { style: 'min-width:0' }, h('div', { class: 'en' }, en), h('div', { class: 'ru' }, ru)),
      h('span', { class: 'strength' + (r < 0.7 ? ' weak' : ''), title: 'Прочность памяти: ' + Math.round(r * 100) + '%' },
        [0, 1, 2, 3].map(i => h('i', { class: i < on ? 'on' : '' }))));
  }

  Scr.dict = function (main) {
    const s = St.state;
    const all = Object.keys(s.items).map(id => C.items[id]).filter(it => it && it.kind !== 'name');
    const list = h('div', { class: 'dict-list' });
    const counter = h('p', { class: 'muted small' });
    function render() {
      const q = dictState.q.trim().toLowerCase();
      const f = dictState.f;
      const rows = all.filter(it => {
        if (f === 'phrase' ? !(it.kind === 'phrase' || it.kind === 'sent' || it.kind === 'pat') : (f !== 'all' && it.kind !== f)) return false;
        if (!q) return true;
        return (it.en + ' ' + (it.ru || '') + ' ' + (it.key || '') + ' ' + (it.keyRu || '')).toLowerCase().includes(q);
      }).sort((a, b) => (a.kind === 'letter') - (b.kind === 'letter') || a.en.localeCompare(b.en));
      counter.textContent = 'Найдено: ' + rows.length;
      list.replaceChildren(...(rows.length ? rows.map(it => dictRow(it, s.items[it.id]))
        : [h('div', { class: 'empty' }, all.length ? 'Ничего не найдено' : 'Пока пусто. Слова появятся здесь после первого урока.')]));
    }
    const chips = h('div', { class: 'chips' }, DICT_FILTERS.map(([k, t]) => h('button', {
      class: 'chip' + (dictState.f === k ? ' on' : ''), type: 'button',
      onclick: e => { dictState.f = k; U.$$('.chip', chips).forEach(c => c.classList.remove('on')); e.currentTarget.classList.add('on'); render(); }
    }, t)));
    const search = h('input', { class: 'search', id: 'dict-search', type: 'search', placeholder: 'Поиск по-английски или по-русски', value: dictState.q, autocomplete: 'off' });
    search.oninput = () => { dictState.q = search.value; render(); };
    const words = P.learnedWords(), letters = P.learnedLetters();
    main.replaceChildren(
      h('h1', { class: 'h1' }, 'Словарь'),
      h('p', { class: 'muted', style: 'margin:6px 0 14px' }, letters + ' ' + U.plural(letters, ['буква', 'буквы', 'букв']) + ' · ' + words + ' ' + U.plural(words, ['слово и фраза', 'слова и фразы', 'слов и фраз']) + '. Нажмите на строку, чтобы послушать. Полоски — прочность памяти.'),
      h('div', { class: 'stack' }, search, chips, counter),
      list);
    render();
  };

  // ---------- Profile & settings ----------
  function weekChart() {
    const days = St.state.stats.days, goal = St.state.settings.goal;
    const today = U.dayKey();
    const data = [6, 5, 4, 3, 2, 1, 0].map(n => { const k = U.addDays(today, -n); return { k, v: days[k] || 0, d: new Date(k + 'T12:00:00') }; });
    const W = 320, H = 130, max = Math.max(goal, ...data.map(d => d.v));
    const bw = 30, gap = (W - 20 - bw * 7) / 6;
    const wd = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
    const gy = 96 - Math.round(goal / max * 80);
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="XP за последние 7 дней">';
    svg += '<line class="goal" x1="4" x2="' + (W - 4) + '" y1="' + gy + '" y2="' + gy + '"/>';
    data.forEach((d, i) => {
      const x = 10 + i * (bw + gap), bh = Math.round(d.v / max * 80);
      svg += '<rect class="bar' + (i === 6 ? ' today' : '') + '" x="' + x + '" y="' + (96 - bh) + '" width="' + bw + '" height="' + Math.max(bh, 2) + '" rx="4"/>';
      if (d.v) svg += '<text x="' + (x + bw / 2) + '" y="' + (90 - bh) + '" text-anchor="middle">' + d.v + '</text>';
      svg += '<text x="' + (x + bw / 2) + '" y="116" text-anchor="middle">' + wd[d.d.getDay()] + '</text>';
    });
    return h('div', {}, h('div', { html: svg + '</svg>' }), h('p', { class: 'small muted' }, 'Пунктир — дневная цель (' + goal + ' XP).'));

      ttsMode && !Sp.ttsSupported ? h('p', { class: 'notice', style: 'margin-bottom:10px' }, 'Этот браузер не умеет озвучивать текст сам. Выберите записанный голос.') : null,
      h('div', { class: 'settings' },

  function transferCard() {

  function backupCard() {
    const out = h('textarea', { class: 'backup', id: 'backup-out', readonly: true, hidden: true });
    const inp = h('textarea', { class: 'backup', id: 'backup-in', placeholder: 'Вставьте сюда сохранённую копию', hidden: true });
    const file = h('input', { type: 'file', id: 'backup-file', accept: '.json,application/json,text/plain', hidden: true });
    file.onchange = () => {
      const f = file.files && file.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { inp.hidden = false; inp.value = String(r.result); };
      r.readAsText(f);
    };
    return h('div', { class: 'card stack' },
      h('p', { class: 'small muted' }, 'Прогресс хранится в браузере. Чтобы перенести его на другое устройство, скопируйте текст копии и вставьте его там.'),
      h('div', { class: 'row', style: 'flex-wrap:wrap' },
        h('button', { class: 'btn sm', type: 'button', onclick: async () => {
          out.value = St.exportJSON();
